name: Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pages:
    name: Build and publish
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.ZAKA_SITE_ORIGIN }}
    env:
      ZAKA_PDA_FONT_SECRET: ${{ secrets.ZAKA_PDA_FONT_SECRET }}
      ZAKA_SITE_ORIGIN: ${{ vars.ZAKA_SITE_ORIGIN }}
      CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
      MISE_ENABLE_TOOLS: rust,bun,cargo-binstall,cargo:trunk,cargo:cargo-leptos
    steps:
      - uses: actions/checkout@v4

      # mise installs the tools of mise.toml that the site build needs.
      - uses: jdx/mise-action@v5

      - uses: Swatinem/rust-cache@v2

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/trunk
            ~/.cache/cargo-leptos
          key: web-tools-${{ hashFiles('Cargo.lock', '**/Trunk.toml') }}
          restore-keys: web-tools-

      - name: Build and publish to Cloudflare Pages
        run: mise run pages:publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
