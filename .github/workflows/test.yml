name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run the tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # A host with no C compiler fails the native build tests; it does not skip them.
      ZAKA_REQUIRE_CC: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Windows builds with the GNU host: the C and native targets link with
      # MinGW, and the runtime lib they carry is built for that host.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ runner.os == 'Windows' && 'stable-x86_64-pc-windows-gnu' || 'stable' }}

      # windows-latest has no gcc on the PATH: MinGW from MSYS2 gives the C
      # target a compiler, and no Visual Studio is involved. The runtime lib
      # carries its own libffi on each host.
      - name: Install MinGW (Windows)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            make

      # The ucrt64 folder alone joins the PATH, so `cc` and `gcc` are found
      # and the MSYS tools do not shadow the Windows ones.
      - name: Put MinGW on the PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'ucrt64\bin'
          Add-Content -Path $env:GITHUB_PATH -Value $bin

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - uses: Swatinem/rust-cache@v2

      # The credits test reads cargo metadata offline, and that needs the
      # crates of each platform, not just the ones this runner builds.
      - name: Fetch the crates
        run: cargo fetch --locked

      - name: Run the tests
        if: runner.os != 'Windows'
        run: cargo nextest run --workspace --locked --no-fail-fast

      # libffi-sys builds its vendored libffi for a GNU target with sh, cp and
      # make: the MSYS tools join the end of the PATH, so they shadow no
      # Windows tool.
      - name: Run the tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$env:PATH;${{ steps.msys2.outputs.msys2-location }}\usr\bin"
          cargo nextest run --workspace --locked --no-fail-fast
