name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}${{ matrix.host && format(', {0} toolchain', matrix.host) || '' }})
    runs-on: ${{ matrix.os }}
    env:
      # A host with no C compiler fails the native build tests; it does not skip them.
      ZAKA_REQUIRE_CC: "1"
    strategy:
      fail-fast: false
      # Windows runs twice: zakac built with the GNU host and with the MSVC
      # host. Each carries the runtime lib of both ABIs and tests both.
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: macos-latest
          - os: windows-latest
            host: gnu
            other: msvc
          - os: windows-latest
            host: msvc
            other: gnu
    steps:
      - uses: actions/checkout@v4

      # On Windows the toolchain of the host, and the target of the other ABI,
      # whose runtime lib zakac carries too; on each host the targets of WASI,
      # whose runtime libs zakac carries as well.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.host && format('stable-x86_64-pc-windows-{0}', matrix.host) || 'stable' }}
          targets: ${{ matrix.other && format('x86_64-pc-windows-{0},wasm32-wasip1,wasm32-wasip2', matrix.other) || 'wasm32-wasip1,wasm32-wasip2' }}

      # windows-latest has no gcc on the PATH: MinGW from MSYS2 gives the GNU
      # ABI a compiler, and the Visual Studio of the runner gives MSVC its `cl`.
      # The runtime lib carries its own libffi on each host.
      - name: Install MinGW (Windows)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            make

      # The ucrt64 folder alone joins the PATH, so `cc` and `gcc` are found
      # and the MSYS tools do not shadow the Windows ones.
      - name: Put MinGW on the PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'ucrt64\bin'
          Add-Content -Path $env:GITHUB_PATH -Value $bin

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,wasmtime

      # The WASI tests build with the Clang of wasi-sdk and run under
      # wasmtime; Linux runs them, and fails rather than skips them. The
      # build of wasi-sdk matches the CPU of the runner, x86_64 or arm64.
      - name: Install wasi-sdk (Linux)
        if: runner.os == 'Linux'
        run: |
          arch=$([ "$RUNNER_ARCH" = "ARM64" ] && echo arm64 || echo x86_64)
          curl -sSfL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-$arch-linux.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk-34.0-$arch-linux" >> "$GITHUB_ENV"
          echo "ZAKA_REQUIRE_WASI=1" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2

      # The credits test reads cargo metadata offline, and that needs the
      # crates of each platform, not just the ones this runner builds.
      - name: Fetch the crates
        run: cargo fetch --locked

      - name: Run the tests
        if: runner.os != 'Windows'
        run: cargo nextest run --workspace --locked --no-fail-fast

      # libffi-sys builds its vendored libffi for a GNU target with sh, cp and
      # make: the MSYS tools join the end of the PATH, so they shadow no
      # Windows tool. The sh of Git for Windows comes first on the runner, and
      # configure writes its path, whose space ("Program Files") breaks the
      # make of libtool, so the folders of Git leave the PATH of this step.
      - name: Run the tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $kept = ($env:PATH -split ';') | Where-Object { $_ -notlike '*\Git\*' }
          $env:PATH = ($kept -join ';') + ";${{ steps.msys2.outputs.msys2-location }}\usr\bin"
          Get-Command sh, make, cp, gcc | Format-Table Name, Source -AutoSize
          cargo nextest run --workspace --locked --no-fail-fast

      # The executables of the other ABI: the C and native suites again.
      - name: Run the native tests for the other ABI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ZAKA_TEST_ABI: ${{ matrix.other }}
        run: |
          $kept = ($env:PATH -split ';') | Where-Object { $_ -notlike '*\Git\*' }
          $env:PATH = ($kept -join ';') + ";${{ steps.msys2.outputs.msys2-location }}\usr\bin"
          cargo nextest run -p zakac_codegen_target_c -p zakac_codegen_target_native --locked --no-fail-fast
