[package]
name = "zaka_vscode"
version = "0.1.0"
edition.workspace = true
description = "Zaka (စံကား) for VS Code: errors while editing, colors, and kinds on hover, from the zakac language server."
license = "MIT"
repository = "https://github.com/heinthanth/zaka"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bon = { workspace = true }
js-sys = { workspace = true }
serde = { workspace = true }
serde-wasm-bindgen = { workspace = true }
wasm-bindgen = { workspace = true }

[build-dependencies]
cargo-build = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
zakac_rust_sugars = { workspace = true }
