[package]
name = "zaka_web_ui_common"
version = "0.1.0"
edition.workspace = true

[dependencies]
bon = { workspace = true }
codee = { workspace = true }
js-sys = { workspace = true }
leptos = { workspace = true }
leptos-scoped-style = { workspace = true }
leptos-use-color-mode = { workspace = true }
leptos-use-css-var = { workspace = true }
leptos-use-event-listener = { workspace = true }
leptos-use-on-click-outside = { workspace = true }
leptos-use-storage = { workspace = true }
leptos-use-window = { workspace = true }
rust-i18n = { workspace = true }
strum = { workspace = true }
turf = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
zakac_i18n = { workspace = true }
zakac_lexer = { workspace = true }
zakac_rust_sugars = { workspace = true }
zakac_span = { workspace = true }

[dependencies.web-sys]
workspace = true
features = [
    "Document",
    "DomRect",
    "Element",
    "FontFace",
    "FontFaceDescriptors",
    "FontFaceSet",
    "HtmlDialogElement",
    "HtmlElement",
    "HtmlHeadElement",
    "KeyboardEvent",
    "ScrollIntoViewOptions",
    "ScrollLogicalPosition",
    "Window",
    "console",
]

[features]
# Render on a server: the leptos-use hooks then leave the DOM alone.
ssr = [
    "leptos-use-color-mode/ssr",
    "leptos-use-css-var/ssr",
    "leptos-use-event-listener/ssr",
    "leptos-use-on-click-outside/ssr",
    "leptos-use-storage/ssr",
    "leptos-use-window/ssr",
]

[build-dependencies]
age = { workspace = true }
cargo-build = { workspace = true }

# turf: the controls sheet, built with its classes renamed after a hash. The
# names come from the content of the sheet alone, never at random: the pages
# rendered on a server and their islands are built apart and must agree.
[package.metadata.turf]
minify = true

[package.metadata.turf.class_names]
template = "z<name_hash_short><style_sheet_hash_short>"

# Debug builds keep the source name in front, so the classes read in the
# browser tools.
[package.metadata.turf-dev]
minify = true

[package.metadata.turf-dev.class_names]
template = "<original_name>-<style_sheet_hash_short>"
