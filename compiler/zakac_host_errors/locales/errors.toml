_version = 2

[errors.file_not_found]
en = "can't find %{p}"

[errors.permission_denied]
en = "can't access %{p}"

[errors.file_is_a_folder]
en = "%{p} is a folder, was expecting a file"

[errors.folder_is_a_file]
en = "%{p} is a file, was expecting a folder"

[errors.failed_to_read_file]
en = "failed to read %{p}"

[errors.failed_to_write_file]
en = "failed to write %{p}"

[errors.generic_io_error]
en = "unexpected IO error occurred while working with %{p}: %{e}"

[errors.generic_error]
en = "unexpected internal error occurred: %{e}"

[errors.unsupported_artifact_format]
en = "unsupported artifact format for %{p}"

[errors.failed_to_decode_artifact]
en = "failed to decode artifact from %{p}: %{e}"

[errors.runtime_trap]
en = "the program stopped: %{e}"

[errors.no_c_compiler]
en = "no C compiler found: set CC, pass --cc, set cc in a config file, or put gcc, clang or zig on the PATH (on Windows, llvm-mingw, w64devkit or Zig need no Visual Studio)"

[errors.flag_not_for_target]
en = "%{flag} does not go with --backend %{target}"

[errors.built_for_other_host]
en = "this program was built for %{built}, and this host is %{host}: build it again with the --target-os, --target-arch and --target-abi of this host"

[errors.no_wasi_compiler]
en = "no C compiler for %{triple} found: set WASI_SDK_PATH to the folder of wasi-sdk, pass --cc, or put %{triple}-clang on the PATH"

[errors.lib_with_no_exports]
en = "a C lib needs a function that code outside can call: mark one with \"<C name>\" အမည်ဖြင့် ပြင်ပမှ ခေါ်ဆိုနိုင်သော"

[errors.lib_on_wasi]
en = "a C lib cannot be built for WASI: build it for another OS"

[errors.lib_name]
en = "the lib name \"%{name}\" cannot go into C names: give --lib-name, of ASCII letters, digits and _, that starts with a letter or _"

[errors.c_functions_on_wasi]
en = "a program for WASI cannot call C functions: WASI loads no shared libs, so build it for another OS"

[errors.c_for_other_host]
en = "the C compiler builds for this host, %{host}, not for %{target}: give --emit c to write the C files and build them there"

[errors.tool_not_found]
en = "can't find %{tool}: give a program on the PATH, or a path to one"

[errors.c_compiler_failed]
en = "the build step of %{cc} failed"

[errors.not_for_target_c]
en = "the C target cannot build %{what} at present"

[errors.not_for_native]
en = "the native target cannot build %{what} at present"

[errors.arch_not_for_native]
en = "the native target builds for x86_64, aarch64 and riscv64, not for %{arch}: give --backend c, or --backend vm"

[errors.runtime_not_carried]
en = "this zakac carries no runtime lib for the ABI %{abi}: build zakac with the Rust target of that ABI installed (for a Windows ABI, with its C tools too), or give another --target-abi"

[errors.native_for_other_host]
en = "the native target links for this host, %{host}, not for %{target}: give --emit obj to write the object file and link it there"

[errors.config_not_toml]
en = "the config file %{p} is not valid TOML: %{e}"

[errors.dep_named_std]
en = "the config file %{p} lists a dep named \"စံကား\", the name of the stdlib: pick another name"

[errors.config_unknown_name]
en = "the config file %{p} sets %{name}, which no command here takes"

[errors.config_bad_value]
en = "the config file %{p} gives %{name} a value of the wrong form: use text, a number, true or false, or a list of these"

[errors.config_refused_value]
en = "the config file %{p} gives %{name} a value the flag refuses: %{msg}"

[errors.unknown_lint_name]
en = "%{name} names no lint: give a group (mem, leaks, frees, borrows, nulls, pointers, doubts, overflow, naturalness, spoken, duplicates) or a code such as ZK0708"

[errors.not_a_lint]
en = "%{code} is not a lint: its level cannot change"

[errors.unknown_check]
en = "%{name} names no run-time check: give none, default, mem, or a check (divide, shift, bounds, text, step, depth, null, overlap, sanitizers), with + or - in front to add or drop it"
