_version = 2

[errors.file_not_found]
en = "can't find %{p}"

[errors.permission_denied]
en = "can't access %{p}"

[errors.file_is_a_folder]
en = "%{p} is a folder, was expecting a file"

[errors.folder_is_a_file]
en = "%{p} is a file, was expecting a folder"

[errors.failed_to_read_file]
en = "failed to read %{p}"

[errors.failed_to_write_file]
en = "failed to write %{p}"

[errors.generic_io_error]
en = "unexpected IO error occurred while working with %{p}: %{e}"

[errors.generic_error]
en = "unexpected internal error occurred: %{e}"

[errors.unsupported_artifact_format]
en = "unsupported artifact format for %{p}"

[errors.failed_to_decode_artifact]
en = "failed to decode artifact from %{p}: %{e}"

[errors.runtime_trap]
en = "the program stopped: %{e}"

[errors.no_c_compiler]
en = "no C compiler found: set CC, pass --cc, set cc in a config file, or put gcc, clang or zig on the PATH (on Windows, llvm-mingw, w64devkit or Zig need no Visual Studio)"

[errors.flag_not_for_target]
en = "%{flag} does not go with --target %{target}"

[errors.tool_not_found]
en = "can't find %{tool}: give a program on the PATH, or a path to one"

[errors.c_compiler_failed]
en = "the build step of %{cc} failed"

[errors.not_for_target_c]
en = "the C target cannot build %{what} at present"

[errors.config_not_toml]
en = "the config file %{p} is not valid TOML: %{e}"

[errors.config_unknown_name]
en = "the config file %{p} sets %{name}, which no command here takes"

[errors.config_bad_value]
en = "the config file %{p} gives %{name} a value of the wrong form: use text, a number, true or false, or a list of these"

[errors.unknown_lint_name]
en = "%{name} names no lint: give a group (mem, leaks, frees, borrows, nulls, pointers, doubts, overflow) or a code such as ZK0708"

[errors.not_a_lint]
en = "%{code} is not a lint: its level cannot change"

[errors.unknown_check]
en = "%{name} names no run-time check: give none, default, mem, or a check (divide, shift, bounds, text, step, depth, null, overlap, sanitizers), with + or - in front to add or drop it"
