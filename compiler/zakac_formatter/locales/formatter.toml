_version = 2

[formatter.about]
en = "Format Zaka source files: the space between words, the line breaks and the indent."

[formatter.paths]
en = "Files and folders to format; a folder is walked for .zaka files. With none, or -, standard input is formatted to standard output."

[formatter.check]
en = "Write nothing: list the files that would change, and fail when one would."

[formatter.indent]
en = "Spaces for each level of block depth; 0 keeps each line flush left."

[formatter.continuation_indent]
en = "The indent of the later lines of one statement: preserve keeps the spaces as written, a number sets that count past the depth."

[formatter.blank_lines_max]
en = "The longest run of blank lines that is kept."

[formatter.one_statement_per_line]
en = "Start a new line after ။ when two statements share a line."

[formatter.mark_order]
en = "Write the Burmese marks in their canonical order."

[formatter.speech_mode]
en = "The form of each reserved word: written (ထားမည်) or spoken (ထားမယ်)."

[formatter.digits]
en = "The digits of number literals: preserve, burmese or latin."

[formatter.import_order]
en = "The order of the imports at the head of a file: preserve, or sorted with the stdlib first."

[formatter.max_width]
en = "The widest line, in characters as an editor counts its columns, that a line laid out to fit takes before it breaks."

[formatter.struct_lines]
en = "The lines of a struct: preserve keeps them, split puts each field on a line, fit does so when the struct does not fit in the widest line."

[formatter.enum_lines]
en = "The lines of an enumeration: preserve keeps them, split puts each member on a line, fit does so when it does not fit in the widest line."

[formatter.signature_lines]
en = "The lines of a function signature: preserve keeps them, split puts the name, each parameter and the opener on lines of their own, fit does so when it does not fit in the widest line."

[formatter.inline_block_lines]
en = "The line of a block written as one statement after its condition or loop head: preserve keeps it, split puts the statement on a line of its own, fit does so when the line does not fit in the widest line."

[formatter.wrap_long_lines]
en = "Wrap each other line wider than the widest line: at the end of a clause first, then after ၊, then at a space."

[formatter.changed]
en = "the formatted text of %{file} reads as other words, so it was left as it is; this is a fault of the formatter"
