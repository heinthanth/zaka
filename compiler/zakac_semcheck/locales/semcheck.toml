_version = 2

[semcheck.about]
en = "Check names, scopes and data kinds of a parsed program."

[semcheck.platform_bits]
en = "Bit width of the platform-sized integer kinds."

[semcheck.target_os]
en = "The OS the program is built for; the host's when not given."

[semcheck.target_arch]
en = "The CPU architecture the program is built for; the host's when not given."

[semcheck.instance_use]
en = "in the instance \"%{n}\", which this use asks for"

[semcheck.want.number]
en = "a number"

[semcheck.want.int]
en = "an integer"

[semcheck.want.unsigned]
en = "an unsigned integer"

[semcheck.want.signed]
en = "a signed number"

[semcheck.want.bool]
en = "a boolean"

[semcheck.want.ordered]
en = "a number or a character"

[semcheck.want.text]
en = "text"

[semcheck.artifact.source_changed]
en = "source text changed after re-ingest"

[semcheck.what.literal]
en = "a literal"

[semcheck.what.call]
en = "the result of a call"

[semcheck.what.value]
en = "a computed value"
