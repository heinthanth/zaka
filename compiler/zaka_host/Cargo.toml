[package]
name = "zaka_host"
description = "The functions the host serves to a Zaka program: their table, values and worlds"
version = "0.2.0"
edition.workspace = true

[dependencies]
bon = { workspace = true }
chrono = { workspace = true, features = ["alloc"] }
getrandom = { workspace = true }
serde = { workspace = true }
strum = { workspace = true }
zakac_rust_sugars = { workspace = true }

# The explorer runs in a browser, where the OS source is crypto.getRandomValues.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
