_version = 2

# ---------------------------------------------------------------- lexer ZK01xx

[codes.ZK0101.title]
en = "invalid character"
[codes.ZK0101.message]
en = "invalid character in \"%{w}\""
[codes.ZK0101.help_comma]
en = "lists are separated with \"၊\", not \",\""
[codes.ZK0101.explain]
en = """A word holds a character that cannot start or continue a token. Identifiers start with a letter, an underscore or an emoji and continue with letters, digits, underscores or emoji; operators are the ASCII punctuation the language defines. Other punctuation such as \",\", \";\", \"=\" on its own or \"?\" has no meaning in the language. The word is skipped and lexing goes on with the next one."""

[codes.ZK0102.title]
en = "invalid number literal"
[codes.ZK0102.message]
en = "invalid number literal \"%{w}\""
[codes.ZK0102.explain]
en = """A word that starts with a digit must be a number literal: a run of digits in one script, with an optional fraction and exponent, or (for Western digits) ASCII letters that stand for digits above 9 after a base prefix. A Burmese digit run followed with letters in the same word, such as a bit count written attached to \"ဘစ်\", is not a number; put a space between the two words."""

[codes.ZK0103.title]
en = "mixed digit scripts"
[codes.ZK0103.message]
en = "Burmese and Western digits cannot be mixed in one number"
[codes.ZK0103.explain]
en = """A number literal uses one digit script: either Burmese digits (၀ to ၉) or Western digits (0 to 9). This literal switches script inside the number, in its fraction, or where two digit runs touch without a space. Rewrite the whole literal in one script."""

[codes.ZK0104.title]
en = "unterminated string literal"
[codes.ZK0104.message]
en = "string literal is missing its closing quote before the end of the line"
[codes.ZK0104.explain]
en = """A string literal starts and ends with a double quote on the same line. The lexer reached the end of the line without finding the closing quote. Add the quote, or write \\\" for a double quote that belongs to the text. The text read so far is kept so later phases can go on."""

[codes.ZK0105.title]
en = "unterminated character literal"
[codes.ZK0105.message]
en = "character literal is missing its closing quote before the end of the line"
[codes.ZK0105.explain]
en = """A character literal starts and ends with a single quote on the same line. The lexer reached the end of the line without finding the closing quote. Add the quote, or write \\' for a single quote that belongs to the literal."""

[codes.ZK0106.title]
en = "unknown escape sequence"
[codes.ZK0106.message]
en = "unknown escape sequence \"%{e}\""
[codes.ZK0106.help_brace]
en = "write \"{{\" or \"}}\" for a literal brace"
[codes.ZK0106.explain]
en = """Inside a string or character literal, a backslash starts one of the escapes \\n, \\r, \\t, \\0, \\\\, \\', \\\" or \\u with four or eight hex digits, and braces hold a named escape such as {နောက်တစ်ကြောင်း} or {ယူနီကုဒ် HHHH}. This escape matches none of them. Braces are reserved for named escapes and, later, variable substitution, so a literal brace is written doubled: {{ or }}."""

[codes.ZK0107.title]
en = "wrong character literal length"
[codes.ZK0107.message]
en = "a character literal must hold one character, found %{n}"
[codes.ZK0107.explain]
en = """A character literal holds one Unicode scalar value between its quotes: one letter, one digit, one escape, or one emoji. This literal holds a different count. A Burmese vanna with its signs counts as several scalar values; use a string literal for text that is longer than one scalar value."""

[codes.ZK0108.title]
en = "unterminated raw identifier"
[codes.ZK0108.message]
en = "raw identifier is missing its closing backtick before the end of the line"
[codes.ZK0108.explain]
en = """A raw identifier is written between backticks on one line and can hold spaces, reserved words and operator characters. The lexer reached the end of the line without finding the closing backtick. Add it, or remove the opening one."""

[codes.ZK0109.title]
en = "blank raw identifier"
[codes.ZK0109.message]
en = "raw identifier between backticks is blank"
[codes.ZK0109.explain]
en = """Two backticks with nothing between them do not name a variable. A raw identifier needs at least one character between the backticks."""

# --------------------------------------------------------------- parser ZK02xx

[parser.help_split]
en = "write \"%{s} %{p}\" with a space: a name joined to a particle is read as one word"

[codes.ZK0201.title]
en = "unexpected token"
[codes.ZK0201.message]
en = "expected %{e}, found %{f}"
[codes.ZK0201.explain]
en = """The parser reached a token that does not fit the statement at this point; the message names what the grammar allows here. A common cause is a name written attached to a particle, such as \"အသက်ကို\": a word that is not made of reserved words alone is one identifier, so write a space between the name and the particle."""

[codes.ZK0202.title]
en = "missing operand"
[codes.ZK0202.message]
en = "expected an operand, found %{f}"
[codes.ZK0202.explain]
en = """An operand is a literal, a name, a call expression, or an expression in parentheses. A particle such as \"ကို\" or \"နှင့်\" is followed with an operand or with the verb that closes the clause, and an operator such as \"+\" is followed with an operand. Here neither comes next."""

[codes.ZK0203.title]
en = "statement verb missing"
[codes.ZK0203.message]
en = "this statement does not end in a statement verb, found %{f}"
[codes.ZK0203.help]
en = "a statement ends in \"ပြသပါ\", \"ထားပါ\" or \"ရလဒ်အဖြစ် ပြန်ပေးပါ\", or is a loop with \"နေသရွေ့\" or \"မှ ... အထိ\""
[codes.ZK0203.explain]
en = """A statement that does not start with a reserved word is a clause that ends in a statement verb: \"ပြသပါ\" (print), \"ထားပါ\" (assign) or \"ရလဒ်အဖြစ် ပြန်ပေးပါ\" (return a value). It can also be a condition followed with \"နေသရွေ့\" (a while loop) or a bound followed with \"မှ\" (a counted loop). This statement ends in a value and none of these."""

[codes.ZK0204.title]
en = "statement verb inside an expression"
[codes.ZK0204.message]
en = "statement verb \"%{v}\" cannot stand inside an expression"
[codes.ZK0204.explain]
en = """Statement verbs such as \"ပြသပါ\" and \"ထားပါ\" close a whole statement and produce no value. Here one appears inside parentheses, a call argument or a condition, where a value is needed. Move the statement out, or use a verb-noun such as \"ပေါင်းလဒ်\" that produces a value."""

[codes.ZK0205.title]
en = "too few operands"
[codes.ZK0205.message]
en = "\"%{v}\" needs %{n} operands, found %{m}"
[codes.ZK0205.explain]
en = """Each verb takes a fixed number of operands, each followed with its particle: \"ပေါင်းလဒ်\" takes two (\"a နှင့် b ၏\"), \"ဘစ်အလိုက် ပြောင်းပြန်ပြောင်းလဒ်\" takes one (\"a ၏\"), and \"ထားပါ\" takes two (\"x ကို v ဟု\"). The clause before this verb holds fewer operands than the verb needs."""

[codes.ZK0206.title]
en = "wrong particle for the verb"
[codes.ZK0206.message]
en = "\"%{v}\" needs \"%{e}\" after operand %{i}, found %{f}"
[codes.ZK0206.explain]
en = """A verb checks the particle that follows each of its operands. \"ပေါင်းလဒ်\" wants \"a နှင့် b ၏\", \"စားသော စားလဒ်\" wants \"a ကို b ဖြင့်\", the comparisons want \"a သည် b\" then \"နှင့်\", \"ထက်\" or \"အောက်\", and \"ထားပါ\" wants \"x ကို v ဟု\". The operand named in the message carries a different particle, or none."""

[codes.ZK0207.title]
en = "two particles on one operand"
[codes.ZK0207.message]
en = "this operand has the particle \"%{p}\" before this one"
[codes.ZK0207.explain]
en = """Each operand in a clause is followed with one particle that names its role. Two particles in a row leave the second one without an operand. Remove one of them, or write the missing operand between them."""

[codes.ZK0208.title]
en = "clause without a verb"
[codes.ZK0208.message]
en = "operands wait for a verb: %{w}"
[codes.ZK0208.explain]
en = """In a clause, each operand is followed with the particle of its role, and a verb at the end takes the operands it needs. Here operands are left over at the end of the clause; the message lists them with their particles. Add the verb that takes them, or remove the stranded particle."""

[codes.ZK0209.title]
en = "operands before a statement verb"
[codes.ZK0209.message]
en = "operands left over before \"%{v}\": %{w}"
[codes.ZK0209.explain]
en = """A statement verb takes its own operands and ends the statement, so no operand can be left waiting before it. The listed operands belong to no verb; add the verb that needs them, or remove them."""

[codes.ZK0210.title]
en = "chained comparison"
[codes.ZK0210.message]
en = "a comparison cannot be the operand of another comparison"
[codes.ZK0210.help]
en = "join the two comparisons with \"ဖြစ်၍\", or put the inner one in parentheses"
[codes.ZK0210.explain]
en = """Comparisons do not chain: \"a < b < c\" and \"a သည် b နှင့် ညီ သည် c နှင့် ညီသည်\" are errors. Write \"a < b ဖြစ်၍ b < c\" to test both. A comparison in parentheses is a plain boolean operand and can be compared again."""

[codes.ZK0211.title]
en = "else without if"
[codes.ZK0211.message]
en = "\"%{w}\" must follow the block of a conditional"
[codes.ZK0211.explain]
en = """\"ထိုသို့မဟုတ်ဘဲ\" (else if) and \"သို့မဟုတ်ပါက\" (else) continue a conditional statement. These come right after the block or the single statement of an \"အကယ်၍\" arm, and cannot start a statement on their own."""

[codes.ZK0212.title]
en = "update outside a generic loop"
[codes.ZK0212.message]
en = "\"ပြီးလျှင်\" can appear as the last statement of a generic loop and nowhere else"
[codes.ZK0212.explain]
en = """\"ပြီးလျှင်\" (when done) marks the update of a generic loop, the statement that runs after each iteration. It is allowed as the last statement in the block of a loop that starts with \"ကိန်းရှင် ... ဖြစ်ကာ\" or \"ကိန်းရှင် ... ဖြစ်ပြီး\", and nowhere else."""

[codes.ZK0213.title]
en = "update is not last"
[codes.ZK0213.message]
en = "the \"ပြီးလျှင်\" update must be the last statement of the loop"
[codes.ZK0213.explain]
en = """The update of a generic loop runs after the rest of the block, so it is written last, right before the block closer. Move the statements that follow it above it."""

[codes.ZK0214.title]
en = "nested function"
[codes.ZK0214.message]
en = "functions can be declared at the top level and nowhere else"
[codes.ZK0214.explain]
en = """A function declaration cannot appear inside a block, a loop, a conditional or another function. Move it to the top level of the file; functions can be called before their declaration."""

[codes.ZK0215.title]
en = "conditional as a single-statement block"
[codes.ZK0215.message]
en = "a single-statement block cannot be another conditional"
[codes.ZK0215.explain]
en = """When a conditional arm has no block phrase, its block is the single statement that follows. That statement cannot itself be a conditional, so that each else arm belongs to one clear conditional. Wrap the inner conditional in \"အောက်ပါတို့ကို လုပ်ဆောင်ပါ။\" and \"လုပ်ဆောင်စရာများ ပြီးဆုံးပါပြီး။\"."""

[codes.ZK0216.title]
en = "invalid bit count"
[codes.ZK0216.message]
en = "%{n} is not a valid bit count here; use %{a}"
[codes.ZK0216.explain]
en = """Integer kinds come in 8, 16, 32, 64 and 128 bits, floating-point kinds in 16, 32, 64 and 128 bits. The bit count is written in decimal before \"ဘစ်\", in Burmese or Western digits."""

[codes.ZK0217.title]
en = "sign word on a kind that is not an integer"
[codes.ZK0217.message]
en = "a sign word can stand before \"ကိန်းပြည့်\" and no other kind"
[codes.ZK0217.explain]
en = """Floating-point numbers are signed, and characters and booleans have no sign, so the sign words \"လက္ခဏာရှိ\" and \"လက္ခဏာမဲ့\" are allowed in integer kinds and nowhere else."""

[codes.ZK0218.title]
en = "invalid number base"
[codes.ZK0218.message]
en = "%{b} is not a number base; use a decimal integer from 2 to 36"
[codes.ZK0218.explain]
en = """The base prefix \"အခြေ N ဖြင့်\" takes a decimal integer from 2 to 36. Digits above 9 are written as the letters A to Z."""

[codes.ZK0219.title]
en = "invalid digit"
[codes.ZK0219.message]
en = "\"%{d}\" is not a digit in base %{b}"
[codes.ZK0219.explain]
en = """Each digit of a literal must be below its base: 0 and 1 in base 2, 0 to 9 in base 10, and the letters A to Z (in either case) for 10 to 35 in higher bases. Letters are allowed after a base prefix above 10 and nowhere else, and a literal with a base prefix has integer digits but no fraction or exponent."""

[codes.ZK0220.title]
en = "literal out of range"
[codes.ZK0220.message]
en = "literal %{l} does not fit its kind"
[codes.ZK0220.explain]
en = """An integer literal must fit its kind: the bit count of its kind prefix, or 64 bits when no prefix is written. Unsigned kinds hold 0 to 2^bits - 1. Signed decimal literals hold up to 2^(bits-1), so that \"-128\" fits an 8-bit integer. A literal with a base prefix is a bit pattern of the full width."""

[codes.ZK0221.title]
en = "fraction in an integer literal"
[codes.ZK0221.message]
en = "an integer kind cannot hold a literal with a fraction or exponent"
[codes.ZK0221.explain]
en = """The kind prefix \"ကိန်းပြည့်\" makes the literal an integer, but this literal is written with a fraction or an exponent. Use \"ဒဿမကိန်း\" for a floating-point literal, or remove the fraction."""

[codes.ZK0222.title]
en = "invalid literal kind"
[codes.ZK0222.message]
en = "a literal kind prefix must be an integer or floating-point kind"
[codes.ZK0222.explain]
en = """A kind prefix such as \"လက္ခဏာမဲ့ ၈ ဘစ် ကိန်းပြည့်\" fixes the kind of the number that follows. Characters and booleans have literals of their own ('က', \"မှန်\"), so \"စာလုံး\" and \"မှန်မှားတန်ဖိုး\" cannot prefix a number."""

[codes.ZK0225.title]
en = "constant loop variable"
[codes.ZK0225.message]
en = "a generic loop variable must be declared with \"ကိန်းရှင်\""
[codes.ZK0225.explain]
en = """A generic loop updates its variable after each iteration, so the header starts with \"ကိန်းရှင်\" (variable). \"ကိန်းသေ\" (constant) declares a value that never changes and cannot start a loop."""

[codes.ZK0226.title]
en = "unmatched block closer"
[codes.ZK0226.message]
en = "this block closer has no open block to close"
[codes.ZK0226.explain]
en = """\"လုပ်ဆောင်စရာများ ပြီးဆုံးပါပြီး။\" closes the block opened with \"အောက်ပါတို့ကို လုပ်ဆောင်ပါ။\" or with a function opener. Here no block is open. Remove the closer, or add the opener it belongs to."""

[codes.ZK0227.title]
en = "bad list count"
[codes.ZK0227.message]
en = "\"%{n}\" is not a cell count; write a whole number above zero, in digits or worked out from constants"
[codes.ZK0227.explain]
en = """A list kind with a count, \"အကွက် <n> ခုရှိသော <kind> စာရင်း\", takes a whole number above zero. Write it in digits, such as ၃ or 10, or work it out at compile time: \"အကွက် N * ၂ ခုရှိသော\" takes each expression the compiler folds to an integer: literals, constants (declared before it, at the top of the file, or imported), the arithmetic, bitwise and shift operators in each spelling, conversions, sizes, cells and fields of constant lists and structs, and the cell count of a counted list. A list with no cells holds nothing, and the count cannot come from a variable: the kind must be known before the program runs."""

[codes.ZK0228.title]
en = "nested struct"
[codes.ZK0228.message]
en = "structs can be declared at the top level and nowhere else"
[codes.ZK0228.explain]
en = """A struct declaration, \"ဒေတာအမျိုးအစား <name> တွင် ... တို့ ပါဝင်သည်။\", cannot appear inside a block, a loop, a conditional or a function. Move it to the top level of the file; a struct can be used before its declaration."""

[codes.ZK0229.title]
en = "misplaced export mark"
[codes.ZK0229.message]
en = "\"အများသုံး\" marks a top-level function, struct, variable or constant, and nothing else"
[codes.ZK0229.explain]
en = """The export mark \"အများသုံး\" stands right before \"လုပ်ဆောင်ချက်\", \"ဒေတာအမျိုးအစား\", \"ကိန်းရှင်\" or \"ကိန်းသေ\" at the top level of a file, and lets other files import that declaration. It cannot mark a statement, a loop, or a declaration inside a block."""

[codes.ZK0230.title]
en = "misplaced import"
[codes.ZK0230.message]
en = "imports go at the top of the file"
[codes.ZK0230.help]
en = "move it above the first declaration or statement"
[codes.ZK0230.explain]
en = """An import, \"\"<file>\" မှ <name> ကို ထည့်သွင်းပါ။\", names what a file takes from another file. The imports of a file come first, ahead of each declaration and statement, and never inside a block."""

[codes.ZK0231.title]
en = "circular import"
[codes.ZK0231.message]
en = "this import goes in a circle: %{chain}"
[codes.ZK0231.explain]
en = """Files that import each other, at once or through other files, cannot be read one after the other. Move what both files need to a third file, and import it from both."""

[codes.ZK0232.title]
en = "import without a file"
[codes.ZK0232.message]
en = "this program was not read from a file, so it cannot import \"%{f}\""
[codes.ZK0232.explain]
en = """An import names a file relative to the file that holds the import. A program written in the compiler explorer, on a Learn page or on standard input has no folder, so its imports cannot be found. Save the program in a file and run it with \"zakac run\"."""

[codes.ZK0233.title]
en = "count on a slice"
[codes.ZK0233.message]
en = "a slice takes no cell count; its count comes when the program runs"
[codes.ZK0233.explain]
en = """A slice kind, \"<kind> စာရင်း တစ်စိတ်တစ်ပိုင်း\", views cells whose number is known at run time, so the \"စာရင်း\" before \"တစ်စိတ်တစ်ပိုင်း\" takes no \"အကွက် <n> ခုရှိသော\" prefix. Remove the count, or drop \"တစ်စိတ်တစ်ပိုင်း\" for a list of that count."""

[codes.ZK0234.title]
en = "kind without a classifier"
[codes.ZK0234.message]
en = "a declared kind takes \"တစ်\" and a classifier"
[codes.ZK0234.help]
en = "write \"%{k} တစ်%{c}\", then \"ဖြစ်၍ တန်ဖိုးသည် <value>\" for a value"
[codes.ZK0234.explain]
en = """A declaration counts its variable as Burmese counts a thing: the kind, then \"တစ်\" (one) and the classifier of the kind. Most kinds take \"ခု\", \"စာလုံး\" takes \"လုံး\", and a struct takes the classifier its declaration gives. A value follows with \"ဖြစ်၍ တန်ဖိုးသည်\". To have the compiler take the kind from the value, leave the kind out and write the value alone."""

# -------------------------------------------------------------- resolve ZK03xx

[codes.ZK0301.title]
en = "undeclared name"
[codes.ZK0301.message]
en = "\"%{n}\" is not declared"
[codes.ZK0301.explain]
en = """A name is used before a declaration of it is in scope. Declare the variable with \"ကိန်းရှင်\" or \"ကိန်းသေ\" first, in this block or in a block around it. Names declared inside a block are not visible after the block closer."""

[codes.ZK0302.title]
en = "name declared twice"
[codes.ZK0302.message]
en = "\"%{n}\" is declared before in this scope"
[codes.ZK0302.help]
en = "pick another name, or declare it in an inner block to shadow the outer one"
[codes.ZK0302.explain]
en = """A block cannot declare the same name twice. Shadowing is allowed: an inner block can declare a name that an outer block holds, and the inner declaration hides the outer one until the inner block ends. Rename one of the two declarations, or turn the second one into an assignment."""

[codes.ZK0303.title]
en = "undeclared function"
[codes.ZK0303.message]
en = "function \"%{n}\" is not declared"
[codes.ZK0303.explain]
en = """A call names a function that no top-level \"လုပ်ဆောင်ချက် ... သည်\" declares. Functions can be called before their declaration in the file, but the declaration must exist somewhere at the top level. Check the spelling of the name."""

[codes.ZK0304.title]
en = "function declared twice"
[codes.ZK0304.message]
en = "function \"%{n}\" is declared twice"
[codes.ZK0304.explain]
en = """Two top-level declarations give a function the same name. Function names share one scope for the whole file, so each name can be declared once. Rename one of the two functions; calls use the first declaration."""

[codes.ZK0305.title]
en = "duplicate parameter"
[codes.ZK0305.message]
en = "parameter \"%{n}\" is listed twice"
[codes.ZK0305.explain]
en = """Two parameters of one function have the same name, so the second one would hide the first inside the function. Give each parameter its own name."""

[codes.ZK0306.title]
en = "assignment to a constant"
[codes.ZK0306.message]
en = "\"%{n}\" is a constant and cannot be assigned"
[codes.ZK0306.explain]
en = """A name declared with \"ကိန်းသေ\" keeps its initial value for its whole scope. To change the value later, declare it with \"ကိန်းရှင်\" instead."""

[codes.ZK0307.title]
en = "assignment to a counted-loop variable"
[codes.ZK0307.message]
en = "\"%{n}\" is a counted-loop variable and cannot be assigned"
[codes.ZK0307.explain]
en = """The variable of a counted loop (\"မှ ... အထိ ... အနေဖြင့်\") steps on its own from the first bound to the last. Assigning to it inside the loop would break that count. Use a generic loop when the variable must change in other steps, or put the value in another variable and change that one."""

[codes.ZK0308.title]
en = "constant without a value"
[codes.ZK0308.message]
en = "constant \"%{n}\" needs an initial value"
[codes.ZK0308.explain]
en = """A constant cannot be assigned later, so its declaration must give its value: write \"ဖြစ်၍ တန်ဖိုးသည်\" and the value between the kind and \"ဖြစ်ပါစေ\". A variable declared with \"ကိန်းရှင်\" can leave the value out and starts at the kind's default."""

[codes.ZK0309.title]
en = "break outside a loop"
[codes.ZK0309.message]
en = "\"ကွင်းဆက် ကို ရပ်ပါ\" stands outside a loop"
[codes.ZK0309.explain]
en = """Breaking leaves the innermost while, counted, or generic loop. Here no loop encloses the statement. Remove it, or move it inside a loop."""

[codes.ZK0310.title]
en = "continue outside a loop"
[codes.ZK0310.message]
en = "\"နောက်တစ်ကြိမ်ဆီသို့ ကျော်ပါ\" stands outside a loop"
[codes.ZK0310.explain]
en = """Continuing skips to the next iteration of the innermost while, counted, or generic loop. Here no loop encloses the statement. Remove it, or move it inside a loop."""

[codes.ZK0311.title]
en = "return outside a function"
[codes.ZK0311.message]
en = "a return statement stands outside a function"
[codes.ZK0311.explain]
en = """Returning ends the function that holds the statement. Top-level statements belong to no function, so a return there has nothing to end. Remove it, or move it into a function."""

[codes.ZK0312.title]
en = "value returned from a function without a result"
[codes.ZK0312.message]
en = "function \"%{n}\" returns nothing, but a value is returned"
[codes.ZK0312.explain]
en = """The function header opens with \"အောက်ပါတို့ကို လုပ်ဆောင်မည်\", so the function gives back no value. Write a bare \"ပြန်ပေးပါ။\" to leave the function, or start the statements with \"အောက်ပါတို့ကို လုပ်ဆောင်ကာ <kind> ရလဒ် ကို ပြန်ပေးမည်\"."""

[codes.ZK0313.title]
en = "missing return value"
[codes.ZK0313.message]
en = "function \"%{n}\" returns %{k}, but no value is returned"
[codes.ZK0313.explain]
en = """The function header promises a result, so each return statement must give one: \"<value> ကို ရလဒ်အဖြစ် ပြန်ပေးပါ။\". To return the implicit result variable, write \"ရလဒ် ကို ရလဒ်အဖြစ် ပြန်ပေးပါ။\"."""

[codes.ZK0314.title]
en = "wrong number of arguments"
[codes.ZK0314.message]
en = "function \"%{n}\" takes %{want} arguments, %{got} given"
[codes.ZK0314.explain]
en = """A call must pass one argument for each parameter of the function, in order. Add or remove arguments so the counts match the declaration."""

[codes.ZK0315.title]
en = "function without a result used as a value"
[codes.ZK0315.message]
en = "function \"%{n}\" returns nothing and cannot be used as a value"
[codes.ZK0315.explain]
en = """The call expression \"... လုပ်ဆောင်သော ရလဒ်\" needs the function to return a value, but its header has no result clause. Call it as a statement with \"လုပ်ဆောင်ပါ\", or start its statements with \"အောက်ပါတို့ကို လုပ်ဆောင်ကာ <kind> ရလဒ် ကို ပြန်ပေးမည်\"."""

[codes.ZK0316.title]
en = "duplicate struct"
[codes.ZK0316.message]
en = "\"%{n}\" names a struct declared before"
[codes.ZK0316.explain]
en = """Each struct name names one struct in the whole program. Rename one of the two declarations."""

[codes.ZK0317.title]
en = "duplicate field"
[codes.ZK0317.message]
en = "\"%{s}\" names the field \"%{n}\" twice"
[codes.ZK0317.explain]
en = """A field access \"x ၏ <field>\" finds a field on its name, so two fields of one struct need two names. Rename one of them."""

[codes.ZK0318.title]
en = "unknown kind name"
[codes.ZK0318.message]
en = "no struct named \"%{n}\" is declared"
[codes.ZK0318.explain]
en = """A name in a kind phrase, as in \"ကိန်းရှင် x သည် လူ တစ်ယောက် ဖြစ်ပါစေ။\", names a struct. Declare it at the top level with \"ဒေတာအမျိုးအစား <name> တွင် ... တို့ ပါဝင်သည်။\", or check the spelling."""

[codes.ZK0319.title]
en = "name of a struct reused"
[codes.ZK0319.message]
en = "\"%{n}\" names a struct, so it cannot name a value or a function too"
[codes.ZK0319.explain]
en = """A struct name can start a kind wherever a value can stand, as in \"လူ ၏ အရွယ်အစား\", so the compiler reads a struct name as a kind each time. A variable, constant, parameter, field or function with that name could never be read. Pick another name for one of the two."""

[codes.ZK0320.title]
en = "unknown field"
[codes.ZK0320.message]
en = "\"%{s}\" has no field named \"%{n}\""
[codes.ZK0320.explain]
en = """After \"၏\", a name reads a field of the struct before it. The struct declaration lists the fields it has; check the spelling, or add the field to the declaration."""

[codes.ZK0321.title]
en = "field set twice"
[codes.ZK0321.message]
en = "the \"%{s}\" literal sets the field \"%{n}\" twice"
[codes.ZK0321.explain]
en = """A struct literal, as in \"အသက် ၂၀ ရှိသော လူတစ်ယောက်\", gives each field one value. Remove one of the two, or name the other field."""

[codes.ZK0322.title]
en = "nothing to import"
[codes.ZK0322.message]
en = "\"%{f}\" exports nothing named \"%{n}\""
[codes.ZK0322.help_private]
en = "\"%{n}\" is declared there without \"အများသုံး\"; add the mark to share it"
[codes.ZK0322.help_hidden]
en = "\"%{n}\" is declared in \"%{f}\"; mark it \"အများသုံး\" there and import it here"
[codes.ZK0322.explain]
en = """An import takes names that the other file exports. A declaration is exported when \"အများသုံး\" stands before it; without the mark it is private to its file."""

[codes.ZK0323.title]
en = "statement in an imported file"
[codes.ZK0323.message]
en = "\"%{f}\" is imported, so it holds declarations and no statements"
[codes.ZK0323.explain]
en = """A file that another file imports declares functions, structs, variables and constants for other files to use. Statements that print, loop, call or assign belong in the file that is run, the one given to \"zakac run\"."""

[codes.ZK0325.title]
en = "a second start block"
[codes.ZK0325.message]
en = "the program has a start block before this one"
[codes.ZK0325.help]
en = "keep one \"ပရိုဂရမ်သည်\" block and move the statements of the other into it"
[codes.ZK0325.explain]
en = """A program starts at one place. The file given to \"zakac run\" holds at most one start block, \"ပရိုဂရမ်သည်\", and an imported file holds none."""

[codes.ZK0326.title]
en = "statement at the top level"
[codes.ZK0326.message]
en = "a statement that runs goes inside the start block, not at the top level"
[codes.ZK0326.help]
en = "move the statement into the \"ပရိုဂရမ်သည်\" block"
[codes.ZK0326.explain]
en = """A program starts at its start block, \"ပရိုဂရမ်သည်\". The top level of a file declares functions, structs, variables and constants, and the starting values of the variables are set before the start block runs. Statements that print, loop, call or assign go inside the start block, or inside a function."""

[codes.ZK0327.title]
en = "no start block"
[codes.ZK0327.message]
en = "the program has no start block, \"ပရိုဂရမ်သည်\""
[codes.ZK0327.help]
en = "add \"ပရိုဂရမ်သည် အောက်ပါတို့ကို လုပ်ဆောင်မည်။\", the statements to run, and \"ပရိုဂရမ် ပြီးဆုံးပါပြီး။\""
[codes.ZK0327.explain]
en = """The file given to \"zakac run\" starts the program, so it holds a start block, \"ပရိုဂရမ်သည်\", with the statements that run first. A file that other files import holds declarations alone and no start block."""

[codes.ZK0324.title]
en = "private struct in an export"
[codes.ZK0324.message]
en = "\"%{n}\" is exported, but its kind names the private struct \"%{s}\""
[codes.ZK0324.help]
en = "mark \"%{s}\" with \"အများသုံး\" as well, or keep \"%{n}\" private"
[codes.ZK0324.explain]
en = """An exported function, struct, variable or constant can be used from other files, so each struct its kinds name must be usable there too. A struct that the file declares without \"အများသုံး\" is private to the file. Export the struct as well, or remove the mark from the declaration that uses it."""

# ---------------------------------------------------------------- kinds ZK04xx

[codes.ZK0401.title]
en = "mismatched kinds"
[codes.ZK0401.message]
en = "expected %{want}, found %{got}"
[codes.ZK0401.help]
en = "convert the value with \"ကို <kind> အဖြစ် ပြောင်းလဲသော ရလဒ်\""
[codes.ZK0401.help_lend]
en = "hold the value in a variable and lend its cells with \"<variable> ၏ တန်ဖိုးအငှား\""
[codes.ZK0401.help_raw]
en = "a block that holds addresses changes its kind through a raw address alone; convert the value to %{raw} first, then convert that to %{want}"
[codes.ZK0401.explain]
en = """A value must fit the kind its place expects without losing data. Conversions happen on their own when no data can be lost: a narrower integer to a wider one of the same sign, an unsigned integer to a wider signed one, an integer to a float with enough fraction bits, and a narrower float to a wider one. Characters and booleans never convert on their own. Use the conversion verb for the others. A pointer also converts on its own to and from the opaque \"လိပ်စာ\" of its flavour, but an owner or a borrow does so just when no level of its block holds an address: the opaque address hides what the block holds, so reading stored addresses as other data, or other data as addresses, goes through a raw address, \"<kind> လိပ်စာအကြမ်း\", in two conversions."""

[codes.ZK0402.title]
en = "condition is not a boolean"
[codes.ZK0402.message]
en = "a condition must be a boolean, found %{got}"
[codes.ZK0402.help]
en = "compare the pointer with \"ဗလာ\""
[codes.ZK0402.explain]
en = """The condition of \"အကယ်၍\", of a while loop, and of a generic loop must be a boolean value. Numbers do not count as true or false. Compare the value instead, for example \"က သည် ၀ နှင့် မညီ\"."""

[codes.ZK0403.title]
en = "operand of the wrong kind"
[codes.ZK0403.message]
en = "%{op} needs %{want}, found %{got}"
[codes.ZK0403.explain]
en = """Each operator works on certain kinds: arithmetic and \"-\" on numbers, bitwise operators and shifts on integers, logical operators, \"မဟုတ်\" and \"!\" on booleans, and ordering comparisons on numbers and characters. \"-\" of an unsigned integer is not allowed. Convert the operand first, or use another operator."""

[codes.ZK0404.title]
en = "incompatible operands"
[codes.ZK0404.message]
en = "cannot combine %{l} and %{r} without a conversion"
[codes.ZK0404.explain]
en = """The two operands of an operator are brought to one common kind, the wider of the two. Here neither kind converts to the other without losing data, for example a signed and an unsigned integer of the same width, or a 64-bit integer and a 64-bit float. Convert one operand with \"ကို <kind> အဖြစ် ပြောင်းလဲသော ရလဒ်\"."""

[codes.ZK0405.title]
en = "loop bound is not an integer"
[codes.ZK0405.message]
en = "a loop bound or step must be an integer, found %{got}"
[codes.ZK0405.explain]
en = """The bounds and the step of a counted loop must be integers. The loop variable takes the common kind of the two bounds. Convert the bound with \"ကို <kind> အဖြစ် ပြောင်းလဲသော ရလဒ်\", or use a generic loop for a float counter."""

[codes.ZK0406.title]
en = "literal does not fit"
[codes.ZK0406.message]
en = "the literal %{v} does not fit %{k}"
[codes.ZK0406.explain]
en = """An integer literal without a kind prefix takes the kind its place expects. Here the value is outside the range of that kind. Use a value inside the range, or a wider kind."""

[codes.ZK0407.title]
en = "shift too far"
[codes.ZK0407.message]
en = "shift distance %{n} is not below the %{w}-bit width"
[codes.ZK0407.explain]
en = """A shift moves the bits of a value. A constant distance must be smaller than the bit width of the shifted value; shifting an 8-bit integer 8 or more bits is an error. A distance known at run time is not checked."""

[codes.ZK0408.title]
en = "invalid conversion"
[codes.ZK0408.message]
en = "cannot convert %{from} to %{to}"
[codes.ZK0408.explain]
en = """The conversion verb converts between numbers of all kinds, between characters and integers, and from booleans to integers. Floats and characters do not convert into each other, and nothing converts into a boolean: compare the value instead, for example \"က သည် ၀ နှင့် မညီ\". An integer becomes an address through a raw address, \"<kind> လိပ်စာအကြမ်း\", first; the raw address then converts to an owner or a borrow, and that step is the one a reader searches for. Likewise, a cast between owners or borrows whose blocks hold addresses keeps the kind of what the block holds: reading an address as a number, or a number as an address, also goes through a raw address. The opaque \"လိပ်စာ\" follows the same rule: an owner or a borrow whose block holds addresses does not pass through it, with the verb or on its own, without the raw step."""
[codes.ZK0408.help_raw]
en = "convert the integer to %{raw} first, then convert that to %{to}"
[codes.ZK0408.help_pun]
en = "this cast reads stored addresses as other data, or other data as addresses; convert to %{raw} first, then convert that to %{to}"

[codes.ZK0409.title]
en = "loop step is not positive"
[codes.ZK0409.message]
en = "the step of a counted loop must be positive"
[codes.ZK0409.explain]
en = """The step gives the distance the loop variable moves in each round. The direction comes from \"ရေတွက်၍\", \"တိုး၍\", or \"လျှော့၍\", so the step itself must be greater than zero."""

[codes.ZK0410.title]
en = "invalid assignment target"
[codes.ZK0410.message]
en = "this cannot be assigned to; a target must be a variable or a dereference"
[codes.ZK0410.explain]
en = """An assignment \"x ကို v ဟု ထားပါ။\" stores v in a place. The target before \"ကို\" must be a variable, a parameter, \"ရလဒ်\" or a dereference such as \"p ၏ တန်ဖိုး\"; a literal or a computed value has no place to store into. Assign to a variable, or dereference a pointer to store through it."""

[codes.ZK0411.title]
en = "no address"
[codes.ZK0411.message]
en = "the address of %{what} cannot be taken; variables and dereferences alone have an address"
[codes.ZK0411.explain]
en = """\"x ၏ လိပ်စာ\" and \"&x\" give the address of a place: a variable, a parameter, \"ရလဒ်\" or a dereference. A literal, the result of a call or a computed value is not stored at an address of its own. Store the value in a variable first and take the address of the variable."""

[codes.ZK0412.title]
en = "address of a fixed name"
[codes.ZK0412.message]
en = "\"%{name}\" cannot be changed, so its address cannot be taken"
[codes.ZK0412.explain]
en = """Writing through the address of a name would change the name. Constants and counted-loop variables cannot be changed, so their address cannot be taken. Store the value in a separate variable and take the address of that variable instead."""

[codes.ZK0413.title]
en = "not a pointer"
[codes.ZK0413.message]
en = "%{kind} is not a pointer and cannot be dereferenced"
[codes.ZK0413.explain]
en = """A dereference, \"p ၏ တန်ဖိုး\" or \"*p\", reads the value a pointer points at. The operand must have a pointer kind, written \"<kind> လိပ်စာ\"; numbers, characters and booleans are not pointers. Check that the operand is the pointer and not the value it points at."""

[codes.ZK0413.help]
en = "to point at \"%{name}\" itself, write \"%{name} ၏ လိပ်စာ\""

[codes.ZK0414.title]
en = "opaque pointer"
[codes.ZK0414.message]
en = "an opaque \"လိပ်စာ\" cannot be dereferenced or offset"
[codes.ZK0414.help]
en = "convert it to a pointer kind first with \"ကို <kind> လိပ်စာ အဖြစ် ပြောင်းလဲသော ရလဒ်\""
[codes.ZK0414.explain]
en = """The opaque pointer kind \"လိပ်စာ\" holds an address but no kind for the value there, so the compiler cannot tell what to read or how far to move. Convert it to a pointer kind such as \"ကိန်းပြည့် လိပ်စာ\" with the conversion verb, then dereference or offset the result."""

[codes.ZK0415.title]
en = "operator not for pointers"
[codes.ZK0415.message]
en = "the operator \"%{op}\" cannot be used on pointers"
[codes.ZK0415.explain]
en = """A pointer takes few operators: \"+\" and \"-\" with an integer to move it, \"-\" between two pointers of the same kind for the distance, and comparisons. Other operators, such as \"*\", \"/\", \"%\", the bitwise operators, shifts and negation, have no meaning on an address. Convert the pointer to \"လက္ခဏာမဲ့ ကိန်းပြည့်\" to compute with the address as a number."""

[codes.ZK0416.title]
en = "pointer kinds differ"
[codes.ZK0416.message]
en = "pointers to different kinds, %{a} and %{b}, cannot be compared or subtracted"
[codes.ZK0416.explain]
en = """Two pointers can be compared or subtracted when the kinds the two point at are the same. \"==\" and \"!=\" also accept \"ဗလာ\" or the opaque \"လိပ်စာ\" on one side. Convert one pointer to the kind of the other first."""

[codes.ZK0417.title]
en = "heap statement needs a pointer"
[codes.ZK0417.message]
en = "the heap statement needs a pointer, found %{kind}"
[codes.ZK0417.explain]
en = """The heap statements allocate space, resize it, free it, duplicate its cells and fill them, through an address. That address must have a pointer kind, written \"<kind> လိပ်စာ\", or the opaque \"လိပ်စာ\". Allocate, resize and free write the address back, so theirs is a variable; declare it with a pointer kind."""

[codes.ZK0419.title]
en = "list count mismatch"
[codes.ZK0419.message]
en = "the kind holds %{want} cells, but the list has %{found}"
[codes.ZK0419.explain]
en = """A list literal \"a၊ b၊ c တို့ပါသော စာရင်း\" must have the same number of cells as the list kind it fills. Add or remove cells, or change the count in \"အကွက် <n> ခုရှိသော\". A kind written with no count, such as \"ကိန်းပြည့် စာရင်း\", takes its count from the literal."""

[codes.ZK0420.title]
en = "blank list with no kind"
[codes.ZK0420.message]
en = "a blank list needs a list kind from its place"
[codes.ZK0420.help]
en = "declare the variable with a list kind first, or write the cells out"
[codes.ZK0420.explain]
en = """\"စာရင်းအလွတ်\" and [] are a list with no cells, or a counted list with each cell at its default, but the list kind comes from the place around it: a declared variable, a parameter, or the other side of a comparison. Here nothing gives that kind."""

[codes.ZK0422.title]
en = "not a list"
[codes.ZK0422.message]
en = "%{k} is not a list, so it has no cells"
[codes.ZK0422.explain]
en = """\"x ၏ အကွက် i\", \"x ၏ n ခုမြောက်အကွက်\" and \"x ၏ အကွက်အရေအတွက်\" need a list, or the address of a list. To reach the values behind a pointer to the first of several values, use pointer arithmetic: \"p + i ၏ တန်ဖိုး\"."""

[codes.ZK0423.title]
en = "cell number not an integer"
[codes.ZK0423.message]
en = "a cell number must be an integer, not %{k}"
[codes.ZK0423.explain]
en = """The number in \"x ၏ အကွက် i\" or \"x ၏ n ခုမြောက်အကွက်\" counts cells, so it must be an integer of a signed or unsigned kind. Convert it with \"ကို <kind> အဖြစ် ပြောင်းလဲသော ရလဒ်\"."""

[codes.ZK0424.title]
en = "list of borrows as a function result"
[codes.ZK0424.message]
en = "a function cannot give back a list whose cells are borrows"
[codes.ZK0424.help]
en = "give back a list of owners or raw addresses, or take the list to fill as a parameter"
[codes.ZK0424.explain]
en = """A borrow lives in a local or a parameter, never in a list that leaves a function, since the compiler could not tell how long each cell remains good. Give back owners or raw addresses instead, or pass the list to fill as a borrowed address, \"ငှားထားသော ... စာရင်း လိပ်စာ\"."""

[codes.ZK0425.title]
en = "list too large"
[codes.ZK0425.message]
en = "%{k} needs more octets than the machine can address"
[codes.ZK0425.explain]
en = """The cells of a list sit next to each other, so the list takes its count times the size of one cell. Here that size does not fit the machine. Use a smaller count, or ask for heap room."""

[codes.ZK0426.title]
en = "field of a value that is no struct"
[codes.ZK0426.message]
en = "\"%{n}\" is read as a field, but the value before \"၏\" is %{k}, not a struct"
[codes.ZK0426.explain]
en = """After \"၏\", a name reads a field, and fields belong to structs. To read a field of a struct a pointer points at, dereference the pointer first: \"p ၏ တန်ဖိုး ၏ <field>\"."""

[codes.ZK0427.title]
en = "struct holds itself"
[codes.ZK0427.message]
en = "\"%{n}\" holds itself, so it would have no end"
[codes.ZK0427.help]
en = "hold the address of the struct instead: \"%{n} လိပ်စာ\""
[codes.ZK0427.explain]
en = """A field of a struct sits inside the struct, so a struct that holds itself, at once or through other structs, would need to be larger than itself. Hold an address of it instead, as a linked list does with \"နောက်\" fields of kind \"<name> လိပ်စာ\"."""

[codes.ZK0428.title]
en = "slice of borrows"
[codes.ZK0428.message]
en = "the cells of a slice cannot hold borrows, as %{k} does"
[codes.ZK0428.explain]
en = """A slice points at cells outside the frame of its function, and the checker follows a borrow in locals and parameters alone. A slice whose cells are slices or borrowed addresses would hide those borrows from it. Use a list of borrows, which lives in the frame, or a slice of raw addresses."""

[codes.ZK0429.title]
en = "write to a cell of text"
[codes.ZK0429.message]
en = "the cells of %{k} cannot be written"
[codes.ZK0429.explain]
en = """Text holds UTF-8, and one u8 written on its own can break a character in two. A text written in quotes also shares its storage with each other literal of the same text. Build new text instead: join pieces with \"+\", or write the value in a template slot of a literal, as in \"{က}\"."""

[codes.ZK0430.title]
en = "kind not known"
[codes.ZK0430.message]
en = "the value gives no kind for \"%{n}\""
[codes.ZK0430.help]
en = "write the kind: \"<kind> တစ်<classifier> ဖြစ်၍ တန်ဖိုးသည် <value>\""
[codes.ZK0430.explain]
en = """A declaration with no kind takes the kind of its value. \"ဗလာ\" fits each pointer kind and names none of them, so a declaration of \"ဗလာ\" must write its kind."""

[codes.ZK0431.title]
en = "unmarked argument the function changes"
[codes.ZK0431.message]
en = "the function changes this argument; mark it with \"(လုပ်ဆောင်ချက်မှ ပြောင်းလဲနိုင်သည်)\""
[codes.ZK0431.explain]
en = """A parameter written \"လုပ်ဆောင်ချက်မှ ပြောင်းလဲနိုင်သော <kind> <name>\" is the caller's place itself, not a duplicate: the function changes it. The call marks it too, with \"(လုပ်ဆောင်ချက်မှ ပြောင်းလဲနိုင်သည်)\" after the argument, so a reader of the call sees which variable it changes."""

[codes.ZK0432.title]
en = "mark on an argument the function does not change"
[codes.ZK0432.message]
en = "this parameter takes a duplicate, so the argument takes no \"(လုပ်ဆောင်ချက်မှ ပြောင်းလဲနိုင်သည်)\""
[codes.ZK0432.explain]
en = """The mark \"(လုပ်ဆောင်ချက်မှ ပြောင်းလဲနိုင်သည်)\" goes with a parameter written \"လုပ်ဆောင်ချက်မှ ပြောင်းလဲနိုင်သော <kind> <name>\". Each other parameter holds a duplicate, and the caller's variable never sees a change to it. Remove the mark, or mark the parameter in the function."""

[codes.ZK0433.title]
en = "changed place in two arguments"
[codes.ZK0433.message]
en = "\"%{n}\" is changed through another argument of this call, so it cannot appear here"
[codes.ZK0433.explain]
en = """A place a call changes through a marked argument appears nowhere else in the same call, as a whole or as a field or a cell. Otherwise the function would read the place through one parameter while it changes it through another. Read the value into a variable of its own before the call."""
[codes.ZK0434.title]
en = "each loop over a value it cannot walk"
[codes.ZK0434.message]
en = "this each loop cannot walk %{got}"
[codes.ZK0434.explain]
en = """An each-cell loop (\"အကွက်တိုင်း\") walks a list or a slice whose cells hold no owner pointer: the loop variable holds a duplicate of each cell, and an owner pointer cannot be duplicated. An each-character loop (\"စာလုံးတိုင်း\") walks text or a view of text. To walk the cells of text as u8 numbers, use a counted loop over its cell count."""
[codes.ZK0436.title]
en = "[] given to a counted list"
[codes.ZK0436.message]
en = "[] is a list with no cells, and the counted list %{k} cannot take it here"
[codes.ZK0436.explain]
en = """A counted list keeps its count, so a list with no cells does not fit it. In the declaration of a counted list, [] starts each cell at its default. Elsewhere, write \"စာရင်းအလွတ်\" to set each cell back to its default, or make the list a plain list, with no count, which [] fits."""

[codes.ZK0437.title]
en = "a value that cannot grow or shrink"
[codes.ZK0437.message]
en = "%{k} cannot grow or shrink here: \"ထည့်ပါ\" takes a plain list or text, \"နောက်ဆုံးအကွက်ကို ဖျက်ပါ\" a plain list, and \"နောက်ဆုံးစာလုံးကို ဖျက်ပါ\" text"
[codes.ZK0437.explain]
en = """A counted list keeps the count its kind gives, and slices and views hold no cells of their own to add to. Text has no cells: it loses its last character through \"နောက်ဆုံးစာလုံး\". Declare the list with no count, as a plain list (isize[]), to add cells to it and remove them."""

[codes.ZK0438.title]
en = "a view of text cannot change"
[codes.ZK0438.message]
en = "%{k} cannot change: a character write, an add or a remove takes text (စာသား)"
[codes.ZK0438.explain]
en = """A view of text reads text that another value holds, so it cannot change. Declare the value as text to set a character of it or to add to it; a template literal, \"{v}\", makes text of its own from a view v."""

[codes.ZK0439.title]
en = "nothing to put the value in front of"
[codes.ZK0439.message]
en = "\"အရှေ့တွင်\" follows a cell of a list or a character of text"
[codes.ZK0439.help]
en = "name the cell or the character the value goes in front of: \"<list> ၏ အကွက် n ၏ အရှေ့တွင်\" or \"<text> ၏ စာလုံး n ၏ အရှေ့တွင်\"; \"<list> ထဲသို့\" adds at the end"
[codes.ZK0439.explain]
en = """An add puts its value in front of one cell of a plain list, or one character of text, and the cells or characters from there on move one place on. The number can also be the count, which puts the value at the end. Name the place with a cell form, \"အကွက် n\" or \"n ခုမြောက်အကွက်\", or a character form, \"စာလုံး n\" or \"n ခုမြောက်စာလုံး\"."""

[codes.ZK0440.title]
en = "start block parameter that is no text list"
[codes.ZK0440.message]
en = "a parameter of the start block is a \"စာသား စာရင်း\", and there are two of them at most"
[codes.ZK0440.help]
en = "write \"စာသား စာရင်း <name>\": the first one gets the name of the program and its arguments, the second the environment"
[codes.ZK0440.explain]
en = """The start block takes no parameter, one or two. The first holds the name of the program and then the arguments it was run with, one text for each, as in C; the second holds the environment variables, one \"NAME=VALUE\" text for each. Both are plain text lists, \"စာသား စာရင်း\", and neither is a place the start block can change for a caller."""

[codes.ZK0441.title]
en = "start block result that is no integer"
[codes.ZK0441.message]
en = "the result of the start block is \"%{k}\", but it must be an integer"
[codes.ZK0441.help]
en = "write \"ကိန်းပြည့် ရလဒ်\": the result becomes the exit code of the run"
[codes.ZK0441.explain]
en = """The result of the start block is the exit code of the run: 0 tells the shell that all went well, and another number tells it that something failed. The host keeps the lowest 8 bits of it. A start block with no result ends the run with 0."""

[codes.ZK0442.title]
en = "raw duplicate or fill of cells that own or borrow"
[codes.ZK0442.message]
en = "the cells are \"%{kind}\", which own a block or borrow one: a raw duplicate or fill would give the block a second owner, or keep a borrow the check cannot follow"
[codes.ZK0442.help]
en = "assign the cells one at a time, or hold the addresses in raw pointers (\"<kind> လိပ်စာအကြမ်း\")"
[codes.ZK0442.explain]
en = """\"ကူးယူမည်\" and \"ပြောင်းထည့်မည်\" duplicate cells, and \"ဖြည့်မည်\" fills them, as raw octets. A cell that holds an owner pointer, text or a plain list owns a heap block, so a raw duplicate of it leaves two cells that both free the same block. A cell that holds a borrow or a slice points into a place the ownership check follows, and a raw duplicate puts the borrow where the check cannot see it, so it could outlast that place. The cells are the kind of the size, or, for a size in octets, the kind each address points at. Assign such cells one at a time, so each value moves, is duplicated or is lent as its kind requires, or hold the addresses in raw pointers, which own nothing and are not followed."""

[codes.ZK0443.title]
en = "call that can fail, with no pass-on"
[codes.ZK0443.message]
en = "\"%{f}\" can fail, but the call does not pass the failure on"
[codes.ZK0443.help]
en = "read the value with \"... လုပ်ဆောင်သော ရလဒ်ကောင်း\" or \"%{f}(...)?\", or end a call statement with \"၊ မအောင်မြင်ပါက အမှားအယွင်းကို ပြန်ပေးပါ\""
[codes.ZK0443.explain]
en = """A function whose result clause is a result kind, such as \"ကိန်းပြည့် ရလဒ် သို့မဟုတ် စာသား အမှားအယွင်း ကို ပြန်ပေးမည်\", can fail: it gives back a good result or an error value. A call to it must tell what happens on a failure. For now the one answer is to pass the failure on: the call reads the good result with \"ရလဒ်ကောင်း\" or \"?\", and when the function fails, the function around the call stops and gives back the same error value. A call statement passes it on with \"၊ မအောင်မြင်ပါက အမှားအယွင်းကို ပြန်ပေးပါ\" before its full stop. A failure is never dropped without a word."""

[codes.ZK0444.title]
en = "pass-on for a function that cannot fail"
[codes.ZK0444.message]
en = "the call passes a failure on, but \"%{f}\" cannot fail"
[codes.ZK0444.help]
en = "write \"လုပ်ဆောင်သော ရလဒ်\" or \"%{f}(...)\" with no \"?\", and drop the \"မအောင်မြင်ပါက\" part of a call statement"
[codes.ZK0444.explain]
en = """\"ရလဒ်ကောင်း\", \"?\" and \"မအောင်မြင်ပါက အမှားအယွင်းကို ပြန်ပေးပါ\" pass a failure of the call on. A function whose result clause is no result kind cannot fail, so there is nothing to pass on: read its result with \"လုပ်ဆောင်သော ရလဒ်\" or a plain sign-form call."""

[codes.ZK0445.title]
en = "pass-on in a function that cannot fail"
[codes.ZK0445.message]
en = "the call passes a failure on, but the code around it cannot fail"
[codes.ZK0445.help]
en = "give the function around the call a result kind, such as \"<kind> ရလဒ် သို့မဟုတ် <kind> အမှားအယွင်း ကို ပြန်ပေးမည်\""
[codes.ZK0445.explain]
en = """Passing a failure on stops the function around the call and gives back the error value, so that function must be able to fail itself: its result clause is a result kind. The top-level statements of a file and the start block cannot fail: the start block gives back an exit code, never a result. Move the call into a function that can fail, or read the result there with \"သည် ရလဒ်ကောင်း\" and the conversions."""

[codes.ZK0446.title]
en = "pass-on with another error kind"
[codes.ZK0446.message]
en = "the called function fails with \"%{found}\", but the function around the call fails with \"%{want}\""
[codes.ZK0446.help]
en = "give both functions the same error kind"
[codes.ZK0446.explain]
en = """Passing a failure on gives back the error value of the called function as it is, so it must have the error kind of the function around the call. Both result clauses must name the same kind after \"မအောင်မြင်ပါက\". Zaka does not convert one error kind into another."""

[codes.ZK0447.title]
en = "error value from a function that cannot fail"
[codes.ZK0447.message]
en = "\"%{f}\" cannot fail, so it has no error value to give back"
[codes.ZK0447.help]
en = "make the result clause a result kind, such as \"<kind> ရလဒ် သို့မဟုတ် <kind> အမှားအယွင်း ကို ပြန်ပေးမည်\""
[codes.ZK0447.explain]
en = """\"... ကို အမှားအယွင်းအဖြစ် ပြန်ပေးပါ\" ends the function with a failure and gives back the error value. The result clause of the function names the kind of that value after \"မအောင်မြင်ပါက\"; a function without that part cannot fail."""

[codes.ZK0448.title]
en = "test or conversion of a value that is no result"
[codes.ZK0448.message]
en = "the value is \"%{k}\", not the result of a function that can fail"
[codes.ZK0448.help]
en = "\"သည် ရလဒ်ကောင်း\", \"သည် အမှားအယွင်း\" and the conversions to \"ရလဒ်ကောင်း\" and \"အမှားအယွင်း\" read the result of a call such as \"... လုပ်ဆောင်သော ရလဒ်\""
[codes.ZK0448.explain]
en = """A call to a function that can fail, written without \"ရလဒ်ကောင်း\" or \"?\", gives back the whole result: a good result or an error value. \"<r> သည် ရလဒ်ကောင်း\" and \"<r> သည် အမှားအယွင်း\" test which one it holds, and \"<r> ကို ရလဒ်ကောင်း အဖြစ် ပြောင်းလဲသော ရလဒ်\" and \"<r> ကို အမှားအယွင်း အဖြစ် ပြောင်းလဲသော ရလဒ်\" read it out. A value of another kind has no such parts."""

[codes.ZK0449.title]
en = "good result of a function with no result"
[codes.ZK0449.message]
en = "the function gives back no good value, so the result has none to read"
[codes.ZK0449.help]
en = "test the result with \"သည် ရလဒ်ကောင်း\", or read its error value with \"အမှားအယွင်း အဖြစ်\""
[codes.ZK0449.explain]
en = """A function whose result clause is \"အောင်မြင်သည့်သတင်း သို့မဟုတ် <kind> အမှားအယွင်း ကို ပြန်ပေးမည်\" gives back nothing when it does not fail: its result holds an error value or nothing. A conversion to \"ရလဒ်ကောင်း\" has no value to read; test the result instead."""

[codes.ZK0450.title]
en = "error value of a result whose failure holds none"
[codes.ZK0450.message]
en = "the error side of the result is \"မအောင်မြင်သည့်သတင်း\": it holds no value to read"
[codes.ZK0450.help]
en = "test the result with \"သည် အမှားအယွင်း\" instead"
[codes.ZK0450.explain]
en = """A result kind whose error side is \"မအောင်မြင်သည့်သတင်း\" fails with no error value, so a conversion to \"အမှားအယွင်း\" has nothing to read. Test the result instead."""

[codes.ZK0451.title]
en = "failure with no value where one is needed"
[codes.ZK0451.message]
en = "the function fails with an error value of the kind \"%{k}\", so a failure must give one back"
[codes.ZK0451.help]
en = "write \"<value> ကို အမှားအယွင်းအဖြစ် ပြန်ပေးပါ\""
[codes.ZK0451.explain]
en = """\"လုပ်ဆောင်ချက် မအောင်မြင်ပါဟု သတ်မှတ်မည်\" ends a function with a failure that holds no value. That fits a result kind whose error side is \"မအောင်မြင်သည့်သတင်း\". When the error side names a kind, the failure must give back an error value of that kind."""

[codes.ZK0452.title]
en = "error value from a function whose failure holds none"
[codes.ZK0452.message]
en = "a failure of \"%{f}\" holds no error value"
[codes.ZK0452.help]
en = "write \"လုပ်ဆောင်ချက် မအောင်မြင်ပါဟု သတ်မှတ်မည်\", or name an error kind in the result kind"
[codes.ZK0452.explain]
en = """A result kind whose error side is \"မအောင်မြင်သည့်သတင်း\" fails with no error value, so \"... ကို အမှားအယွင်းအဖြစ် ပြန်ပေးပါ\" has no place for its value. End the function with \"လုပ်ဆောင်ချက် မအောင်မြင်ပါဟု သတ်မှတ်မည်\", or write an error kind on the error side."""

[codes.ZK0454.title]
en = "conversion to the part a result does not hold"
[codes.ZK0454.message_good]
en = "\"%{n}\" holds a good result here, so reading its error value stops the run each time"
[codes.ZK0454.message_fault]
en = "\"%{n}\" holds a failure here, so reading its good result stops the run each time"
[codes.ZK0454.help]
en = "read the other part, or test the result first with \"သည် ရလဒ်ကောင်း\" or \"သည် အမှားအယွင်း\""
[codes.ZK0454.explain]
en = """A test such as \"အကယ်၍ R သည် ရလဒ်ကောင်း ဖြစ်လျှင်\" proves which part a result variable holds inside its arm, and the opposite in the arms after it; an arm that leaves the function or the loop proves the opposite after the whole statement as well. While nothing changes the variable, a conversion to the part the test ruled out would stop the run each time it ran, so the check reports it. A statement that can change the variable, such as an assignment, a call that the variable is lent to with the edit mark, or the address of the variable, ends what the test proved."""

[codes.ZK0455.title]
en = "good result given back with the word of the other sort of function"
[codes.ZK0455.message_fails]
en = "\"%{f}\" can fail, so its good result goes back with \"ရလဒ်ကောင်းအဖြစ်\""
[codes.ZK0455.message_sure]
en = "\"%{f}\" cannot fail, so its result goes back with \"ရလဒ်အဖြစ်\""
[codes.ZK0455.help_fails]
en = "write \"... ကို ရလဒ်ကောင်းအဖြစ် ပြန်ပေးပါ\""
[codes.ZK0455.help_sure]
en = "write \"... ကို ရလဒ်အဖြစ် ပြန်ပေးပါ\""
[codes.ZK0455.explain]
en = """A function whose result clause is a result kind gives back a good result or an error value, and the sentence tells which: \"... ကို ရလဒ်ကောင်းအဖြစ် ပြန်ပေးပါ\" for the good result and \"... ကို အမှားအယွင်းအဖြစ် ပြန်ပေးပါ\" for the error value. A function that cannot fail gives back its result with \"... ကို ရလဒ်အဖြစ် ပြန်ပေးပါ\"."""

# ---------------------------------------------------------- naturalness ZK05xx

[codes.ZK0501.title]
en = "negative verb before \"သို့မဟုတ်\" takes \"ပါ\""
[codes.ZK0501.message]
en = "\"%{v}သည်\" before \"သို့မဟုတ်\" reads better as \"%{v}ပါ\""
[codes.ZK0501.help]
en = "write \"%{v}ပါ သို့မဟုတ် ...\""
[codes.ZK0501.explain]
en = """A negative verb (\"မညီ\", \"မကြီး\", \"မငယ်\", \"မမှန်\", \"မဟုတ်\") that is followed with \"သို့မဟုတ်\" carries the particle \"ပါ\" in natural Burmese, not \"သည်\". The program still runs; this is a matter of idiom. The strict-particles flag turns it into an error."""

[codes.ZK0502.title]
en = "particle before an attached \"လျှင်\" or \"နေသရွေ့\""
[codes.ZK0502.message]
en = "\"%{v}%{p}\" before \"%{n}\" reads better without the particle"
[codes.ZK0502.help]
en = "write \"%{v}%{n}\", or keep the particle and write \"ဖြစ်%{n}\""
[codes.ZK0502.explain]
en = """The attached forms \"လျှင်\" and \"နေသရွေ့\" join straight onto the verb: \"မငယ်လျှင်\", \"ကြီးနေသရွေ့\". A sentence-final particle between them is unidiomatic. To keep the particle, use the \"ဖြစ်\" forms instead: \"မငယ်သည် ဖြစ်လျှင်\", \"ကြီးသည် ဖြစ်နေသရွေ့\"."""

[codes.ZK0503.title]
en = "\"မဟုတ်\" with \"သည်\""
[codes.ZK0503.message]
en = "\"မဟုတ်%{p}\" reads better as \"မဟုတ်ပါ\" or \"မဟုတ်\""
[codes.ZK0503.help]
en = "write \"မဟုတ်ပါ\" or \"မဟုတ်\""
[codes.ZK0503.explain]
en = """The postfix negation \"မဟုတ်\" takes \"ပါ\" or no particle at all. \"မဟုတ်သည်\" and \"မဟုတ်ပါသည်\" are grammatical but unidiomatic."""

[codes.ZK0504.title]
en = "\"ပါ\" before \"ဖြစ်၍\""
[codes.ZK0504.message]
en = "\"%{v}%{p}\" before \"ဖြစ်၍\" reads better as \"%{v}သည်\""
[codes.ZK0504.help]
en = "write \"%{v}သည် ဖြစ်၍ ...\""
[codes.ZK0504.explain]
en = """Before the conjunction \"ဖြစ်၍\" (logical and) a verb carries \"သည်\": \"အသက် သည် ၁၈ အောက် မငယ်သည် ဖြစ်၍ ...\". The \"ပါ\" forms belong before \"သို့မဟုတ်\" and at the end of a quoted sentence."""

[codes.ZK0505.title]
en = "sentence printed with \"ကို\""
[codes.ZK0505.message]
en = "a sentence or a string is quoted with \"ဟု\", not marked with \"ကို\""
[codes.ZK0505.help]
en = "write \"... ဟု ပြသပါ။\""
[codes.ZK0505.explain]
en = """\"ကို\" marks a thing: a name, a number, an arithmetic result. A whole sentence, such as a comparison that ends in \"သည်\" or \"ပါ\", and a string literal are quoted with \"ဟု\" instead: \"(အသက် သည် ၃၀ နှင့် မညီပါ) ဟု ပြသပါ။\", \"\\\"မင်္ဂလာပါ\\\" ဟု ပြသပါ။\". A bare clause with no particle keeps \"ကို\"."""

[codes.ZK0506.title]
en = "value printed with \"ဟု\""
[codes.ZK0506.message]
en = "a plain value is marked with \"ကို\", not quoted with \"ဟု\""
[codes.ZK0506.help]
en = "write \"... ကို ပြသပါ။\""
[codes.ZK0506.explain]
en = """\"ဟု\" quotes a sentence or a string. A name, a number, an arithmetic result or a bare clause with no sentence-final particle is a thing, and a thing is marked with \"ကို\": \"အသက် ကို ပြသပါ။\"."""

[codes.ZK0507.title]
en = "redundant parentheses"
[codes.ZK0507.message]
en = "these parentheses are not needed"
[codes.ZK0507.help]
en = "remove the parentheses"
[codes.ZK0507.explain]
en = """The parenthesized expression is the whole operand of its place: the printed value, the assigned value, the returned value, an initial value, a loop bound, a call argument, or a condition. Such an operand is read as far as it goes, so the parentheses change nothing. Parentheses are needed around a logical expression (\"ဖြစ်၍\", \"သို့မဟုတ်\", \"မဟုတ်\") in an operand place, and inside an operator chain or a clause with more operands; the check leaves those alone."""

[codes.ZK0508.title]
en = "\"ပါ\" on a clause used as a value"
[codes.ZK0508.message]
en = "\"%{v}%{p}\" as a value reads better as \"%{v}သည်\""
[codes.ZK0508.help]
en = "write \"... %{v}သည်\""
[codes.ZK0508.explain]
en = """A clause that gives a value, as an initial value, a returned value, a call argument or a loop bound, names a fact rather than stating a sentence, so its closing verb carries \"သည်\": \"အမှတ် သည် ၄၀ အောက် မငယ်သည် ဖြစ်ပါစေ။\". The \"ပါ\" forms belong to quoted sentences (\"... ဟု ပြသပါ\", \"... ဟု ထားပါ\") and before \"သို့မဟုတ်\"."""

[codes.ZK0509.title]
en = "count word with another classifier"
[codes.ZK0509.message]
en = "%{k} is counted with \"%{w}\", not \"%{f}\""
[codes.ZK0509.help]
en = "write \"%{w}စာ\""
[codes.ZK0509.help_literal]
en = "write \"%{k}တစ်%{w}\""
[codes.ZK0509.help_decl]
en = "write \"တစ်%{w}\""
[codes.ZK0509.explain]
en = """Burmese counts things with a classifier that fits them: people with \"ယောက်\", most other things with \"ခု\". A struct names its classifier with \"... တို့ ပါဝင်ပြီး မျိုးပြပစ္စည်းမှာ <word> ဖြစ်သည်။\"; the other kinds are counted with \"ခု\". The same word follows \"တစ်\" at the end of a struct literal and after the kind of a declaration, where \"စာလုံး\" takes \"လုံး\". The size and the value are the same whichever word is written, so the program still compiles."""

# -------------------------------------------------------------- folding ZK06xx

[codes.ZK0601.title]
en = "constant overflow"
[codes.ZK0601.message]
en = "%{op} on these constants does not fit %{kind}"
[codes.ZK0601.explain]
en = """An operation whose operands are all constants is worked out when the program is compiled. Here the result is outside the range of its kind, so it cannot be stored. Use a wider kind, or change the values. Conversions with \"ကို <kind> အဖြစ် ပြောင်းလဲသော ရလဒ်\" are exempt: theirs wrap or saturate as written."""

[codes.ZK0602.title]
en = "constant zero divisor"
[codes.ZK0602.message]
en = "%{op} with the constant zero as divisor"
[codes.ZK0602.explain]
en = """The right operand of an integer division or remainder is the constant zero. Integer division and remainder with a zero divisor have no result. Check the divisor, or put the division behind a condition. Float division with a zero divisor is allowed and gives an infinite or NaN value."""

[codes.ZK0603.title]
en = "cell outside the list"
[codes.ZK0603.message]
en = "cell %{i} is outside the list, whose cells run from %{lo} to %{hi}"
[codes.ZK0603.explain]
en = """The cell number is a constant, and it does not name a cell of the list. \"x ၏ အကွက် i\" counts from 0, so the last cell of a list of n cells is n - 1. \"x ၏ n ခုမြောက်အကွက်\" counts from 1, up to n."""

[codes.ZK0604.title]
en = "imported value not known at compile time"
[codes.ZK0604.message]
en = "the starting value of \"%{n}\" must be known at compile time, since its file is imported"
[codes.ZK0604.help]
en = "literals, constants and operators on them are known; a function call is not, for now"
[codes.ZK0604.explain]
en = """The variables and constants of an imported file get their starting value before the program runs, so the value must come from literals, constants and operators on them. A function call cannot give that value for now. Give the variable no value and set it from the file that is run, or write the value out."""

[codes.ZK0605.title]
en = "range outside its list"
[codes.ZK0605.message]
en = "%{len} cells from cell %{s} pass the end of a list of %{n} cells"
[codes.ZK0605.explain]
en = """A range \"<list> ၏ အကွက် <start> မှစ၍ <length> ကွက်\" takes the cells from the start on. The start and the length here are known, so the compiler can tell that the last cell is past the end of the list. Shorten the length or move the start."""

[codes.ZK0606.title]
en = "constant not known at compile time"
[codes.ZK0606.message]
en = "a constant that holds text or a plain list must be known at compile time"
[codes.ZK0606.help]
en = "declare it with \"ကိန်းရှင်\" to build the value when the program runs"
[codes.ZK0606.explain]
en = """A \"ကိန်းသေ\" that holds text or a plain list, alone or inside a list or a struct, is static data, the same for each run: each read shares it, and nothing frees it. Its value must fold at compile time: literals, other constants, template slots that hold constants, joins of these with \"+\", and list literals of such values. A variable, a call, a cell or a field needs the program to run. Declare such a value with \"ကိန်းရှင်\"."""

[codes.ZK0607.title]
en = "range cuts a character"
[codes.ZK0607.message]
en = "%{len} u8s from u8 %{s} start or end inside a character of the text"
[codes.ZK0607.explain]
en = """Text holds whole characters of UTF-8, and a Burmese character takes three u8s. A range \"<text> ၏ အကွက် <start> မှစ၍ <length> ကွက်\" counts u8s, so its start and its end must each fall between two characters. The text, the start and the length here are known, so the compiler can tell that an edge falls inside a character. Move the edge; \"၏ စာလုံးအရေအတွက်\" and \"၏ စာလုံး\" count characters instead."""

[codes.ZK0701.title]
en = "use after move"
[codes.ZK0701.message]
en = "\"%{name}\" was moved to another owner and now holds ဗလာ"
[codes.ZK0701.explain]
en = """A move gives the block of an owner to another owner, and the old owner is left holding ဗလာ. Reading the old name after the move would use a block it no longer owns. Use the new owner, or lend the value with တန်ဖိုးအငှား when the old name is to keep the block."""

[codes.ZK0702.title]
en = "free of a borrowed address"
[codes.ZK0702.message]
en = "a borrowed address cannot be freed or resized; free its owner instead"
[codes.ZK0702.explain]
en = """A borrowed address is a loan from an owner, so it has no right to free or resize the block. Free or resize the block through its owner, once the loan is no longer in use."""

[codes.ZK0703.title]
en = "borrowed address stored"
[codes.ZK0703.message]
en = "a borrowed address cannot be stored in a heap block, through a pointer, or in a top-level variable from a function"
[codes.ZK0703.explain]
en = """A borrow lasts as long as the owner that lent it remains valid. Storing it in a heap block, through a pointer or in a top-level variable would let it outlast that owner. Keep borrows in locals and parameters, or store an owner or a raw address instead."""

[codes.ZK0704.title]
en = "loan still in use"
[codes.ZK0704.message]
en = "the block of \"%{name}\" is %{what} here, but \"%{other}\" still borrows it and is used later"
[codes.ZK0704.label]
en = "\"%{other}\" is used here"
[codes.ZK0704.freed]
en = "freed"
[codes.ZK0704.resized]
en = "resized"
[codes.ZK0704.moved]
en = "moved"
[codes.ZK0704.edited]
en = "edited, so its cells can move,"
[codes.ZK0704.explain]
en = """While a borrow of a block is in use later on, its owner must not free, resize or move that block. The label points at the later use. Finish with the borrow before the owner changes the block, or take a new borrow after the change."""

[codes.ZK0705.title]
en = "address of a borrowed address"
[codes.ZK0705.message]
en = "the address of a borrowed address cannot be taken"
[codes.ZK0705.explain]
en = """A borrowed address stands for a loan, and a loan cannot be pointed at in turn. Pass the borrow itself, or take the address of the owner."""

[codes.ZK0706.title]
en = "borrow of a local returned"
[codes.ZK0706.message]
en = "returns a borrow of the local \"%{name}\", which ends when the function returns"
[codes.ZK0706.explain]
en = """The locals and parameters of a function are released when it returns, so a borrow of one of them would point at released space in the caller. Return the value itself, or return an owner of a heap block."""

[codes.ZK0707.title]
en = "aliased arguments"
[codes.ZK0707.message]
en = "\"%{func}\" can free through argument %{n}, but argument %{m} reaches the same block"
[codes.ZK0707.explain]
en = """A function that frees through one argument must be the one route into that block during the call. When another argument reaches the same block, that argument would be left pointing at freed space. Give the function different blocks, or pass the block once."""

[codes.ZK0708.title]
en = "block not freed"
[codes.ZK0708.message]
en = "the block that \"%{name}\" owns is never freed or moved on this path"
[codes.ZK0708.explain]
en = """A block that an owner holds must be freed, or moved to another owner, before the owner goes out of scope. Otherwise the block is leaked. Free it with the heap statements, return it, or pass it to a function that takes ownership."""

[codes.ZK0709.title]
en = "dereference of ဗလာ"
[codes.ZK0709.message]
en = "\"%{name}\" is ဗလာ here, so it cannot be dereferenced"
[codes.ZK0709.explain]
en = """At this point the name holds ဗလာ, for example after a move, so it points at no block. Give it a block first, or leave the dereference out of the path where it holds ဗလာ."""

[codes.ZK0710.title]
en = "offset past the end"
[codes.ZK0710.message]
en = "offset %{off} is past the end of a block of %{len} elements"
[codes.ZK0710.explain]
en = """The offset is a constant, and it lies past the cells of the block. Offsets count from 0, so the last cell of a block of n elements is n - 1. Use a smaller offset or a larger block."""

[codes.ZK0711.title]
en = "possible dereference of ဗလာ"
[codes.ZK0711.message]
en = "\"%{name}\" can be ဗလာ here; compare it with ဗလာ first"
[codes.ZK0711.explain]
en = """The name is not compared with ဗလာ on this path, and the strict check wants one before a dereference. Compare it with ဗလာ and dereference it in the branch where it is not ဗလာ."""

[codes.ZK0712.title]
en = "pointers into different blocks"
[codes.ZK0712.message]
en = "these pointers point into different blocks and cannot be subtracted"
[codes.ZK0712.explain]
en = """Subtracting two pointers gives a distance, and a distance exists inside one block. Pointers into different blocks have none. Subtract pointers that were taken from the same block."""

[codes.ZK0713.title]
en = "misplaced borrow marker"
[codes.ZK0713.message]
en = "a pointer kind takes one ငှားထားသော, at its front; a borrow never sits in a heap block or a slot, and a raw address cannot be borrowed"
[codes.ZK0713.explain]
en = """A pointer kind takes one ငှားထားသော, written at its front. A borrow is a loan, so it cannot live in a heap block or a slot, and a raw address cannot be loaned. Remove the extra mark, or move it to the front of the kind."""

[codes.ZK0714.title]
en = "borrowed address given for an owner"
[codes.ZK0714.message]
en = "a borrowed address cannot be given where an owner is wanted"
[codes.ZK0714.explain]
en = """A place that wants an owner takes the block over. A borrow lends the block but does not own it, so it has nothing to hand over. Pass an owner, or change the place to take a borrow."""

[codes.ZK0715.title]
en = "owner given for a borrow"
[codes.ZK0715.message]
en = "\"%{name}\" owns its block and would move here; write \"%{name} ၏ တန်ဖိုးအငှား\" to lend it"
[codes.ZK0715.help]
en = "write \"%{name} ၏ တန်ဖိုးအငှား\""
[codes.ZK0715.unnamed]
en = "this value owns its block and would move here, where a borrow is wanted"
[codes.ZK0715.explain]
en = """A place that wants a borrow was given an owner as it is, and that would take the block from the owner. Lend the owner with တန်ဖိုးအငှား instead, which keeps the block with the owner."""

[codes.ZK0716.title]
en = "lend of a raw address"
[codes.ZK0716.message]
en = "a raw address cannot be lent with တန်ဖိုးအငှား; convert it with a cast first"
[codes.ZK0716.explain]
en = """တန်ဖိုးအငှား lends the block of an owner. A raw address is not tracked, so there is no block to lend. Cast the raw address to a pointer kind first, or use the raw address as it is."""

[codes.ZK0717.title]
en = "raw address not allowed"
[codes.ZK0717.message]
en = "raw addresses are not allowed here (--no-raw)"
[codes.ZK0717.explain]
en = """The program was compiled with --no-raw, which turns raw addresses off. Use an owner or a borrow instead, or compile without that flag."""

[codes.ZK0718.title]
en = "borrow in a field"
[codes.ZK0718.message]
en = "the field \"%{n}\" holds a borrow, and borrows live in variables and parameters alone"
[codes.ZK0718.explain]
en = """A borrow lasts as long as the owner it borrows from, and the checker follows that through variables and parameters, not through mem. A struct can sit in mem, so its fields hold owners or raw addresses: \"<kind> လိပ်စာ\" or \"<kind> လိပ်စာအကြမ်း\"."""

[codes.ZK0719.title]
en = "overflow on each run"
[codes.ZK0719.message]
en = "\"%{op}\" on %{kind} gives a value outside %{kind} for each value of its operands, so the program stops here"
[codes.ZK0719.help]
en = "use a wider kind, or change the operands; with --overflow wrap the result wraps around"
[codes.ZK0719.explain]
en = """Under --overflow stop, the default, integer arithmetic stops the program when its result does not fit its kind. The check follows the values the operands can hold, and each of them makes this operation overflow, so the program stops when it reaches it. Pick a wider kind, change the operands, or compile with --overflow wrap for two's complement arithmetic."""

[codes.ZK0720.title]
en = "value duplicated"
[codes.ZK0720.message]
en = "\"%{n}\" is duplicated here; the duplicate can take a new heap block for its cells"
[codes.ZK0720.help]
en = "lend a view or a slice to read it with no duplicate, or read it no more after this statement, so it moves"
[codes.ZK0720.explain]
en = """Text and lists are copied when a value goes into another place: a variable, a parameter, a result, a field or a cell. When the place read is not read again, the compiler moves the value instead, and nothing is copied. With --warn-duplicates the compiler names each statement where a duplicate remains, so a program that must not allocate there can lend a view or a slice instead."""

[codes.ZK0721.title]
en = "ranges of a raw duplicate overlap"
[codes.ZK0721.message]
en = "the source and the destination of \"ကူးယူမည်\" share %{n} octets"
[codes.ZK0721.help]
en = "write \"ပြောင်းထည့်မည်\", which reads the source in full before it writes"
[codes.ZK0721.explain]
en = """\"ကူးယူမည်\" is the memcpy of C: it writes the cells in order, so cells it writes can be cells it has still to read, and in C the result is undefined. When both addresses point into the same block at offsets the check knows, and the count is known, the overlap is an error before the program runs; else the VM stops the program with the trap \"overlap\". \"ပြောင်းထည့်မည်\" allows ranges that overlap."""
