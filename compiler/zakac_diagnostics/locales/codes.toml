_version = 2

# ---------------------------------------------------------------- lexer ZK01xx

[codes.ZK0101.title]
en = "invalid character"
[codes.ZK0101.message]
en = "invalid character in \"%{w}\""
[codes.ZK0101.help_comma]
en = "lists are separated with \"၊\", not \",\""
[codes.ZK0101.explain]
en = """A word holds a character that cannot start or continue a token. Identifiers start with a letter, an underscore or an emoji and continue with letters, digits, underscores or emoji; operators are the ASCII punctuation the language defines. Other punctuation such as \",\", \";\", \"=\" on its own or \"?\" has no meaning in the language. The word is skipped and lexing goes on with the next one."""

[codes.ZK0102.title]
en = "invalid number literal"
[codes.ZK0102.message]
en = "invalid number literal \"%{w}\""
[codes.ZK0102.explain]
en = """A word that starts with a digit must be a number literal: a run of digits in one script, with an optional fraction and exponent, or (for Western digits) ASCII letters that stand for digits above 9 after a base prefix. A Burmese digit run followed with letters in the same word, such as a bit count written attached to \"ဘစ်\", is not a number; put a space between the two words."""

[codes.ZK0103.title]
en = "mixed digit scripts"
[codes.ZK0103.message]
en = "Burmese and Western digits cannot be mixed in one number"
[codes.ZK0103.explain]
en = """A number literal uses one digit script: either Burmese digits (၀ to ၉) or Western digits (0 to 9). This literal switches script inside the number, in its fraction, or where two digit runs touch without a space. Rewrite the whole literal in one script."""

[codes.ZK0104.title]
en = "unterminated string literal"
[codes.ZK0104.message]
en = "string literal is missing its closing quote before the end of the line"
[codes.ZK0104.explain]
en = """A string literal starts and ends with a double quote on the same line. The lexer reached the end of the line without finding the closing quote. Add the quote, or write \\\" for a double quote that belongs to the text. The text read so far is kept so later phases can go on."""

[codes.ZK0105.title]
en = "unterminated character literal"
[codes.ZK0105.message]
en = "character literal is missing its closing quote before the end of the line"
[codes.ZK0105.explain]
en = """A character literal starts and ends with a single quote on the same line. The lexer reached the end of the line without finding the closing quote. Add the quote, or write \\' for a single quote that belongs to the literal."""

[codes.ZK0106.title]
en = "unknown escape sequence"
[codes.ZK0106.message]
en = "unknown escape sequence \"%{e}\""
[codes.ZK0106.help_brace]
en = "write \"{{\" or \"}}\" for a literal brace"
[codes.ZK0106.explain]
en = """Inside a string or character literal, a backslash starts one of the escapes \\n, \\r, \\t, \\0, \\\\, \\', \\\" or \\u with four or eight hex digits, and braces hold a named escape such as {နောက်တစ်ကြောင်း} or {ယူနီကုဒ် HHHH}. This escape matches none of them. Braces are reserved for named escapes and, later, variable substitution, so a literal brace is written doubled: {{ or }}."""

[codes.ZK0107.title]
en = "wrong character literal length"
[codes.ZK0107.message]
en = "a character literal must hold one character, found %{n}"
[codes.ZK0107.explain]
en = """A character literal holds one Unicode scalar value between its quotes: one letter, one digit, one escape, or one emoji. This literal holds a different count. A Burmese vanna with its signs counts as several scalar values; use a string literal for text that is longer than one scalar value."""

[codes.ZK0108.title]
en = "unterminated raw identifier"
[codes.ZK0108.message]
en = "raw identifier is missing its closing backtick before the end of the line"
[codes.ZK0108.explain]
en = """A raw identifier is written between backticks on one line and can hold spaces, reserved words and operator characters. The lexer reached the end of the line without finding the closing backtick. Add it, or remove the opening one."""

[codes.ZK0109.title]
en = "blank raw identifier"
[codes.ZK0109.message]
en = "raw identifier between backticks is blank"
[codes.ZK0109.explain]
en = """Two backticks with nothing between them do not name a variable. A raw identifier needs at least one character between the backticks."""

[codes.ZK0110.title]
en = "old statement ending"
[codes.ZK0110.message]
en = "\"%{old}\" ends in ပါ; a statement ends in မည်"
[codes.ZK0110.explain]
en = """Each statement verb ends in မည်: ထားမည်, ပြသမည်, လုပ်ဆောင်မည်, ထည့်မည်, ပြန်ပေးမည်, ရပ်မည်, ကျော်မည် and the rest. The ending ပါ was the spelling of an earlier version. The declaration ဖြစ်ပါစေ and the closers ပြီးဆုံးပါပြီး keep their ပါ."""

[lexer.help_new_ending]
en = "write \"%{new}\""

# --------------------------------------------------------------- parser ZK02xx

[parser.help_split]
en = "write \"%{s} %{p}\" with a space: a name joined to a particle is read as one word"

[parser.help_group]
en = "put the clause before \"%{op}\" in parentheses: a value read with a verb takes no operator unless it stands in parentheses"

[codes.ZK0201.title]
en = "unexpected token"
[codes.ZK0201.message]
en = "expected %{e}, found %{f}"
[codes.ZK0201.explain]
en = """The parser reached a token that does not fit the statement at this point; the message names what the grammar allows here. A common cause is a name written attached to a particle, such as \"အသက်ကို\": a word that is not made of reserved words alone is one identifier, so write a space between the name and the particle."""

[codes.ZK0202.title]
en = "missing operand"
[codes.ZK0202.message]
en = "expected an operand, found %{f}"
[codes.ZK0202.explain]
en = """An operand is a literal, a name, a call expression, or an expression in parentheses. A particle such as \"ကို\" or \"နှင့်\" is followed with an operand or with the verb that closes the clause, and an operator such as \"+\" is followed with an operand. Here neither comes next."""

[codes.ZK0203.title]
en = "statement verb missing"
[codes.ZK0203.message]
en = "this statement does not end in a statement verb, found %{f}"
[codes.ZK0203.help]
en = "a statement ends in \"ပြသမည်\", \"ထားမည်\" or \"ကို ပြန်ပေးမည်\", or is a loop with \"နေသရွေ့\" or \"မှ ... အထိ\""
[codes.ZK0203.explain]
en = """A statement that does not start with a reserved word is a clause that ends in a statement verb: \"ပြသမည်\" (print), \"ထားမည်\" (assign) or \"ကို ပြန်ပေးမည်\" (return a value). It can also be a condition followed with \"နေသရွေ့\" (a while loop) or a bound followed with \"မှ\" (a counted loop). This statement ends in a value and none of these."""

[codes.ZK0204.title]
en = "statement verb inside an expression"
[codes.ZK0204.message]
en = "statement verb \"%{v}\" cannot stand inside an expression"
[codes.ZK0204.explain]
en = """Statement verbs such as \"ပြသမည်\" and \"ထားမည်\" close a whole statement and produce no value. Here one appears inside parentheses, a call argument or a condition, where a value is needed. Move the statement out, or use a verb-noun such as \"ပေါင်းလဒ်\" that produces a value."""

[codes.ZK0205.title]
en = "too few operands"
[codes.ZK0205.message]
en = "\"%{v}\" needs %{n} operands, found %{m}"
[codes.ZK0205.explain]
en = """Each verb takes a fixed number of operands, each followed with its particle: \"ပေါင်းလဒ်\" takes two (\"a နှင့် b ၏\"), \"ဘစ်အလိုက် ပြောင်းပြန်ပြောင်းလဒ်\" takes one (\"a ၏\"), and \"ထားမည်\" takes two (\"x ကို v ဟု\"). The clause before this verb holds fewer operands than the verb needs."""

[codes.ZK0206.title]
en = "wrong particle for the verb"
[codes.ZK0206.message]
en = "\"%{v}\" needs \"%{e}\" after operand %{i}, found %{f}"
[codes.ZK0206.explain]
en = """A verb checks the particle that follows each of its operands. \"ပေါင်းလဒ်\" wants \"a နှင့် b ၏\", \"စားသော စားလဒ်\" wants \"a ကို b ဖြင့်\", the comparisons want \"a သည် b\" then \"နှင့်\", \"ထက်\" or \"အောက်\", and \"ထားမည်\" wants \"x ကို v ဟု\". The operand named in the message carries a different particle, or none."""

[codes.ZK0207.title]
en = "two particles on one operand"
[codes.ZK0207.message]
en = "this operand has the particle \"%{p}\" before this one"
[codes.ZK0207.explain]
en = """Each operand in a clause is followed with one particle that names its role. Two particles in a row leave the second one without an operand. Remove one of them, or write the missing operand between them."""

[codes.ZK0208.title]
en = "clause without a verb"
[codes.ZK0208.message]
en = "operands wait for a verb: %{w}"
[codes.ZK0208.explain]
en = """In a clause, each operand is followed with the particle of its role, and a verb at the end takes the operands it needs. Here operands are left over at the end of the clause; the message lists them with their particles. Add the verb that takes them, or remove the stranded particle."""

[codes.ZK0209.title]
en = "operands before a statement verb"
[codes.ZK0209.message]
en = "operands left over before \"%{v}\": %{w}"
[codes.ZK0209.explain]
en = """A statement verb takes its own operands and ends the statement, so no operand can be left waiting before it. The listed operands belong to no verb; add the verb that needs them, or remove them."""

[codes.ZK0210.title]
en = "chained comparison"
[codes.ZK0210.message]
en = "a comparison cannot be the operand of another comparison"
[codes.ZK0210.help]
en = "join the two comparisons with \"ဖြစ်၍\", or put the inner one in parentheses"
[codes.ZK0210.explain]
en = """Comparisons do not chain: \"a < b < c\" and \"a သည် b နှင့် ညီ သည် c နှင့် ညီသည်\" are errors. Write \"a < b ဖြစ်၍ b < c\" to test both. A comparison in parentheses is a plain boolean operand and can be compared again."""

[codes.ZK0211.title]
en = "else without if"
[codes.ZK0211.message]
en = "\"%{w}\" must follow the block of a conditional"
[codes.ZK0211.explain]
en = """\"ထိုသို့မဟုတ်ဘဲ\" (else if) and \"သို့မဟုတ်ပါက\" (else) continue a conditional statement. These come right after the block or the single statement of an \"အကယ်၍\" arm, and cannot start a statement on their own."""

[codes.ZK0212.title]
en = "update outside a generic loop"
[codes.ZK0212.message]
en = "\"ပြီးလျှင်\" can appear as the last statement of a generic loop and nowhere else"
[codes.ZK0212.explain]
en = """\"ပြီးလျှင်\" (when done) marks the update of a generic loop, the statement that runs after each iteration. It is allowed as the last statement in the block of a loop that starts with \"ကိန်းရှင် ... ဖြစ်ကာ\" or \"ကိန်းရှင် ... ဖြစ်ပြီး\", and nowhere else."""

[codes.ZK0213.title]
en = "update is not last"
[codes.ZK0213.message]
en = "the \"ပြီးလျှင်\" update must be the last statement of the loop"
[codes.ZK0213.explain]
en = """The update of a generic loop runs after the rest of the block, so it is written last, right before the block closer. Move the statements that follow it above it."""

[codes.ZK0214.title]
en = "nested external function or start block"
[codes.ZK0214.message]
en = "external functions, C functions and the start block can be declared at the top level and nowhere else"
[codes.ZK0214.explain]
en = """A function with statements can sit inside another function, where it can use the locals around it. An external function, a C function and the start block have no locals around them and belong to the whole file: declare them at the top level."""

[codes.ZK0215.title]
en = "conditional as a single-statement block"
[codes.ZK0215.message]
en = "a single-statement block cannot be another conditional"
[codes.ZK0215.explain]
en = """When a conditional arm has no block phrase, its block is the single statement that follows. That statement cannot itself be a conditional, so that each else arm belongs to one clear conditional. Wrap the inner conditional in \"အောက်ပါတို့ကို လုပ်ဆောင်မည်။\" and \"လုပ်ဆောင်စရာများ ပြီးဆုံးပါပြီး။\"."""

[codes.ZK0216.title]
en = "invalid bit count"
[codes.ZK0216.message]
en = "%{n} is not a valid bit count here; use %{a}"
[codes.ZK0216.explain]
en = """Integer kinds come in 8, 16, 32, 64 and 128 bits, floating-point kinds in 16, 32, 64 and 128 bits. The bit count is written in decimal before \"ဘစ်\", in Burmese or Western digits."""

[codes.ZK0217.title]
en = "sign word on a kind that is not an integer"
[codes.ZK0217.message]
en = "a sign word can stand before \"ကိန်းပြည့်\" and no other kind"
[codes.ZK0217.explain]
en = """Floating-point numbers are signed, and characters and booleans have no sign, so the sign words \"လက္ခဏာရှိ\" and \"လက္ခဏာမဲ့\" are allowed in integer kinds and nowhere else."""

[codes.ZK0218.title]
en = "invalid number base"
[codes.ZK0218.message]
en = "%{b} is not a number base; use a decimal integer from 2 to 36"
[codes.ZK0218.explain]
en = """The base prefix \"အခြေ N ဖြင့်\" takes a decimal integer from 2 to 36. Digits above 9 are written as the letters A to Z."""

[codes.ZK0219.title]
en = "invalid digit"
[codes.ZK0219.message]
en = "\"%{d}\" is not a digit in base %{b}"
[codes.ZK0219.explain]
en = """Each digit of a literal must be below its base: 0 and 1 in base 2, 0 to 9 in base 10, and the letters A to Z (in either case) for 10 to 35 in higher bases. Letters are allowed after a base prefix above 10 and nowhere else, and a literal with a base prefix has integer digits but no fraction or exponent."""

[codes.ZK0220.title]
en = "literal out of range"
[codes.ZK0220.message]
en = "literal %{l} does not fit its kind"
[codes.ZK0220.explain]
en = """An integer literal must fit its kind: the bit count of its kind prefix, or 64 bits when no prefix is written. Unsigned kinds hold 0 to 2^bits - 1. Signed decimal literals hold up to 2^(bits-1), so that \"-128\" fits an 8-bit integer. A literal with a base prefix is a bit pattern of the full width."""

[codes.ZK0221.title]
en = "fraction in an integer literal"
[codes.ZK0221.message]
en = "an integer kind cannot hold a literal with a fraction or exponent"
[codes.ZK0221.explain]
en = """The kind prefix \"ကိန်းပြည့်\" makes the literal an integer, but this literal is written with a fraction or an exponent. Use \"ဒဿမကိန်း\" for a floating-point literal, or remove the fraction."""

[codes.ZK0222.title]
en = "invalid literal kind"
[codes.ZK0222.message]
en = "the kind of a number literal must be an integer or floating-point kind, and the kind of a list literal a list kind"
[codes.ZK0222.explain]
en = """A kind after a literal, as in \"၁၂၇ ဟူသော လက္ခဏာမဲ့ ၈ ဘစ် ကိန်းပြည့် တစ်ခု\", fixes the kind of the number before it; after a list literal, \"[၁၊ ၂] ဟူသော ၈ ဘစ် ကိန်းပြည့် စာရင်း တစ်ခု\", the kind of the list. Characters, text and booleans have literals of their own ('က', \"က\", \"မှန်\"), so \"စာလုံး\", \"စာသား\" and \"မှန်မှားတန်ဖိုး\" cannot follow a number, and a list literal takes a list kind alone."""

[codes.ZK0225.title]
en = "constant loop variable"
[codes.ZK0225.message]
en = "a generic loop variable must be declared with \"ကိန်းရှင်\""
[codes.ZK0225.explain]
en = """A generic loop updates its variable after each iteration, so the header starts with \"ကိန်းရှင်\" (variable). \"ကိန်းသေ\" (constant) declares a value that never changes and cannot start a loop."""

[codes.ZK0226.title]
en = "unmatched block closer"
[codes.ZK0226.message]
en = "this block closer has no open block to close"
[codes.ZK0226.explain]
en = """\"လုပ်ဆောင်စရာများ ပြီးဆုံးပါပြီး။\" closes the block opened with \"အောက်ပါတို့ကို လုပ်ဆောင်မည်။\" or with a function opener. Here no block is open. Remove the closer, or add the opener it belongs to."""

[codes.ZK0227.title]
en = "bad list count"
[codes.ZK0227.message]
en = "\"%{n}\" is not a cell count; write a whole number above zero, in digits or worked out from constants"
[codes.ZK0227.explain]
en = """A list kind with a count, \"အကွက် <n> ခုရှိသော <kind> စာရင်း\", takes a whole number above zero. Write it in digits, such as ၃ or 10, or work it out at compile time: \"အကွက် N * ၂ ခုရှိသော\" takes each expression the compiler folds to an integer: literals, constants (declared before it, at the top of the file, or imported), the arithmetic, bitwise and shift operators in each spelling, conversions, sizes, cells and fields of constant lists and structs, and the cell count of a counted list. A list with no cells holds nothing, and the count cannot come from a variable: the kind must be known before the program runs."""

[codes.ZK0228.title]
en = "nested struct"
[codes.ZK0228.message]
en = "structs can be declared at the top level and nowhere else"
[codes.ZK0228.explain]
en = """A struct declaration, \"<name> ဟူသော ဒေတာအစုအဝေးတွင် ... တို့ပါဝင်သည်။\", cannot appear inside a block, a loop, a conditional or a function. Move it to the top level of the file; a struct can be used before its declaration."""

[codes.ZK0229.title]
en = "misplaced export mark"
[codes.ZK0229.message]
en = "\"အများသုံး\" marks a top-level function, variable, constant or kind alias, and stands after \"ဟူသော\" in a struct or an enumeration"
[codes.ZK0229.explain]
en = """The export mark \"အများသုံး\" stands right before \"လုပ်ဆောင်ချက်\", \"ဒေတာအမျိုးအစား\" (an alias), \"ကိန်းရှင်\" or \"ကိန်းသေ\" at the top level of a file, and lets other files import that declaration. A struct or an enumeration carries it after \"ဟူသော\": \"<name> ဟူသော အများသုံး ဒေတာအစုအဝေးတွင် ...\". It cannot mark a statement, a loop, or a declaration inside a block."""

[codes.ZK0230.title]
en = "misplaced import"
[codes.ZK0230.message]
en = "imports go at the top of the file"
[codes.ZK0230.help]
en = "move it above the first declaration or statement"
[codes.ZK0230.explain]
en = """An import, \"\"<file>\" မှ <name> ကို ထည့်သွင်းမည်။\", names what a file takes from another file. The imports of a file come first, ahead of each declaration and statement, and never inside a block."""

[codes.ZK0231.title]
en = "circular import"
[codes.ZK0231.message]
en = "this import goes in a circle: %{chain}"
[codes.ZK0231.explain]
en = """Files that import each other, at once or through other files, cannot be read one after the other. Move what both files need to a third file, and import it from both."""

[codes.ZK0232.title]
en = "import without a file"
[codes.ZK0232.message]
en = "this program was not read from a file, so it cannot import \"%{f}\""
[codes.ZK0232.explain]
en = """An import names a file relative to the file that holds the import. A program written in the compiler explorer, on a Learn page or on standard input has no folder, so its imports cannot be found. Save the program in a file and run it with \"zakac run\"."""

[codes.ZK0234.title]
en = "kind without a classifier"
[codes.ZK0234.message]
en = "a kind here takes \"တစ်\" and a classifier"
[codes.ZK0234.help]
en = "write \"%{k} တစ်%{c}\""
[codes.ZK0234.explain]
en = """A kind written in a declaration, a parameter, a field, a result, a conversion, a size, a default arm or after a literal counts as Burmese counts a thing: the kind, then \"တစ်\" (one) and the classifier of the kind, as in \"ကိန်းပြည့် စာရင်း တစ်ခု\". Most kinds take \"ခု\", \"စာလုံး\" takes \"လုံး\", and a struct, an enumeration or an alias takes the classifier its declaration gives. The word goes after the whole kind, never inside it. To have the compiler take the kind of a declaration from its value, leave the kind out and write the value alone."""

[codes.ZK0235.title]
en = "nested enumeration"
[codes.ZK0235.message]
en = "enumerations can be declared at the top level and nowhere else"
[codes.ZK0235.explain]
en = """An enumeration declaration, \"<name> ဟူသော ဒေတာအမျိုးအစားကွဲတွင် ... တို့ပါဝင်သည်။\", cannot appear inside a block, a loop, a conditional or a function. Move it to the top level of the file; an enumeration can be used before its declaration."""

[codes.ZK0236.title]
en = "arm after the default arm"
[codes.ZK0236.message]
en = "the default arm \"တခြား ... တစ်ခု ဖြစ်လျှင်\" comes last in a switch"
[codes.ZK0236.explain]
en = """A switch runs the first arm whose case equals its subject, and the default arm \"တခြား <kind> တစ်<classifier> ဖြစ်လျှင်\" when none does. An arm after the default arm could never run, so the default arm must be the last. Move this arm above the default arm."""

[codes.ZK0237.title]
en = "parameters marked in part"
[codes.ZK0237.message]
en = "some parameters have a mark and some do not"
[codes.ZK0237.help]
en = "give each parameter a mark, as \"<name> ဟူသော <kind> တစ်ခု ကို ဝိဘတ် \"<mark>\" ကို သုံး၍ လည်းကောင်း\", or leave out each mark"
[codes.ZK0237.explain]
en = """A parameter can have a mark, the word a marked call writes after its argument: \"လမ်းကြောင်း ဟူသော စာသား တစ်ခု ကို ဝိဘတ် \"၌ရှိသော\" ကို သုံး၍ လည်းကောင်း\". A marked call gives each argument with its mark, so a header marks each parameter or none of them."""

[codes.ZK0238.title]
en = "unknown stdlib module"
[codes.ZK0238.message]
en = "the stdlib has no module \"%{n}\""
[codes.ZK0238.help]
en = "the stdlib has %{l}"
[codes.ZK0238.explain]
en = """An import whose path starts with \"စံကား/\" reads a module of the stdlib, which the compiler carries, never a file of that name. This name is none of its modules."""

[codes.ZK0239.title]
en = "function kind not in parentheses"
[codes.ZK0239.message]
en = "a function kind with parameters in a list of parameters or fields stands in parentheses"
[codes.ZK0239.help]
en = "write it as \"<name> ဟူသော (<parameters> လက်ခံ… လုပ်ဆောင်ချက် အမျိုးအစား) တစ်ခု\""
[codes.ZK0239.explain]
en = """A function kind writes its parameters as a header does, each kind with its measure word and no name, each ending in \"လည်းကောင်း\" when there are several. In a list of parameters or fields, the parameters of the kind would run into the entries around it, so the list would have two readings. Parentheses close the kind: \"ရှေ့ ဟူသော (ကိန်းပြည့် တစ်ခု ကို လည်းကောင်း ကိန်းပြည့် တစ်ခု ကို လည်းကောင်း လက်ခံပြီး မှန်မှားတန်ဖိုး တစ်ခု ကို ပြန်ပေးသော လုပ်ဆောင်ချက် အမျိုးအစား) တစ်ခု\". A function kind with no parameters needs none."""

[codes.ZK0240.title]
en = "nested kind alias"
[codes.ZK0240.message]
en = "kind aliases can be declared at the top level and nowhere else"
[codes.ZK0240.explain]
en = """A kind alias, \"ဒေတာအမျိုးအစား <alias> ကို <kind> ဟုလည်း မှတ်ယူနိုင်ပါသည်။\", cannot appear inside a block, a loop, a conditional or a function. Move it to the top level of the file; an alias can be used before its declaration."""

[codes.ZK0241.title]
en = "bad parameter mark"
[codes.ZK0241.message]
en = "\"%{m}\" cannot be a mark"
[codes.ZK0241.help]
en = "a mark is one name, or one particle such as \"ကို\" or \"သို့\""
[codes.ZK0241.explain]
en = """The string after \"ဝိဘတ်\" is the word a marked call writes after the argument, so it must read as one word a mark can be: a name, or a particle other than the endings \"သည်\", \"ပါ\", \"ဖြစ်ကာ\", \"ပြီးလျှင်\" and \"လက်ခံပြီး\". Spaces, signs and several words cannot be a mark."""

# -------------------------------------------------------------- resolve ZK03xx

[codes.ZK0301.title]
en = "undeclared name"
[codes.ZK0301.message]
en = "\"%{n}\" is not declared"
[codes.ZK0301.help_result]
en = "a function has no variable \"ရလဒ်\": give its result back with \"<value> ကို ပြန်ပေးမည်။\""
[codes.ZK0301.explain]
en = """A name is used before a declaration of it is in scope. Declare the variable with \"ကိန်းရှင်\" or \"ကိန်းသေ\" first, in this block or in a block around it. Names declared inside a block are not visible after the block closer."""

[codes.ZK0302.title]
en = "name declared twice"
[codes.ZK0302.message]
en = "\"%{n}\" is declared before in this scope"
[codes.ZK0302.help]
en = "pick another name, or declare it in an inner block to shadow the outer one"
[codes.ZK0302.explain]
en = """A block cannot declare the same name twice. Shadowing is allowed: an inner block can declare a name that an outer block holds, and the inner declaration hides the outer one until the inner block ends. Rename one of the two declarations, or turn the second one into an assignment."""

[codes.ZK0303.title]
en = "undeclared function"
[codes.ZK0303.message]
en = "function \"%{n}\" is not declared"
[codes.ZK0303.explain]
en = """A call names a function that no top-level \"လုပ်ဆောင်ချက် ... သည်\" declares. Functions can be called before their declaration in the file, but the declaration must exist somewhere at the top level. Check the spelling of the name."""

[codes.ZK0304.title]
en = "function declared twice"
[codes.ZK0304.message]
en = "function \"%{n}\" is declared twice"
[codes.ZK0304.explain]
en = """Two top-level declarations give a function the same name and the same parameter kinds and marks, so no call can tell them apart. A file can declare several functions of one name when their parameter kinds or their marks differ; a call then runs the one its arguments fit. Rename one of the two functions, or change its parameters. A name a file imports cannot also be declared in that file."""

[codes.ZK0305.title]
en = "duplicate parameter"
[codes.ZK0305.message]
en = "parameter \"%{n}\" is listed twice"
[codes.ZK0305.explain]
en = """Two parameters of one function have the same name, so the second one would hide the first inside the function. Give each parameter its own name."""

[codes.ZK0306.title]
en = "assignment to a constant"
[codes.ZK0306.message]
en = "\"%{n}\" is a constant and cannot be assigned"
[codes.ZK0306.explain]
en = """A name declared with \"ကိန်းသေ\" keeps its initial value for its whole scope. To change the value later, declare it with \"ကိန်းရှင်\" instead."""

[codes.ZK0307.title]
en = "assignment to a counted-loop variable"
[codes.ZK0307.message]
en = "\"%{n}\" is a counted-loop variable and cannot be assigned"
[codes.ZK0307.explain]
en = """The variable of a counted loop (\"မှ ... အထိ ... အနေဖြင့်\") steps on its own from the first bound to the last. Assigning to it inside the loop would break that count. Use a generic loop when the variable must change in other steps, or put the value in another variable and change that one."""

[codes.ZK0308.title]
en = "constant without a value"
[codes.ZK0308.message]
en = "constant \"%{n}\" needs an initial value"
[codes.ZK0308.explain]
en = """A constant cannot be assigned later, so its declaration must give its value: write \"ဖြစ်၍ တန်ဖိုးသည်\" and the value between the kind and \"ဖြစ်ပါစေ\". A variable declared with \"ကိန်းရှင်\" can leave the value out and starts at the kind's default."""

[codes.ZK0309.title]
en = "break outside a loop"
[codes.ZK0309.message]
en = "\"ကွင်းဆက် ကို ရပ်မည်\" stands outside a loop"
[codes.ZK0309.explain]
en = """Breaking leaves the innermost while, counted, or generic loop. Here no loop encloses the statement. Remove it, or move it inside a loop."""

[codes.ZK0310.title]
en = "continue outside a loop"
[codes.ZK0310.message]
en = "\"နောက်တစ်ကြိမ်ဆီသို့ ကျော်မည်\" stands outside a loop"
[codes.ZK0310.explain]
en = """Continuing skips to the next iteration of the innermost while, counted, or generic loop. Here no loop encloses the statement. Remove it, or move it inside a loop."""

[codes.ZK0311.title]
en = "return outside a function"
[codes.ZK0311.message]
en = "a return statement stands outside a function"
[codes.ZK0311.explain]
en = """Returning ends the function that holds the statement. Top-level statements belong to no function, so a return there has nothing to end. Remove it, or move it into a function."""

[codes.ZK0312.title]
en = "value returned from a function without a result"
[codes.ZK0312.message]
en = "function \"%{n}\" returns nothing, but a value is returned"
[codes.ZK0312.explain]
en = """The function header opens with \"အောက်ပါတို့ကို လုပ်ဆောင်မည်\", so the function gives back no value. Write a bare \"ပြန်ပေးမည်။\" to leave the function, or start the statements with \"အောက်ပါတို့ကို လုပ်ဆောင်ကာ <kind> တစ်ခု ကို ပြန်ပေးမည်\"."""

[codes.ZK0313.title]
en = "missing return value"
[codes.ZK0313.message]
en = "function \"%{n}\" returns %{k}, but no value is returned"
[codes.ZK0313.explain]
en = """The function header promises a result, so each return statement must give one: \"<value> ကို ပြန်ပေးမည်။\"."""

[codes.ZK0314.title]
en = "wrong number of arguments"
[codes.ZK0314.message]
en = "function \"%{n}\" takes %{want} arguments, %{got} given"
[codes.ZK0314.explain]
en = """A call must pass one argument for each parameter of the function, in order. Add or remove arguments so the counts match the declaration."""

[codes.ZK0315.title]
en = "function without a result used as a value"
[codes.ZK0315.message]
en = "function \"%{n}\" returns nothing and cannot be used as a value"
[codes.ZK0315.explain]
en = """The call expression \"... လုပ်ဆောင်သော ရလဒ်\" needs the function to return a value, but its header has no result clause. Call it as a statement with \"လုပ်ဆောင်မည်\", or start its statements with \"အောက်ပါတို့ကို လုပ်ဆောင်ကာ <kind> တစ်ခု ကို ပြန်ပေးမည်\"."""

[codes.ZK0316.title]
en = "duplicate struct"
[codes.ZK0316.message]
en = "\"%{n}\" names a struct, an enumeration or a kind alias declared before"
[codes.ZK0316.explain]
en = """Each struct, enumeration or kind alias name names one kind in the whole program, and an enumeration or an alias whose name ends in \"များ\" claims its name without \"များ\" too. Rename one of the two declarations."""

[codes.ZK0317.title]
en = "duplicate field"
[codes.ZK0317.message]
en = "\"%{s}\" names the field \"%{n}\" twice"
[codes.ZK0317.explain]
en = """A field access \"x ၏ <field>\" finds a field on its name, so two fields of one struct need two names. Rename one of them."""

[codes.ZK0318.title]
en = "unknown kind name"
[codes.ZK0318.message]
en = "no struct or enumeration named \"%{n}\" is declared"
[codes.ZK0318.explain]
en = """A name in a kind phrase, as in \"ကိန်းရှင် x သည် လူ တစ်ယောက် ဖြစ်ပါစေ။\", names a struct or an enumeration. Declare it at the top level with \"<name> ဟူသော ဒေတာအစုအဝေးတွင် ... တို့ပါဝင်သည်။\" or \"<name> ဟူသော ဒေတာအမျိုးအစားကွဲတွင် ... တို့ပါဝင်သည်။\", or check the spelling."""

[codes.ZK0319.title]
en = "name of a struct reused"
[codes.ZK0319.message]
en = "\"%{n}\" names a struct or an enumeration, so it cannot name a value or a function too"
[codes.ZK0319.explain]
en = """A struct name can start a kind wherever a value can stand, as in \"လူ တစ်ယောက် ၏ အရွယ်အစား\", so the compiler reads a struct name as a kind each time. A variable, constant, parameter, field or function with that name could never be read. Pick another name for one of the two."""

[codes.ZK0320.title]
en = "unknown field"
[codes.ZK0320.message]
en = "\"%{s}\" has no field named \"%{n}\""
[codes.ZK0320.explain]
en = """After \"၏\", a name reads a field of the struct before it. The struct declaration lists the fields it has; check the spelling, or add the field to the declaration."""

[codes.ZK0321.title]
en = "field set twice"
[codes.ZK0321.message]
en = "the \"%{s}\" literal sets the field \"%{n}\" twice"
[codes.ZK0321.explain]
en = """A struct literal, as in \"အသက် ၂၀ ရှိသော လူတစ်ယောက်\", gives each field one value. Remove one of the two, or name the other field."""

[codes.ZK0322.title]
en = "nothing to import"
[codes.ZK0322.message]
en = "\"%{f}\" exports nothing named \"%{n}\""
[codes.ZK0322.help_private]
en = "\"%{n}\" is declared there without \"အများသုံး\"; add the mark to share it"
[codes.ZK0322.help_hidden]
en = "\"%{n}\" is declared in \"%{f}\"; mark it \"အများသုံး\" there and import it here"
[codes.ZK0322.explain]
en = """An import takes names that the other file exports. A declaration is exported when \"အများသုံး\" stands before it; without the mark it is private to its file."""

[codes.ZK0323.title]
en = "statement in an imported file"
[codes.ZK0323.message]
en = "\"%{f}\" is imported, so it holds declarations and no statements"
[codes.ZK0323.explain]
en = """A file that another file imports declares functions, structs, variables and constants for other files to use. Statements that print, loop, call or assign belong in the file that is run, the one given to \"zakac run\"."""

[codes.ZK0325.title]
en = "a second start block"
[codes.ZK0325.message]
en = "the program has a start block before this one"
[codes.ZK0325.help]
en = "keep one \"ပရိုဂရမ်သည်\" block and move the statements of the other into it"
[codes.ZK0325.explain]
en = """A program starts at one place. The file given to \"zakac run\" holds at most one start block, \"ပရိုဂရမ်သည်\", and an imported file holds none."""

[codes.ZK0326.title]
en = "statement at the top level"
[codes.ZK0326.message]
en = "a statement that runs goes inside the start block, not at the top level"
[codes.ZK0326.help]
en = "move the statement into the \"ပရိုဂရမ်သည်\" block"
[codes.ZK0326.explain]
en = """A program starts at its start block, \"ပရိုဂရမ်သည်\". The top level of a file declares functions, structs, variables and constants, and the starting values of the variables are set before the start block runs. Statements that print, loop, call or assign go inside the start block, or inside a function."""

[codes.ZK0327.title]
en = "no start block"
[codes.ZK0327.message]
en = "the program has no start block, \"ပရိုဂရမ်သည်\""
[codes.ZK0327.help]
en = "add \"ပရိုဂရမ်သည် အောက်ပါတို့ကို လုပ်ဆောင်မည်။\", the statements to run, and \"ပရိုဂရမ် ပြီးဆုံးပါပြီး။\""
[codes.ZK0327.explain]
en = """The file given to \"zakac run\" starts the program, so it holds a start block, \"ပရိုဂရမ်သည်\", with the statements that run first. A file that other files import holds declarations alone and no start block."""

[codes.ZK0324.title]
en = "private struct in an export"
[codes.ZK0324.message]
en = "\"%{n}\" is exported, but its kind names the private struct \"%{s}\""
[codes.ZK0324.help]
en = "mark \"%{s}\" with \"အများသုံး\" as well, or keep \"%{n}\" private"
[codes.ZK0324.explain]
en = """An exported function, struct, variable or constant can be used from other files, so each struct its kinds name must be usable there too. A struct that the file declares without \"အများသုံး\" is private to the file. Export the struct as well, or remove the mark from the declaration that uses it."""

[codes.ZK0328.title]
en = "duplicate member"
[codes.ZK0328.message]
en = "the enumeration \"%{e}\" names the member \"%{n}\" twice"
[codes.ZK0328.explain]
en = """Each member of an enumeration has a name of its own, so \"<name>များထဲမှ <member>\" picks one member. Rename one of the two members."""

[codes.ZK0329.title]
en = "unknown member"
[codes.ZK0329.message]
en = "the enumeration \"%{e}\" has no member \"%{n}\""
[codes.ZK0329.explain]
en = """\"<name>များထဲမှ <member>\" and a bare case in a switch over an enumeration name one of its members, as its declaration \"<name> ဟူသော ဒေတာအမျိုးအစားကွဲတွင် ... တို့ပါဝင်သည်။\" lists them. Check the spelling, or add the member to the declaration."""

[codes.ZK0330.title]
en = "unknown enumeration"
[codes.ZK0330.message]
en = "\"%{n}\" before \"ထဲမှ\" names no enumeration"
[codes.ZK0330.help]
en = "write \"%{f}ထဲမှ\""
[codes.ZK0330.explain]
en = """A member is written \"<name>များထဲမှ <member>\", \"<member> from among the <name>s\": the enumeration name, then \"များ\", then \"ထဲမှ\". A name that ends in \"များ\" takes no second \"များ\". The name before \"ထဲမှ\" here is no enumeration, or lacks its \"များ\"."""

[codes.ZK0331.title]
en = "wrong mark"
[codes.ZK0331.message]
en = "argument %{i} of \"%{n}\" is marked \"%{f}\", not \"%{w}\""
[codes.ZK0331.help]
en = "write \"%{w}\" after the argument"
[codes.ZK0331.explain]
en = """A marked call writes each argument with the mark its parameter declares, in the order of the parameters: for `ဒေတာ ဟူသော စာသား တစ်ခု ကို ဝိဘတ် "ကို" ကို သုံး၍ လည်းကောင်း လမ်းကြောင်း ဟူသော စာသား တစ်ခု ကို ဝိဘတ် "သို့" ကို သုံး၍ လည်းကောင်း`, the call is \"<data> ကို <path> သို့ <name> မည်\". The mark after this argument is another word."""

[codes.ZK0332.title]
en = "no function fits"
[codes.ZK0332.message]
en = "no function \"%{n}\" takes these arguments"
[codes.ZK0332.help]
en = "the functions of this name take %{l}"
[codes.ZK0332.explain]
en = """A file can declare several functions of one name, each with other parameter kinds or other marks. A call runs the one whose parameters its arguments fit: an argument for each parameter, the marks of the parameters when the call writes marks, and each argument of the kind of its parameter. No function of this name fits the arguments of this call."""

[codes.ZK0333.title]
en = "call fits more than one function"
[codes.ZK0333.message]
en = "more than one function \"%{n}\" takes these arguments"
[codes.ZK0333.help]
en = "write the marks of the function meant, or give each argument the kind of its parameter"
[codes.ZK0333.explain]
en = """A file can declare several functions of one name, each with other parameter kinds or other marks. A call runs the one whose parameters its arguments fit, and here two or more fit: a number with no kind fits each integer kind, and a call with no marks fits functions that differ in their marks alone. Write the marks of the function meant, or a kind on the number, such as \"(၈ ဘစ် ကိန်းပြည့် ၅)\"."""

[codes.ZK0334.title]
en = "unknown external function"
[codes.ZK0334.message]
en = "the VM serves no function \"%{n}\" with these parameter and result kinds"
[codes.ZK0334.help]
en = "the VM serves %{l}, each with a result that can fail with \"%{e}\""
[codes.ZK0334.explain]
en = """A function that comes from outside, \"လုပ်ဆောင်ချက် <name> သည် ပြင်ပမှလာသော လုပ်ဆောင်ချက်ဖြစ်၍ ...\", has no statements: the VM serves it while the program runs. The VM serves a fixed set of functions, so the name, the parameter kinds and the result kind must be those of one of them. The stdlib declares each of them; import them from there."""

[codes.ZK0335.title]
en = "function and function value of one name"
[codes.ZK0335.message]
en = "\"%{n}\" names both a function and a function value, so the call could run either"
[codes.ZK0335.help]
en = "rename the variable that holds the function value"
[codes.ZK0335.explain]
en = """A call names its function, and the name finds a declared function first, then a variable, a parameter or a constant of a function kind. When both are in reach, the reader cannot tell which one the call runs, so the compiler refuses it. Rename one of them."""

[codes.ZK0336.title]
en = "alias loop"
[codes.ZK0336.message]
en = "the kind alias \"%{n}\" leads back to itself"
[codes.ZK0336.explain]
en = """A kind alias names a kind, and that kind can be another alias. When the chain comes back to the first alias, it names no kind at all. Make one alias in the chain name a struct, an enumeration, a function kind or a built-in kind."""

[codes.ZK0337.title]
en = "C function name is no C name"
[codes.ZK0337.message]
en = "\"%{n}\" comes from a C lib, so its name must be a C name"
[codes.ZK0337.help]
en = "write the name as the lib spells it: ASCII letters, digits and \"_\", not starting with a digit"
[codes.ZK0337.explain]
en = """A function that comes from a C lib, \"လုပ်ဆောင်ချက် <name> သည် \"<lib>\" မှလာသော လုပ်ဆောင်ချက်ဖြစ်၍ ...\", calls the C function of its name in that lib. A C name holds ASCII letters, digits and \"_\" alone, and does not start with a digit."""

[codes.ZK0339.title]
en = "a function that can end with no result"
[codes.ZK0339.message]
en = "function \"%{n}\" gives back a result, but its block can reach its end without giving one back"
[codes.ZK0339.help]
en = "end each path with \"<value> ကို ပြန်ပေးမည်။\""
[codes.ZK0339.explain]
en = """A function whose header gives a result kind gives a value back on each path, with \"<value> ကို ပြန်ပေးမည်။\". A path ends at a return, or at an \"if\" with an else, or a switch with a default, whose arms each end in one. A loop is no such end, since its condition can be false at the start."""

[codes.ZK0338.title]
en = "C function declared twice with other kinds"
[codes.ZK0338.message]
en = "\"%{n}\" was declared as a C function with other parameter or result kinds"
[codes.ZK0338.help]
en = "give each declaration of \"%{n}\" the same parameter and result kinds"
[codes.ZK0338.explain]
en = """Each C name names one C function, so each declaration of a C function of that name, in each file of the program and among overloads, must give it the same parameter kinds and the same result kind."""

# ---------------------------------------------------------------- kinds ZK04xx

[codes.ZK0401.title]
en = "mismatched kinds"
[codes.ZK0401.message]
en = "expected %{want}, found %{got}"
[codes.ZK0401.help]
en = "convert the value with \"ကို <kind> တစ်ခု အဖြစ် ပြောင်းလဲသော ရလဒ်\""
[codes.ZK0401.explain]
en = """A value must fit the kind its place expects without losing data. Conversions happen on their own when no data can be lost: a narrower integer to a wider one of the same sign, an unsigned integer to a wider signed one, an integer to a float with enough fraction bits, and a narrower float to a wider one. Characters and booleans never convert on their own. Use the conversion verb for the others. In marked code, a pointer also converts on its own to and from the opaque \"လိပ်စာ\" when its block holds no address. A pointer whose block holds addresses, such as a pointer to a pointer, to text or to a plain list, converts with the verb alone, so a stored address is never read as other data without a conversion written out."""

[codes.ZK0402.title]
en = "condition is not a boolean"
[codes.ZK0402.message]
en = "a condition must be a boolean, found %{got}"
[codes.ZK0402.help]
en = "compare the pointer with \"မည်သည်ကိုမှ မညွှန်းသော လိပ်စာ\""
[codes.ZK0402.explain]
en = """The condition of \"အကယ်၍\", of a while loop, and of a generic loop must be a boolean value. Numbers do not count as true or false. Compare the value instead, for example \"က သည် ၀ နှင့် မညီ\"."""

[codes.ZK0403.title]
en = "operand of the wrong kind"
[codes.ZK0403.message]
en = "%{op} needs %{want}, found %{got}"
[codes.ZK0403.explain]
en = """Each operator works on certain kinds: arithmetic and \"-\" on numbers, bitwise operators and shifts on integers, logical operators, \"မဟုတ်\" and \"!\" on booleans, and ordering comparisons on numbers and characters. \"-\" of an unsigned integer is not allowed. Convert the operand first, or use another operator."""

[codes.ZK0404.title]
en = "incompatible operands"
[codes.ZK0404.message]
en = "cannot combine %{l} and %{r} without a conversion"
[codes.ZK0404.help_same]
en = "\"တစ်ခုတည်း\" asks whether two names are one object: it takes two shared objects or two function values; compare values with \"==\""
[codes.ZK0404.explain]
en = """The two operands of an operator are brought to one common kind, the wider of the two. Here neither kind converts to the other without losing data, for example a signed and an unsigned integer of the same width, or a 64-bit integer and a 64-bit float. Convert one operand with \"ကို <kind> အဖြစ် ပြောင်းလဲသော ရလဒ်\"."""

[codes.ZK0405.title]
en = "loop bound is not an integer"
[codes.ZK0405.message]
en = "a loop bound or step must be an integer, found %{got}"
[codes.ZK0405.explain]
en = """The bounds and the step of a counted loop must be integers. The loop variable takes the common kind of the two bounds. Convert the bound with \"ကို <kind> တစ်ခု အဖြစ် ပြောင်းလဲသော ရလဒ်\", or use a generic loop for a float counter."""

[codes.ZK0406.title]
en = "literal does not fit"
[codes.ZK0406.message]
en = "the literal %{v} does not fit %{k}"
[codes.ZK0406.explain]
en = """An integer literal without a kind prefix takes the kind its place expects. Here the value is outside the range of that kind. Use a value inside the range, or a wider kind."""

[codes.ZK0407.title]
en = "shift too far"
[codes.ZK0407.message]
en = "shift distance %{n} is not below the %{w}-bit width"
[codes.ZK0407.explain]
en = """A shift moves the bits of a value. A constant distance must be smaller than the bit width of the shifted value; shifting an 8-bit integer 8 or more bits is an error. A distance known at run time is not checked."""

[codes.ZK0408.title]
en = "invalid conversion"
[codes.ZK0408.message]
en = "cannot convert %{from} to %{to}"
[codes.ZK0408.explain]
en = """The conversion verb converts between numbers of all kinds, between characters and integers, and from booleans to integers. Floats and characters do not convert into each other, and nothing converts into a boolean: compare the value instead, for example \"က သည် ၀ နှင့် မညီ\". In marked code it also converts between addresses, between an address and an integer, between an object and an address, and a plain list of u8s into text once its UTF-8 is checked."""

[codes.ZK0409.title]
en = "loop step is not positive"
[codes.ZK0409.message]
en = "the step of a counted loop must be positive"
[codes.ZK0409.explain]
en = """The step gives the distance the loop variable moves in each round. The direction comes from \"ရေတွက်၍\", \"တိုး၍\", or \"လျှော့၍\", so the step itself must be greater than zero."""

[codes.ZK0410.title]
en = "invalid assignment target"
[codes.ZK0410.message]
en = "this cannot be assigned to; a target must be a variable or a dereference"
[codes.ZK0410.explain]
en = """An assignment \"x ကို v ဟု ထားမည်။\" stores v in a place. The target before \"ကို\" must be a variable, a parameter or a dereference such as \"p ၏ တန်ဖိုး\"; a literal or a computed value has no place to store into. Assign to a variable, or dereference a pointer to store through it."""

[codes.ZK0411.title]
en = "no address"
[codes.ZK0411.message]
en = "the address of %{what} cannot be taken; variables and dereferences alone have an address"
[codes.ZK0411.explain]
en = """\"x ၏ လိပ်စာ\" and \"&x\" give the address of a place: a variable, a parameter or a dereference. A literal, the result of a call or a computed value is not stored at an address of its own. Store the value in a variable first and take the address of the variable."""

[codes.ZK0412.title]
en = "address of a fixed name"
[codes.ZK0412.message]
en = "\"%{name}\" cannot be changed, so its address cannot be taken"
[codes.ZK0412.explain]
en = """Writing through the address of a name would change the name. Constants and counted-loop variables cannot be changed, so their address cannot be taken. Store the value in a separate variable and take the address of that variable instead."""

[codes.ZK0413.title]
en = "not a pointer"
[codes.ZK0413.message]
en = "%{kind} is not a pointer and cannot be dereferenced"
[codes.ZK0413.explain]
en = """A dereference, \"p ၏ တန်ဖိုး\" or \"*p\", reads the value a pointer points at. The operand must have a pointer kind, written \"<kind> လိပ်စာ\"; numbers, characters and booleans are not pointers. Check that the operand is the pointer and not the value it points at."""

[codes.ZK0413.help]
en = "to point at \"%{name}\" itself, write \"%{name} ၏ လိပ်စာ\""

[codes.ZK0414.title]
en = "opaque pointer"
[codes.ZK0414.message]
en = "an opaque \"လိပ်စာ\" cannot be dereferenced or offset"
[codes.ZK0414.help]
en = "convert it to a pointer kind first with \"ကို <kind> လိပ်စာ တစ်ခု အဖြစ် ပြောင်းလဲသော ရလဒ်\""
[codes.ZK0414.explain]
en = """The opaque pointer kind \"လိပ်စာ\" holds an address but no kind for the value there, so the compiler cannot tell what to read or how far to move. Convert it to a pointer kind such as \"ကိန်းပြည့် လိပ်စာ\" with the conversion verb, then dereference or offset the result."""

[codes.ZK0415.title]
en = "operator not for pointers"
[codes.ZK0415.message]
en = "the operator \"%{op}\" cannot be used on pointers"
[codes.ZK0415.explain]
en = """A pointer takes few operators: \"+\" and \"-\" with an integer to move it, \"-\" between two pointers of the same kind for the distance, and comparisons. Other operators, such as \"*\", \"/\", \"%\", the bitwise operators, shifts and negation, have no meaning on an address. Convert the pointer to \"လက္ခဏာမဲ့ ကိန်းပြည့်\" to compute with the address as a number."""

[codes.ZK0416.title]
en = "pointer kinds differ"
[codes.ZK0416.message]
en = "pointers to different kinds, %{a} and %{b}, cannot be compared or subtracted"
[codes.ZK0416.explain]
en = """Two pointers can be compared or subtracted when the kinds the two point at are the same. \"==\" and \"!=\" also accept \"မည်သည်ကိုမှ မညွှန်းသော လိပ်စာ\" or the opaque \"လိပ်စာ\" on one side. Convert one pointer to the kind of the other first."""

[codes.ZK0417.title]
en = "heap statement needs a pointer"
[codes.ZK0417.message]
en = "the heap statement needs a pointer, found %{kind}"
[codes.ZK0417.explain]
en = """The heap statements allocate space, resize it, free it, duplicate its cells and fill them, through an address. That address must have a pointer kind, written \"<kind> လိပ်စာ\", or the opaque \"လိပ်စာ\". Allocate, resize and free write the address back, so theirs is a variable; declare it with a pointer kind."""

[codes.ZK0419.title]
en = "list count mismatch"
[codes.ZK0419.message]
en = "the kind holds %{want} cells, but the list has %{found}"
[codes.ZK0419.explain]
en = """A list literal \"a၊ b၊ c တို့ပါသော စာရင်း\" must have the same number of cells as the list kind it fills. Add or remove cells, or change the count in \"အကွက် <n> ခုရှိသော\". A kind written with no count, such as \"ကိန်းပြည့် စာရင်း\", takes its count from the literal."""

[codes.ZK0420.title]
en = "blank list with no kind"
[codes.ZK0420.message]
en = "a blank list needs a list kind from its place"
[codes.ZK0420.help]
en = "declare the variable with a list kind first, or write the cells out"
[codes.ZK0420.explain]
en = """\"စာရင်းအလွတ်\" and [] are a list with no cells, or a counted list with each cell at its default, but the list kind comes from the place around it: a declared variable, a parameter, or the other side of a comparison. Here nothing gives that kind."""

[codes.ZK0422.title]
en = "not a list"
[codes.ZK0422.message]
en = "%{k} is not a list, so it has no cells"
[codes.ZK0422.explain]
en = """\"x ၏ အကွက် i\", \"x ၏ n ခုမြောက်အကွက်\" and \"x ၏ အကွက်အရေအတွက်\" need a list, or the address of a list. To reach the values behind a pointer to the first of several values, use pointer arithmetic: \"p + i ၏ တန်ဖိုး\"."""

[codes.ZK0423.title]
en = "cell number not an integer"
[codes.ZK0423.message]
en = "a cell number must be an integer, not %{k}"
[codes.ZK0423.explain]
en = """The number in \"x ၏ အကွက် i\" or \"x ၏ n ခုမြောက်အကွက်\" counts cells, so it must be an integer of a signed or unsigned kind. Convert it with \"ကို <kind> တစ်ခု အဖြစ် ပြောင်းလဲသော ရလဒ်\"."""

[codes.ZK0425.title]
en = "list too large"
[codes.ZK0425.message]
en = "%{k} needs more octets than the machine can address"
[codes.ZK0425.explain]
en = """The cells of a list sit next to each other, so the list takes its count times the size of one cell. Here that size does not fit the machine. Use a smaller count, or ask for heap room."""

[codes.ZK0426.title]
en = "field of a value that is no struct"
[codes.ZK0426.message]
en = "\"%{n}\" is read as a field, but the value before \"၏\" is %{k}, not a struct"
[codes.ZK0426.explain]
en = """After \"၏\", a name reads a field, and fields belong to structs. To read a field of a struct a pointer points at, dereference the pointer first: \"p ၏ တန်ဖိုး ၏ <field>\"."""

[codes.ZK0427.title]
en = "struct holds itself"
[codes.ZK0427.message]
en = "\"%{n}\" holds itself, so it would have no end"
[codes.ZK0427.help]
en = "hold the address of the struct instead: \"%{n} လိပ်စာ\""
[codes.ZK0427.explain]
en = """A field of a struct sits inside the struct, so a struct that holds itself, at once or through other structs, would need to be larger than itself. Hold an address of it instead, as a linked list does with \"နောက်\" fields of kind \"<name> လိပ်စာ\"."""

[codes.ZK0429.title]
en = "write to a cell of text"
[codes.ZK0429.message]
en = "the cells of %{k} cannot be written"
[codes.ZK0429.explain]
en = """Text holds UTF-8, and one u8 written on its own can break a character in two. A text written in quotes also shares its storage with each other literal of the same text. Build new text instead: join pieces with \"+\", or write the value in a template slot of a literal, as in \"{က}\"."""

[codes.ZK0430.title]
en = "kind not known"
[codes.ZK0430.message]
en = "the value gives no kind for \"%{n}\""
[codes.ZK0430.help]
en = "write the kind: \"<kind> တစ်<classifier> ဖြစ်၍ တန်ဖိုးသည် <value>\""
[codes.ZK0430.explain]
en = """A declaration with no kind takes the kind of its value. \"မည်သည်ကိုမှ မညွှန်းသော လိပ်စာ\" fits each pointer kind and names none of them, so a declaration of \"မည်သည်ကိုမှ မညွှန်းသော လိပ်စာ\" must write its kind."""

[codes.ZK0433.title]
en = "changed place in two arguments"
[codes.ZK0433.message]
en = "\"%{n}\" is changed through another argument of this call, so it cannot appear here"
[codes.ZK0433.explain]
en = """A place a call changes through a marked argument appears nowhere else in the same call, as a whole or as a field or a cell. Otherwise the function would read the place through one parameter while it changes it through another. Read the value into a variable of its own before the call."""
[codes.ZK0434.title]
en = "each loop over a value it cannot walk"
[codes.ZK0434.message]
en = "this each loop cannot walk %{got}"
[codes.ZK0434.explain]
en = """An each-cell loop (\"အကွက်တိုင်း\") walks a list, a range of one, or the list a pointer points at: the loop variable holds a duplicate of each cell. An each-character loop (\"စာလုံးတိုင်း\") walks text or a range of text. To walk the cells of text as u8 numbers, use a counted loop over its cell count."""
[codes.ZK0436.title]
en = "a blank list given to a counted list"
[codes.ZK0436.message]
en = "a list with no cells does not fit the counted list %{k}"
[codes.ZK0436.help]
en = "write \"ကနဦးတန်ဖိုး\" for each cell at its initial value, or make the list a plain list, with no count"
[codes.ZK0436.explain]
en = """A counted list keeps its count, so `[]` and `စာရင်းအလွတ်`, the lists with no cells, do not fit it. Write `ကနဦးတန်ဖိုး` to set each cell to its initial value, a literal with each cell, or make the list a plain list, which a list with no cells fits."""

[codes.ZK0437.title]
en = "a value that cannot grow or shrink"
[codes.ZK0437.message]
en = "%{k} cannot grow or shrink here: \"ထည့်မည်\" takes a plain list or text, \"နောက်ဆုံးအကွက်ကို ဖျက်မည်\" a plain list, and \"နောက်ဆုံးစာလုံးကို ဖျက်မည်\" text"
[codes.ZK0437.explain]
en = """A counted list keeps the count its kind gives. Text has no cells: it loses its last character through \"နောက်ဆုံးစာလုံး\". Declare the list with no count, as a plain list (isize[]), to add cells to it and remove them."""

[codes.ZK0439.title]
en = "nothing to put the value in front of"
[codes.ZK0439.message]
en = "\"အရှေ့တွင်\" follows a cell of a list or a character of text"
[codes.ZK0439.help]
en = "name the cell or the character the value goes in front of: \"<list> ၏ အကွက် n ၏ အရှေ့တွင်\" or \"<text> ၏ စာလုံး n ၏ အရှေ့တွင်\"; \"<list> ထဲသို့\" adds at the end"
[codes.ZK0439.explain]
en = """An add puts its value in front of one cell of a plain list, or one character of text, and the cells or characters from there on move one place on. The number can also be the count, which puts the value at the end. Name the place with a cell form, \"အကွက် n\" or \"n ခုမြောက်အကွက်\", or a character form, \"စာလုံး n\" or \"n ခုမြောက်စာလုံး\"."""

[codes.ZK0440.title]
en = "start block parameter that is no text list"
[codes.ZK0440.message]
en = "a parameter of the start block is a \"စာသား စာရင်း\", and there are two of them at most"
[codes.ZK0440.help]
en = "write \"စာသား စာရင်း <name>\": the first one gets the name of the program and its arguments, the second the environment"
[codes.ZK0440.explain]
en = """The start block takes no parameter, one or two. The first holds the name of the program and then the arguments it was run with, one text for each, as in C; the second holds the environment variables, one \"NAME=VALUE\" text for each. Both are plain text lists, \"စာသား စာရင်း\", and neither is a place the start block can change for a caller."""

[codes.ZK0441.title]
en = "start block result that is no integer"
[codes.ZK0441.message]
en = "the result of the start block is \"%{k}\", but it must be an integer"
[codes.ZK0441.help]
en = "write \"ကိန်းပြည့် တစ်ခု\": the result becomes the exit code of the run"
[codes.ZK0441.explain]
en = """The result of the start block is the exit code of the run: 0 tells the shell that all went well, and another number tells it that something failed. The host keeps the lowest 8 bits of it. A start block with no result ends the run with 0."""

[codes.ZK0442.title]
en = "raw duplicate or fill of counted cells"
[codes.ZK0442.message]
en = "the cells are \"%{kind}\", which hold counted blocks: a raw duplicate or fill would not keep their counts"
[codes.ZK0442.help]
en = "assign the cells one at a time, which keeps each count"
[codes.ZK0442.explain]
en = """\"ကူးယူမည်\" and \"ပြောင်းထည့်မည်\" duplicate cells, and \"ဖြည့်မည်\" fills them, as raw octets. A cell that holds text, a plain list, an object or a function value holds a counted block, and a raw duplicate of it would make a second holder the count does not know, so the block could be freed while still in use. Pointer cells are plain addresses and can be duplicated as raw octets, as in C."""

[codes.ZK0443.title]
en = "call that can fail, with no pass-on"
[codes.ZK0443.message]
en = "\"%{f}\" can fail, but the call does not pass the failure on"
[codes.ZK0443.help]
en = "read the value with \"... လုပ်ဆောင်သော ရလဒ်ကောင်း\" or \"%{f}(...)?\", or end a call statement with \"၊ မအောင်မြင်ပါက အမှားအယွင်းကို ပြန်ပေးမည်\""
[codes.ZK0443.explain]
en = """A function whose result clause is a result kind, such as \"ကိန်းပြည့် သို့မဟုတ် အမှားအယွင်းအနေဖြင့် စာသား ရှိနိုင်သော ဒေတာဆဲလ် တစ်ခု ကို ပြန်ပေးမည်\", can fail: it gives back a good result or an error value. A call to it must tell what happens on a failure. For now the one answer is to pass the failure on: the call reads the good result with \"ရလဒ်ကောင်း\" or \"?\", and when the function fails, the function around the call stops and gives back the same error value. A call statement passes it on with \"၊ မအောင်မြင်ပါက အမှားအယွင်းကို ပြန်ပေးမည်\" before its full stop. A failure is never dropped without a word."""

[codes.ZK0444.title]
en = "pass-on for a function that cannot fail"
[codes.ZK0444.message]
en = "the call passes a failure on, but \"%{f}\" cannot fail"
[codes.ZK0444.help]
en = "write \"လုပ်ဆောင်သော ရလဒ်\" or \"%{f}(...)\" with no \"?\", and drop the \"မအောင်မြင်ပါက\" part of a call statement"
[codes.ZK0444.explain]
en = """\"ရလဒ်ကောင်း\", \"?\" and \"မအောင်မြင်ပါက အမှားအယွင်းကို ပြန်ပေးမည်\" pass a failure of the call on. A function whose result clause is no result kind cannot fail, so there is nothing to pass on: read its result with \"လုပ်ဆောင်သော ရလဒ်\" or a plain sign-form call."""

[codes.ZK0445.title]
en = "pass-on in a function that cannot fail"
[codes.ZK0445.message]
en = "the call passes a failure on, but the code around it cannot fail"
[codes.ZK0445.help]
en = "give the function around the call a result kind, such as \"<kind> သို့မဟုတ် အမှားအယွင်းအနေဖြင့် <kind> ရှိနိုင်သော ဒေတာဆဲလ် တစ်ခု ကို ပြန်ပေးမည်\""
[codes.ZK0445.explain]
en = """Passing a failure on stops the function around the call and gives back the error value, so that function must be able to fail itself: its result clause is a result kind. The top-level statements of a file and the start block cannot fail: the start block gives back an exit code, never a result. Move the call into a function that can fail, or read the result there with \"သည် ရလဒ်ကောင်း\" and the conversions."""

[codes.ZK0446.title]
en = "pass-on with another error kind"
[codes.ZK0446.message]
en = "the called function fails with \"%{found}\", but the function around the call fails with \"%{want}\""
[codes.ZK0446.help]
en = "give both functions the same error kind"
[codes.ZK0446.explain]
en = """Passing a failure on gives back the error value of the called function as it is, so it must have the error kind of the function around the call. Both result clauses must name the same kind after \"အမှားအယွင်းအနေဖြင့်\". Zaka does not convert one error kind into another."""

[codes.ZK0447.title]
en = "error value from a function that cannot fail"
[codes.ZK0447.message]
en = "\"%{f}\" cannot fail, so it has no error value to give back"
[codes.ZK0447.help]
en = "make the result clause a result kind, such as \"<kind> သို့မဟုတ် အမှားအယွင်းအနေဖြင့် <kind> ရှိနိုင်သော ဒေတာဆဲလ် တစ်ခု ကို ပြန်ပေးမည်\""
[codes.ZK0447.explain]
en = """\"... ဟူသော အမှားအယွင်း ကို ပြန်ပေးမည်\" ends the function with a failure and gives back the error value. The result clause of the function names the kind of that value after \"အမှားအယွင်းအနေဖြင့်\"; a function without that part cannot fail."""

[codes.ZK0448.title]
en = "test or read of a value that is no result"
[codes.ZK0448.message]
en = "the value is \"%{k}\", not the result of a function that can fail"
[codes.ZK0448.help]
en = "\"ထဲတွင် ရလဒ်ကောင်း ရှိ\", \"ထဲတွင် အမှားအယွင်း ရှိ\" and the reads \"ထဲမှ ဒေတာ\" and \"ထဲမှ အမှားအယွင်း ဒေတာ\" take a result, such as the one of a call \"... လုပ်ဆောင်သော ရလဒ်\", or an optional"
[codes.ZK0448.explain]
en = """A call to a function that can fail, written without \"ရလဒ်ကောင်း\" or \"?\", gives back the whole result: a good result or an error value. \"<r> ထဲတွင် ရလဒ်ကောင်း ရှိ\" and \"<r> ထဲတွင် အမှားအယွင်း ရှိ\" test which one it holds, and \"<r> ထဲမှ ဒေတာ\" and \"<r> ထဲမှ အမှားအယွင်း ဒေတာ\" read it out. A value of another kind has no such parts."""

[codes.ZK0449.title]
en = "good result of a function with no result"
[codes.ZK0449.message]
en = "the function gives back no good value, so the result has none to read"
[codes.ZK0449.help]
en = "test the result with \"ထဲတွင် ရလဒ်ကောင်း ရှိ\", or read its error value with \"ထဲမှ အမှားအယွင်း ဒေတာ\""
[codes.ZK0449.explain]
en = """A function whose result clause is \"အောင်မြင်သည့်သတင်း သို့မဟုတ် အမှားအယွင်းအနေဖြင့် <kind> ရှိနိုင်သော ဒေတာဆဲလ် တစ်ခု ကို ပြန်ပေးမည်\" gives back nothing when it does not fail: its result holds an error value or nothing. The read \"ထဲမှ ဒေတာ\" has no value to read; test the result instead."""

[codes.ZK0450.title]
en = "error value of a result whose failure holds none"
[codes.ZK0450.message]
en = "the error side of the result is \"မအောင်မြင်သည့်သတင်း\": it holds no value to read"
[codes.ZK0450.help]
en = "test the result with \"ထဲတွင် အမှားအယွင်း ရှိ\" instead"
[codes.ZK0450.explain]
en = """A result kind whose error side is \"မအောင်မြင်သည့်သတင်း\" fails with no error value, so the read \"ထဲမှ အမှားအယွင်း ဒေတာ\" has nothing to read. Test the result instead."""

[codes.ZK0451.title]
en = "failure with no value where one is needed"
[codes.ZK0451.message]
en = "the function fails with an error value of the kind \"%{k}\", so a failure must give one back"
[codes.ZK0451.help]
en = "write \"<value> ဟူသော အမှားအယွင်း ကို ပြန်ပေးမည်\""
[codes.ZK0451.explain]
en = """\"လုပ်ဆောင်ချက် မအောင်မြင်ပါဟု သတ်မှတ်မည်\" ends a function with a failure that holds no value. That fits a result kind whose error side is \"မအောင်မြင်သည့်သတင်း\". When the error side names a kind, the failure must give back an error value of that kind."""

[codes.ZK0454.title]
en = "read of the part a result or an optional does not hold"
[codes.ZK0454.message_good]
en = "\"%{n}\" holds a good result here, so reading its error value stops the run each time"
[codes.ZK0454.message_fault]
en = "\"%{n}\" holds a failure here, so reading its good result stops the run each time"
[codes.ZK0454.message_no_data]
en = "\"%{n}\" holds no data here, so reading its data stops the run each time"
[codes.ZK0454.help]
en = "read the other part, or test it first with \"ထဲတွင် ရလဒ်ကောင်း ရှိ\", \"ထဲတွင် အမှားအယွင်း ရှိ\" or, for an optional, \"ထဲတွင် ဒေတာ ရှိ\""
[codes.ZK0454.explain]
en = """A test such as \"အကယ်၍ R ထဲတွင် ရလဒ်ကောင်း ရှိလျှင်\" proves which part a result variable holds inside its arm, and the opposite in the arms after it; an arm that leaves the function or the loop proves the opposite after the whole statement as well. While nothing changes the variable, a read of the part the test ruled out, `ထဲမှ ဒေတာ` or `ထဲမှ အမှားအယွင်း ဒေတာ`, would stop the run each time it ran, so the check reports it. A statement that can change the variable, such as an assignment, a call that takes the variable through a parameter marked \"ဒေတာ ပြောင်းလဲရန်\", or the address of the variable, ends what the test proved."""

[codes.ZK0456.title]
en = "member value"
[codes.ZK0456.message]
en = "the value of the member \"%{n}\" must work out when the program compiles"
[codes.ZK0456.explain]
en = """A member value in parentheses, as in \"မတွေ့ (၁)\" or \"သွား (\"go\")\", is a constant: a literal, a constant, or an operation on constants that the compiler works out. A template slot in text must work out too. The value of the first member gives the kind of each member value."""

[codes.ZK0457.title]
en = "duplicate member value"
[codes.ZK0457.message]
en = "the member \"%{n}\" has the value of \"%{f}\""
[codes.ZK0457.explain]
en = """Each member of an enumeration stands for a value of its own, so a switch or a print can tell the members apart. Give one of the two members another value. A member with no value takes the value of the member before it plus one."""

[codes.ZK0458.title]
en = "switch misses members"
[codes.ZK0458.message]
en = "no arm of this switch names %{m}"
[codes.ZK0458.help]
en = "name each member in an arm, or add \"တခြား %{k} တစ်%{w} ဖြစ်လျှင်\" last"
[codes.ZK0458.explain]
en = """A switch over an enumeration runs one arm for each member: either an arm names each member, or the default arm \"တခြား <name> တစ်<classifier> ဖြစ်လျှင်\" comes last and runs for the members the arms do not name. A member added to the enumeration later is then caught where a switch forgets it."""

[codes.ZK0459.title]
en = "default arm kind"
[codes.ZK0459.message]
en = "the default arm names \"%{w}\", but the subject of the switch is \"%{s}\""
[codes.ZK0459.explain]
en = """The default arm \"တခြား <kind> တစ်<classifier> ဖြစ်လျှင်\" names the kind of the subject of its switch, as in \"တခြား အရောင် တစ်ခု ဖြစ်လျှင်\" over a color. Write the kind of the subject there; for an enumeration whose name ends in \"များ\", write the name without \"များ\"."""

[codes.ZK0460.title]
en = "duplicate case"
[codes.ZK0460.message]
en = "an arm before this one has this case"
[codes.ZK0460.explain]
en = """A switch runs the first arm whose case equals the subject, so a second arm with an equal case could never run. Remove the arm, or change its case."""

[codes.ZK0461.title]
en = "member needs a value"
[codes.ZK0461.message]
en = "the member \"%{n}\" needs a value: no %{k} value follows the member before it"
[codes.ZK0461.explain]
en = """A member with no value takes the value of the member before it plus one, and the first takes 0, when the kind of the members is an integer. For another kind, such as text or a character, write a value for each member. An integer member can also pass the largest value of its kind; write its value then."""

[codes.ZK0462.title]
en = "not a function value"
[codes.ZK0462.message]
en = "\"%{n}\" is %{k}, not a function value, so it cannot be called"
[codes.ZK0462.leave]
en = "this value is %{k}, not a function value, so C cannot get leave to call it"
[codes.ZK0462.explain]
en = """A call runs a declared function, or the function a value of a function kind holds: a variable, a parameter, a field or a cell of such a kind. This name or place holds a value of another kind. A leave for C, \"<function value> ကို ပြင်ပမှ ခေါ်ဆိုခွင့် ပြုမည်\", also takes a function value, so a value of another kind there is this error too."""

[codes.ZK0463.title]
en = "unclear function value"
[codes.ZK0463.message]
en = "no single function \"%{n}\" fits here"
[codes.ZK0463.help]
en = "write the function kind the value goes to, such as the kind of the variable that takes it"
[codes.ZK0463.explain]
en = """A file can declare several functions of one name. The value of such a name, \"<name> ဟူသော လုပ်ဆောင်ချက်\", takes the one whose kind the place of the value names: a variable with a written kind, a parameter, a field or a cell. Here no kind is written, or no function of the name fits it, or two of them fit it, as two functions that differ in their marks alone fit a kind with no marks."""

[codes.ZK0464.title]
en = "value of an external function"
[codes.ZK0464.message]
en = "\"%{n}\" comes from outside the program, so it is no function value"
[codes.ZK0464.help]
en = "declare a function of the program that calls it, and take that one as the value"
[codes.ZK0464.explain]
en = """A function that comes from outside, \"ပြင်ပမှလာသော\", runs in the VM itself and has no place among the functions of the program, so no function value can hold it. A function of the program that calls it can stand in for it."""

[codes.ZK0465.title]
en = "kind that C cannot take"
[codes.ZK0465.message]
en = "a C function cannot take or give back a value of the kind \"%{k}\""
[codes.ZK0465.help]
en = "use an integer of up to 64 bits, f32, f64, a boolean, an address, a struct of these, or, as a parameter, text, a list of numbers or a function value of these"
[codes.ZK0465.help_text]
en = "C can give back NULL: write the result as an optional, \"<kind> ရှိကောင်းရှိနိုင်သော ဒေတာဆဲလ်\""
[codes.ZK0465.explain]
en = """A C function takes its parameters and gives its result as whole values, laid out as in C. Integers of up to 64 bits, f32, f64, booleans and addresses cross, and so do structs whose fields are such kinds, structs or counted lists of them. Text crosses as a parameter: C gets a duplicate of it that ends in a zero octet. A list of numbers crosses as a parameter: C gets the address of its first cell. Text and a handle cross back as an optional, `စာသား ရှိကောင်းရှိနိုင်သော ဒေတာဆဲလ်`: NULL is the optional with no data, and Zaka copies the other strings into text of its own, so C keeps what it gave. A function value crosses as a callback, the address C calls, when its result is an integer, a float, a boolean or an address, and each parameter is one of those, a plain struct, text or an optional of text, or a handle or an optional of one, with no \"ဒေတာ ပြောင်းလဲရန်\". Lists of other cells have no C form; bare text cannot be a result, since C can give back NULL; and a result that can fail has no C form either. An other value, past the parameters of a C function that takes them, takes the parameter kinds, structs among them."""

[codes.ZK0466.title]
en = "a C parameter to change"
[codes.ZK0466.message]
en = "the C function cannot change the parameter \"%{n}\" in place"
[codes.ZK0466.help]
en = "drop \"ဒေတာ ပြောင်းလဲရန်\", or pass a list of numbers or a struct, which C writes in place"
[codes.ZK0466.explain]
en = """A C function takes each parameter as a whole value, so it cannot change the caller's place through \"ဒေတာ ပြောင်းလဲရန်\". A list of numbers and a struct of values that cross are the exceptions: C takes the address of the first cell, or of the struct, and writes it in place. To let C write another value back, pass its address from marked code."""

[codes.ZK0467.title]
en = "own result of no C text"
[codes.ZK0467.message]
en = "\"%{n}\" gives back no text from C, so \"အပိုင်အနေဖြင့်\" cannot stand on its result"
[codes.ZK0467.help]
en = "write \"အပိုင်အနေဖြင့်\" on a C function whose result is \"စာသား ရှိကောင်းရှိနိုင်သော ဒေတာဆဲလ်\", or leave it out"
[codes.ZK0467.explain]
en = """\"အပိုင်အနေဖြင့် ပြန်ပေးမည်\" tells that a C function hands its string over, as strdup does: the program takes the octets into text of its own and then frees the string with the free of libc. It stands on a C function whose result is text or a failure alone. Without it, C keeps the string, as getenv and strstr want; a Zaka function and each other result kind have nothing to hand over."""

[codes.ZK0468.title]
en = "pointer work outside marked code"
[codes.ZK0468.message]
en = "%{w} needs marked code"
[codes.ZK0468.help]
en = "put it in a block \"အောက်ပါတို့ကို စိတ်မချရသော်လည်း လုပ်ဆောင်မည်။\", or in a function marked \"စိတ်မချရသော\""
[codes.ZK0468.explain]
en = """Safe Zaka never reads or writes through a pointer, so a mistake there cannot reach mem. Reading or writing through a pointer, pointer arithmetic, taking an address, a heap statement, a conversion to or from a pointer, and a call of a function marked \"စိတ်မချရသော\" each need marked code: a function marked \"စိတ်မချရသော\", or a block that opens with \"အောက်ပါတို့ကို စိတ်မချရသော်လည်း လုပ်ဆောင်မည်။\". A pointer value itself can pass through safe code: held, copied, or compared with \"မည်သည်ကိုမှ မညွှန်းသော လိပ်စာ\"."""

[codes.ZK0469.title]
en = "marked function as a value"
[codes.ZK0469.message]
en = "\"%{n}\" is marked \"စိတ်မချရသော\", so it cannot be a function value"
[codes.ZK0469.help]
en = "take a function that calls it inside a marked block"
[codes.ZK0469.explain]
en = """A call through a function value is a plain call, which safe code can make. A function marked \"စိတ်မချရသော\" needs marked code at each call, so it cannot hide behind a value. Write a function with no mark that calls it inside a block marked \"စိတ်မချရသော်လည်း\", and take that function as the value."""

[codes.ZK0470.title]
en = "owned mark on no pointer"
[codes.ZK0470.message]
en = "\"အပိုင်အနေဖြင့်\" hands over a block, and \"%{k}\" holds no pointer to one"
[codes.ZK0470.explain]
en = """\"အပိုင်အနေဖြင့်\" states that a parameter takes over the block its pointer holds, or that a result gives a block to the caller. Other values are copied or shared, so those hand nothing over: leave the mark out."""

[codes.ZK0471.title]
en = "marked code refused"
[codes.ZK0471.message]
en = "this program keeps to safe Zaka, so it cannot mark code \"စိတ်မချရသော\""
[codes.ZK0471.explain]
en = """The \"--no-unsafe\" option refuses each function and each block marked \"စိတ်မချရသော\", so a lesson or a project keeps to safe Zaka, where no mistake can reach mem. Leave the option out to work with pointers."""

[codes.ZK0473.title]
en = "a value from outside"
[codes.ZK0473.message]
en = "\"%{k}\" comes from outside the program, so Zaka cannot %{w} a value of it"
[codes.ZK0473.make]
en = "make"
[codes.ZK0473.duplicate]
en = "duplicate"
[codes.ZK0473.print]
en = "print"
[codes.ZK0473.help]
en = "a C function gives a value of it; hold it, pass it on, compare it, or read its fields"
[codes.ZK0473.explain]
en = """A value of a kind from outside, `ပြင်ပမှ လာသော ဒေတာအစုအဝေး`, is a handle to a struct C keeps. Zaka holds it, passes it to C, compares it and reads the fields the declaration names, but cannot make one, duplicate the struct behind it, or print it: the duplicates share the one handle, so a C function that takes it over closes it for each of them."""

[codes.ZK0474.title]
en = "a field C owns"
[codes.ZK0474.message]
en = "a field of \"%{k}\" belongs to the struct C keeps, so Zaka reads it but cannot write it"
[codes.ZK0474.help]
en = "write a number, a boolean or a counted list in marked code, or call a C function that changes the struct"
[codes.ZK0474.explain]
en = """The fields a kind from outside names are read from the struct C keeps, each time the program reads one. C owns that struct, so safe code changes it through a C function. Marked code can write a field of a number, a boolean or a counted list in place; a text or a handle field is a pointer C owns, which no program writes."""

[codes.ZK0475.title]
en = "a test that does not fit"
[codes.ZK0475.message]
en = "a value of \"%{k}\" is tested in a form that does not fit its kind"
[codes.ZK0475.optional]
en = "\"%{k}\" is an optional: test it with \"ထဲတွင် ဒေတာ ရှိ\" or \"ထဲတွင် ဒေတာ မရှိ\""
[codes.ZK0475.result]
en = "\"%{k}\" is no optional: test a result with \"ထဲတွင် ရလဒ်ကောင်း ရှိ\" or \"ထဲတွင် အမှားအယွင်း ရှိ\""
[codes.ZK0475.explain]
en = """An optional holds data or none, so a test asks whether it holds data: `ထဲတွင် ဒေတာ ရှိ`, `ထဲတွင် ဒေတာ မရှိ`. A result holds a good value or an error value, so a test asks which: `ထဲတွင် ရလဒ်ကောင်း ရှိ`, `ထဲတွင် အမှားအယွင်း ရှိ`. The test of the other kind does not fit."""

[codes.ZK0476.title]
en = "an error value with no result"
[codes.ZK0476.message]
en = "an error value goes where a result kind with an error side is wanted"
[codes.ZK0476.help]
en = "give the variable, the parameter or the function a result kind, \"T သို့မဟုတ် အမှားအယွင်းအနေဖြင့် E ရှိနိုင်သော ဒေတာဆဲလ်\""
[codes.ZK0476.explain]
en = """`<value> ဟူသော အမှားအယွင်း` makes the error side of a result, so the place it goes into must name a result kind with an error side: a variable, a parameter, a field, or the result of the function it is given back from."""

[codes.ZK0477.title]
en = "no data where no optional is wanted"
[codes.ZK0477.message]
en = "\"အလွတ်\" goes where an optional kind is wanted"
[codes.ZK0477.help]
en = "give the variable, the parameter or the function an optional kind, \"T ရှိကောင်းရှိနိုင်သော ဒေတာဆဲလ်\""
[codes.ZK0477.explain]
en = """`အလွတ်` is the optional that holds no data, so the place it goes into must name an optional kind: a variable, a parameter, a field, or the result of the function it is given back from. A pointer that points at nothing is `မည်သည်ကိုမှ မညွှန်းသော လိပ်စာ`."""

[codes.ZK0478.title]
en = "an initial value of no known kind"
[codes.ZK0478.message]
en = "\"ကနဦးတန်ဖိုး\" stands where no kind can be worked out"
[codes.ZK0478.help]
en = "put it where a kind is known: a declaration that writes its kind, an assignment, a field, a cell, a return or an argument"
[codes.ZK0478.explain]
en = """`ကနဦးတန်ဖိုး` is the initial value of a kind, and the kind comes from its place: a declaration with a kind, an assignment, a field, a cell, a return or an argument. A print or an operation gives no kind, so there is no value to make."""

[codes.ZK0479.title]
en = "a kind with no initial value"
[codes.ZK0479.message]
en = "\"%{k}\" has no initial value: %{r}"
[codes.ZK0479.function]
en = "a function value has none"
[codes.ZK0479.handle]
en = "a handle comes from C alone"
[codes.ZK0479.member]
en = "no member of \"%{e}\" is marked \"ကနဦးတန်ဖိုးအနေဖြင့် သုံးမည့်\""
[codes.ZK0479.result]
en = "a result must hold its good value or its failure"
[codes.ZK0479.part]
en = "\"%{p}\" inside it has none"
[codes.ZK0479.help]
en = "write the value in full"
[codes.ZK0479.explain]
en = """A kind has an initial value when each of its parts has one: `၀` for a number, `""` for text, no cells for a plain list, the blank optional, a pointer that points at nothing, and each field or cell at its own. A function value, a handle from C and a result have none, nor has an enumeration whose declaration marks no member with `ကနဦးတန်ဖိုး`; a struct or a list that holds one of them has none either."""

[codes.ZK0480.title]
en = "two initial members"
[codes.ZK0480.message]
en = "\"%{e}\" marks a second member with \"ကနဦးတန်ဖိုးအနေဖြင့် သုံးမည့်\""
[codes.ZK0480.help]
en = "mark one member alone; \"%{m}\" carries the mark"
[codes.ZK0480.explain]
en = """`ကနဦးတန်ဖိုးအနေဖြင့် သုံးမည့်` in front of a member makes it the initial value of the enumeration. An enumeration has one initial value, so the mark goes on one member alone."""

[codes.ZK0481.title]
en = "a kind no program can build"
[codes.ZK0481.message]
en = "no value of \"%{k}\" can be built: %{c}"
[codes.ZK0481.help]
en = "make one field of the loop optional, so a value can end the chain"
[codes.ZK0481.explain]
en = """Each value of a kind needs a value for each of its fields. When the fields of a kind lead back to the kind itself, through other kinds or at once, each value needs another before it, without end, so no program can build the first one. An optional field ends the chain with the blank optional, and so does a plain list with no cells."""

[codes.ZK0722.title]
en = "a read before a value is set"
[codes.ZK0722.message]
en = "\"%{n}\" can be unset here: a path reaches this read with no value given to it"
[codes.ZK0722.help]
en = "give it a value on each path before the read, or declare it with a value"
[codes.ZK0722.explain]
en = """A variable declared with no value holds none until the program sets it, and no kind gives it a hidden default. The check follows each path to each read: an `if` with no `else`, a loop that can run no rounds, or a path that sets one field or one cell and not another leaves the variable unset on that path. A struct counts as set once each of its fields is set, and a counted list once each of its cells is."""

[codes.ZK0723.title]
en = "a cell not proven set"
[codes.ZK0723.message]
en = "\"%{n}\" can have a cell with no value here; the check cannot tell which cells a write or a read reaches"
[codes.ZK0723.help]
en = "fill the list first, with \"ကနဦးတန်ဖိုး\" or a literal, or write its cells in a counted loop over each of them"
[codes.ZK0723.explain]
en = """The check follows each cell of a counted list it can name: a cell at a constant position, and the cells of a counted loop that runs over each cell of the list and writes the cell of its counter on each round. A cell at a position the program works out, or a loop of another form, leaves the check unable to prove the cell set. The program still runs; such a cell holds zero octets until it is set."""

[codes.ZK0724.title]
en = "a call before a global is set"
[codes.ZK0724.message]
en = "the call of \"%{f}\" reads \"%{g}\", which can be unset here"
[codes.ZK0724.help]
en = "give \"%{g}\" a value on each path before the call, or declare it with one"
[codes.ZK0724.explain]
en = """A global declared with no value holds none until the program sets it. A function reads it at whatever point a call runs, so the check looks at each call: the globals the function reads, itself or through the functions it calls, must be set on each path to the call. A call through a function value counts the globals of each function the program uses as a value. A global of a module, which has no start block, needs its value where it is declared."""

[codes.ZK0482.title]
en = "a field left out"
[codes.ZK0482.message]
en = "\"%{k}\" needs a value for %{f}"
[codes.ZK0482.help]
en = "give each field a value; \"ကနဦးတန်ဖိုး\" gives a field its initial value"
[codes.ZK0482.explain]
en = """A struct literal names each field of its struct, since no field takes a hidden default. Write `ကနဦးတန်ဖိုး` for a field that starts at its initial value: `၀` for a number, `""` for text, the blank optional."""

[codes.ZK0483.title]
en = "a module global with no value"
[codes.ZK0483.message]
en = "\"%{n}\" is a global of a module, so it needs its value where it is declared"
[codes.ZK0483.help]
en = "give it a value, such as \"ကနဦးတန်ဖိုး\""
[codes.ZK0483.explain]
en = """A global declared with no value holds none until the program sets it, and the check follows the start block to prove each global set before a function reads it. A module has no start block of its own, so nothing in it can set the global first: it takes its value where it is declared."""

[codes.ZK0725.title]
en = "a return before a parameter is filled"
[codes.ZK0725.message]
en = "\"%{n}\" is marked \"ဒေတာ ထည့်ပေးရန်\", so the function must set it on each path, but a path reaches this return without setting it"
[codes.ZK0725.help]
en = "set \"%{n}\" before each return, or mark it \"ဒေတာ ပြောင်းလဲရန်\" when the caller gives its value"
[codes.ZK0725.explain]
en = """A parameter marked `ဒေတာ ထည့်ပေးရန်` hands the function a place of the caller to fill: the caller need not set it, and counts it as set after the call. So the function must set the whole of it on each path before it returns, and cannot read it before it sets it (ZK0722). A parameter whose value the function reads first is `ဒေတာ ပြောင်းလဲရန်`, which the caller sets before the call."""

[codes.ZK0243.title]
en = "a filled parameter in a function kind"
[codes.ZK0243.message]
en = "a parameter of a function kind cannot be marked \"ဒေတာ ထည့်ပေးရန်\""
[codes.ZK0243.help]
en = "mark it \"ဒေတာ ပြောင်းလဲရန်\"; a function that fills the parameter still fits the kind"
[codes.ZK0243.explain]
en = """A call through a function value runs whichever function the value holds, so it cannot count on the place being filled: the caller sets it first. A function kind therefore takes `ဒေတာ ပြောင်းလဲရန်` alone, and a function whose parameter is `ဒေတာ ထည့်ပေးရန်` fits such a kind."""

[codes.ZK0244.title]
en = "nesting too deep"
[codes.ZK0244.message]
en = "this nests more than %{max} levels deep"
[codes.ZK0244.help]
en = "put an inner part in a variable or a function of its own"
[codes.ZK0244.explain]
en = """The compiler follows parentheses, operands, calls, lists, templates and blocks to a fixed depth, so that a program nested without end cannot use up the stack of the compiler or of the editor. Real programs keep far below it; an inner part with a name of its own is easier to read too."""

[codes.ZK0472.title]
en = "C function needs the mark"
[codes.ZK0472.message]
en = "\"%{n}\" %{w}, so its declaration needs the mark \"စိတ်မချရသော\""
[codes.ZK0472.help]
en = "write \"စိတ်မချရသော\" before \"လုပ်ဆောင်ချက်\", and call it from marked code"
[codes.ZK0472.pointer]
en = "passes a pointer"
[codes.ZK0472.explain]
en = """Safe code can call a C function whose parameters are numbers, true or false, text, lists of numbers, plain structs or function values, and whose result is nothing, a number, a plain struct, or an optional of text or of a handle, where NULL is the optional with no data. A C function that takes or gives a pointer can reach mem that Zaka does not check, so its declaration carries the mark \"စိတ်မချရသော\", and marked code alone can call it."""

# ---------------------------------------------------------- naturalness ZK05xx

[codes.ZK0501.title]
en = "negative verb before \"သို့မဟုတ်\" takes \"ပါ\""
[codes.ZK0501.message]
en = "\"%{v}သည်\" before \"သို့မဟုတ်\" reads better as \"%{v}ပါ\""
[codes.ZK0501.help]
en = "write \"%{v}ပါ သို့မဟုတ် ...\""
[codes.ZK0501.explain]
en = """A negative verb (\"မညီ\", \"မကြီး\", \"မငယ်\", \"မမှန်\", \"မဟုတ်\") that is followed with \"သို့မဟုတ်\" carries the particle \"ပါ\" in natural Burmese, not \"သည်\". The program still runs; this is a matter of idiom. The strict-particles flag turns it into an error."""

[codes.ZK0502.title]
en = "particle before an attached \"လျှင်\" or \"နေသရွေ့\""
[codes.ZK0502.message]
en = "\"%{v}%{p}\" before \"%{n}\" reads better without the particle"
[codes.ZK0502.help]
en = "write \"%{v}%{n}\", or keep the particle and write \"ဖြစ်%{n}\""
[codes.ZK0502.explain]
en = """The attached forms \"လျှင်\" and \"နေသရွေ့\" join straight onto the verb: \"မငယ်လျှင်\", \"ကြီးနေသရွေ့\". A sentence-final particle between them is unidiomatic. To keep the particle, use the \"ဖြစ်\" forms instead: \"မငယ်သည် ဖြစ်လျှင်\", \"ကြီးသည် ဖြစ်နေသရွေ့\"."""

[codes.ZK0503.title]
en = "\"မဟုတ်\" with \"သည်\""
[codes.ZK0503.message]
en = "\"မဟုတ်%{p}\" reads better as \"မဟုတ်ပါ\" or \"မဟုတ်\""
[codes.ZK0503.help]
en = "write \"မဟုတ်ပါ\" or \"မဟုတ်\""
[codes.ZK0503.explain]
en = """The postfix negation \"မဟုတ်\" takes \"ပါ\" or no particle at all. \"မဟုတ်သည်\" and \"မဟုတ်ပါသည်\" are grammatical but unidiomatic."""

[codes.ZK0504.title]
en = "\"ပါ\" before \"ဖြစ်၍\""
[codes.ZK0504.message]
en = "\"%{v}%{p}\" before \"ဖြစ်၍\" reads better as \"%{v}သည်\""
[codes.ZK0504.help]
en = "write \"%{v}သည် ဖြစ်၍ ...\""
[codes.ZK0504.explain]
en = """Before the conjunction \"ဖြစ်၍\" (logical and) a verb carries \"သည်\": \"အသက် သည် ၁၈ အောက် မငယ်သည် ဖြစ်၍ ...\". The \"ပါ\" forms belong before \"သို့မဟုတ်\" and at the end of a quoted sentence."""

[codes.ZK0505.title]
en = "sentence printed with \"ကို\""
[codes.ZK0505.message]
en = "a sentence or a string is quoted with \"ဟု\", not marked with \"ကို\""
[codes.ZK0505.help]
en = "write \"... ဟု ပြသမည်။\""
[codes.ZK0505.explain]
en = """\"ကို\" marks a thing: a name, a number, an arithmetic result. A whole sentence, such as a comparison that ends in \"သည်\" or \"ပါ\", and a string literal are quoted with \"ဟု\" instead: \"(အသက် သည် ၃၀ နှင့် မညီပါ) ဟု ပြသမည်။\", \"\\\"မင်္ဂလာပါ\\\" ဟု ပြသမည်။\". A bare clause with no particle keeps \"ကို\"."""

[codes.ZK0506.title]
en = "value printed with \"ဟု\""
[codes.ZK0506.message]
en = "a plain value is marked with \"ကို\", not quoted with \"ဟု\""
[codes.ZK0506.help]
en = "write \"... ကို ပြသမည်။\""
[codes.ZK0506.explain]
en = """\"ဟု\" quotes a sentence or a string. A name, a number, an arithmetic result or a bare clause with no sentence-final particle is a thing, and a thing is marked with \"ကို\": \"အသက် ကို ပြသမည်။\"."""

[codes.ZK0507.title]
en = "redundant parentheses"
[codes.ZK0507.message]
en = "these parentheses are not needed"
[codes.ZK0507.help]
en = "remove the parentheses"
[codes.ZK0507.explain]
en = """The parenthesized expression is the whole operand of its place: the printed value, the assigned value, the returned value, an initial value, a loop bound, a call argument, or a condition. Such an operand is read as far as it goes, so the parentheses change nothing. Parentheses are needed around a logical expression (\"ဖြစ်၍\", \"သို့မဟုတ်\", \"မဟုတ်\") in an operand place, and inside an operator chain or a clause with more operands; the check leaves those alone."""

[codes.ZK0508.title]
en = "\"ပါ\" on a clause used as a value"
[codes.ZK0508.message]
en = "\"%{v}%{p}\" as a value reads better as \"%{v}သည်\""
[codes.ZK0508.help]
en = "write \"... %{v}သည်\""
[codes.ZK0508.explain]
en = """A clause that gives a value, as an initial value, a returned value, a call argument or a loop bound, names a fact rather than stating a sentence, so its closing verb carries \"သည်\": \"အမှတ် သည် ၄၀ အောက် မငယ်သည် ဖြစ်ပါစေ။\". The \"ပါ\" forms belong to quoted sentences (\"... ဟု ပြသမည်\", \"... ဟု ထားမည်\") and before \"သို့မဟုတ်\"."""

[codes.ZK0509.title]
en = "count word with another classifier"
[codes.ZK0509.message]
en = "%{k} is counted with \"%{w}\", not \"%{f}\""
[codes.ZK0509.help]
en = "write \"%{w}စာ\""
[codes.ZK0509.help_literal]
en = "write \"%{k}တစ်%{w}\""
[codes.ZK0509.help_whole]
en = "write \"တစ်%{w}လုံး\""
[codes.ZK0509.help_decl]
en = "write \"တစ်%{w}\""
[codes.ZK0509.explain]
en = """Burmese counts things with a classifier that fits them: people with \"ယောက်\", most other things with \"ခု\". A struct or an enumeration names its classifier with \"... တို့ပါဝင်ပြီး မျိုးပြပစ္စည်းမှာ <word> ဖြစ်သည်။\", and an alias with \"... ဟုလည်း မှတ်ယူနိုင်ပြီး မျိုးပြပစ္စည်းမှာ <word> ဖြစ်သည်။\"; an alias with no word of its own counts with the word of its kind, \"စာလုံး\" counts with \"လုံး\", and each other kind with \"ခု\". The word follows \"တစ်\" after each kind written in a declaration, a parameter, a field, a result, a conversion, a size and a literal, and at the end of a struct literal; \"<word>စာ\" counts the cells of a heap block. The size and the value are the same whichever word is written, so the program still compiles."""

[codes.ZK0510.title]
en = "arguments closed with the wrong particle"
[codes.ZK0510.message]
en = "%{n} arguments close with \"တို့ကို\", not \"ကို\""
[codes.ZK0510.message_one]
en = "one argument closes with \"ကို\", not \"တို့ကို\""
[codes.ZK0510.help]
en = "write \"%{w}\" before \"သုံး၍\""
[codes.ZK0510.explain]
en = """A call that gives its arguments before its function closes them with \"ကို\" after one argument and with \"တို့ကို\" after two or more, as a Burmese sentence marks one object apart from several. The call is the same whichever word is written, so the program still compiles."""

# -------------------------------------------------------------- folding ZK06xx

[codes.ZK0601.title]
en = "constant overflow"
[codes.ZK0601.message]
en = "%{op} on these constants does not fit %{kind}"
[codes.ZK0601.explain]
en = """An operation whose operands are all constants is worked out when the program is compiled. Here the result is outside the range of its kind, so it cannot be stored. Use a wider kind, or change the values. Conversions with \"ကို <kind> အဖြစ် ပြောင်းလဲသော ရလဒ်\" are exempt: theirs wrap or saturate as written."""

[codes.ZK0602.title]
en = "constant zero divisor"
[codes.ZK0602.message]
en = "%{op} with the constant zero as divisor"
[codes.ZK0602.explain]
en = """The right operand of an integer division or remainder is the constant zero. Integer division and remainder with a zero divisor have no result. Check the divisor, or put the division behind a condition. Float division with a zero divisor is allowed and gives an infinite or NaN value."""

[codes.ZK0603.title]
en = "cell outside the list"
[codes.ZK0603.message]
en = "cell %{i} is outside the list, whose cells run from %{lo} to %{hi}"
[codes.ZK0603.explain]
en = """The cell number is a constant, and it does not name a cell of the list. \"x ၏ အကွက် i\" counts from 0, so the last cell of a list of n cells is n - 1. \"x ၏ n ခုမြောက်အကွက်\" counts from 1, up to n."""

[codes.ZK0604.title]
en = "imported value not known at compile time"
[codes.ZK0604.message]
en = "the starting value of \"%{n}\" must be known at compile time, since its file is imported"
[codes.ZK0604.help]
en = "literals, constants and operators on them are known; a function call is not, for now"
[codes.ZK0604.explain]
en = """The variables and constants of an imported file get their starting value before the program runs, so the value must come from literals, constants and operators on them. A function call cannot give that value for now. Give the variable no value and set it from the file that is run, or write the value out."""

[codes.ZK0605.title]
en = "range outside its list"
[codes.ZK0605.message]
en = "%{len} cells from cell %{s} pass the end of a list of %{n} cells"
[codes.ZK0605.explain]
en = """A range \"<list> ၏ အကွက် <start> မှစ၍ <length> ကွက်\" takes the cells from the start on. The start and the length here are known, so the compiler can tell that the last cell is past the end of the list. Shorten the length or move the start."""

[codes.ZK0606.title]
en = "constant not known at compile time"
[codes.ZK0606.message]
en = "a constant that holds text or a plain list must be known at compile time"
[codes.ZK0606.help]
en = "declare it with \"ကိန်းရှင်\" to build the value when the program runs"
[codes.ZK0606.explain]
en = """A \"ကိန်းသေ\" that holds text or a plain list, alone or inside a list or a struct, is static data, the same for each run: each read shares it, and nothing frees it. Its value must fold at compile time: literals, other constants, template slots that hold constants, joins of these with \"+\", and list literals of such values. A variable, a call, a cell or a field needs the program to run. Declare such a value with \"ကိန်းရှင်\"."""

[codes.ZK0607.title]
en = "range cuts a character"
[codes.ZK0607.message]
en = "%{len} u8s from u8 %{s} start or end inside a character of the text"
[codes.ZK0607.explain]
en = """Text holds whole characters of UTF-8, and a Burmese character takes three u8s. A range \"<text> ၏ အကွက် <start> မှစ၍ <length> ကွက်\" counts u8s, so its start and its end must each fall between two characters. The text, the start and the length here are known, so the compiler can tell that an edge falls inside a character. Move the edge; \"၏ စာလုံးအရေအတွက်\" and \"၏ စာလုံး\" count characters instead."""

[codes.ZK0701.title]
en = "use after a hand-over"
[codes.ZK0701.message]
en = "\"%{name}\" handed its block to a parameter marked \"အပိုင်အနေဖြင့်\" and now points at nothing"
[codes.ZK0701.explain]
en = """A parameter marked \"အပိုင်အနေဖြင့်\" takes over the block its argument points at, and the variable given is left holding `မည်သည်ကိုမှ မညွှန်းသော လိပ်စာ`. Reading it after the call would use a block the function took, and might have given back. Read what is needed before the call, or take a parameter without the mark when the caller is to keep the block."""

[codes.ZK0702.title]
en = "free of a variable's address"
[codes.ZK0702.message]
en = "this pointer holds the address of a variable, not of a heap block, so it cannot be freed or resized"
[codes.ZK0702.explain]
en = """A heap statement frees or resizes a block that \"မင်မိုရီတွင် ... နေရာယူ၍\" made. A pointer that holds the address of a variable, from \"x ၏ လိပ်စာ\", points at storage the VM gives back on its own, so it cannot be freed or resized. In marked code this is a warning unless a flag sets otherwise, and the VM stops the free when it runs."""

[codes.ZK0703.title]
en = "address stored where it can outlast its place"
[codes.ZK0703.message]
en = "an address that can point into a variable of this function cannot be stored in a heap block, through a pointer, or in a top-level variable"
[codes.ZK0703.explain]
en = """A variable of a function ends when the function returns, so its address must not outlast the call in a heap block, through a pointer, or in a top-level variable. Store the address of a heap block instead, or keep the address in a local."""

[codes.ZK0704.title]
en = "block freed while a pointer to it is still in use"
[codes.ZK0704.message]
en = "the block of \"%{name}\" is %{what} here, but \"%{other}\" still points into it and is used later"
[codes.ZK0704.label]
en = "\"%{other}\" is used here"
[codes.ZK0704.freed]
en = "freed"
[codes.ZK0704.resized]
en = "resized"
[codes.ZK0704.moved]
en = "moved"
[codes.ZK0704.edited]
en = "edited, so its cells can move,"
[codes.ZK0704.explain]
en = """While a pointer into a block is still in use later on, the block must not be freed, resized or moved, through that pointer or another one. The label points at the later use. Finish with the pointer before the block changes, or take the address again after the change."""

[codes.ZK0706.title]
en = "address of a local returned"
[codes.ZK0706.message]
en = "returns the address of the local \"%{name}\", which ends when the function returns"
[codes.ZK0706.explain]
en = """The locals and parameters of a function are released when it returns, so the address of one of them would point at released space in the caller. Return the value itself, or the address of a heap block."""

[codes.ZK0707.title]
en = "aliased arguments"
[codes.ZK0707.message]
en = "\"%{func}\" can free through argument %{n}, but argument %{m} reaches the same block"
[codes.ZK0707.explain]
en = """A function that frees through one argument must be the one route into that block during the call. When another argument reaches the same block, that argument would be left pointing at freed space. Give the function different blocks, or pass the block once."""

[codes.ZK0708.title]
en = "block not freed"
[codes.ZK0708.message]
en = "the block that \"%{name}\" holds is never given back or handed over on this path"
[codes.ZK0708.explain]
en = """A block made in marked code must be accounted for before the variable it was made in goes out of scope: given back with \"ပြန်လည်စွန့်လွှတ်မည်\", handed to a parameter marked \"အပိုင်အနေဖြင့်\", returned through a result marked \"အပိုင်အနေဖြင့်\", or stored in a heap block, a global or a field. Otherwise the block is leaked. A duplicate of its address into another variable counts as stored, since either can give it back. The finding is a warning; \"--mem-check error\" makes it an error."""
[codes.ZK0708.help_result]
en = "the caller takes this block: mark the result \"<kind> တစ်ခု ကို အပိုင်အနေဖြင့် ပြန်ပေးမည်\""

[codes.ZK0709.title]
en = "read through a null pointer"
[codes.ZK0709.message]
en = "\"%{name}\" points at nothing here, so there is nothing to read or write through it"
[codes.ZK0709.explain]
en = """At this point the pointer is `မည်သည်ကိုမှ မညွှန်းသော လိပ်စာ`: it points at no block. Give it a block first, or leave the read out of the path where it points at nothing. An object or a function value is never null; one read before it is set is ZK0722."""

[codes.ZK0710.title]
en = "offset past the end"
[codes.ZK0710.message]
en = "offset %{off} is past the end of a block of %{len} elements"
[codes.ZK0710.explain]
en = """The offset is a constant, and it lies past the cells of the block. Offsets count from 0, so the last cell of a block of n elements is n - 1. Use a smaller offset or a larger block."""

[codes.ZK0711.title]
en = "possible dereference of a null pointer"
[codes.ZK0711.message]
en = "\"%{name}\" can point at nothing here; compare it with \"မည်သည်ကိုမှ မညွှန်းသော လိပ်စာ\" first"
[codes.ZK0711.explain]
en = """The pointer is not compared with `မည်သည်ကိုမှ မညွှန်းသော လိပ်စာ` on this path, and the strict check wants one before a dereference. Compare it, and dereference it in the branch where it points at a block."""

[codes.ZK0712.title]
en = "pointers into different blocks"
[codes.ZK0712.message]
en = "these pointers point into different blocks and cannot be subtracted"
[codes.ZK0712.explain]
en = """Subtracting two pointers gives a distance, and a distance exists inside one block. Pointers into different blocks have none. Subtract pointers that were taken from the same block."""

[codes.ZK0719.title]
en = "overflow on each run"
[codes.ZK0719.message]
en = "\"%{op}\" on %{kind} gives a value outside %{kind} for each value of its operands, so the program stops here"
[codes.ZK0719.help]
en = "use a wider kind, or change the operands; with --overflow wrap the result wraps around"
[codes.ZK0719.explain]
en = """Under --overflow stop, the default, integer arithmetic stops the program when its result does not fit its kind. The check follows the values the operands can hold, and each of them makes this operation overflow, so the program stops when it reaches it. Pick a wider kind, change the operands, or compile with --overflow wrap for two's complement arithmetic."""

[codes.ZK0721.title]
en = "the ranges of a block duplicate overlap"
[codes.ZK0721.message]
en = "the source and the destination of \"ကူးယူမည်\" share %{n} octets"
[codes.ZK0721.help]
en = "write \"ပြောင်းထည့်မည်\", which reads the source in full before it writes"
[codes.ZK0721.explain]
en = """\"ကူးယူမည်\" is the memcpy of C: it writes the cells in order, so cells it writes can be cells it has still to read, and in C the result is undefined. When both addresses point into the same block at offsets the check knows, and the count is known, the overlap is an error before the program runs; else the VM stops the program with the trap \"overlap\". \"ပြောင်းထည့်မည်\" allows ranges that overlap."""

[codes.ZK0801.title]
en = "kind not for the C target"
[codes.ZK0801.message]
en = "the C target cannot build %{kind}"
[codes.ZK0801.help]
en = "use f32 or f64, or build for the VM with --target vm"
[codes.ZK0801.explain]
en = """C has no kind for a 16-bit or a 128-bit float that each C compiler holds, and no print that writes one as the VM writes it. A program built with --target c holds f32 and f64 alone; the VM runs each float kind."""
