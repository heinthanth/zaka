_version = 2

# ---------------------------------------------------------------- lexer ZK01xx

[codes.ZK0101.title]
en = "invalid character"
[codes.ZK0101.message]
en = "invalid character in \"%{w}\""
[codes.ZK0101.help_comma]
en = "lists are separated with \"၊\", not \",\""
[codes.ZK0101.explain]
en = """A word holds a character that cannot start or continue a token. Identifiers start with a letter, an underscore or an emoji and continue with letters, digits, underscores or emoji; operators are the ASCII punctuation the language defines. Other punctuation such as \",\", \";\", \"=\" on its own or \"?\" has no meaning in the language. The word is skipped and lexing goes on with the next one."""

[codes.ZK0102.title]
en = "invalid number literal"
[codes.ZK0102.message]
en = "invalid number literal \"%{w}\""
[codes.ZK0102.explain]
en = """A word that starts with a digit must be a number literal: a run of digits in one script, with an optional fraction and exponent, or (for Western digits) ASCII letters that stand for digits above 9 after a base prefix. A Burmese digit run followed with letters in the same word, such as a bit count written attached to \"ဘစ်\", is not a number; put a space between the two words."""

[codes.ZK0103.title]
en = "mixed digit scripts"
[codes.ZK0103.message]
en = "Burmese and Western digits cannot be mixed in one number"
[codes.ZK0103.explain]
en = """A number literal uses one digit script: either Burmese digits (၀ to ၉) or Western digits (0 to 9). This literal switches script inside the number, in its fraction, or where two digit runs touch without a space. Rewrite the whole literal in one script."""

[codes.ZK0104.title]
en = "unterminated string literal"
[codes.ZK0104.message]
en = "string literal is missing its closing quote before the end of the line"
[codes.ZK0104.explain]
en = """A string literal starts and ends with a double quote on the same line. The lexer reached the end of the line without finding the closing quote. Add the quote, or write \\\" for a double quote that belongs to the text. The text read so far is kept so later phases can go on."""

[codes.ZK0105.title]
en = "unterminated character literal"
[codes.ZK0105.message]
en = "character literal is missing its closing quote before the end of the line"
[codes.ZK0105.explain]
en = """A character literal starts and ends with a single quote on the same line. The lexer reached the end of the line without finding the closing quote. Add the quote, or write \\' for a single quote that belongs to the literal."""

[codes.ZK0106.title]
en = "unknown escape sequence"
[codes.ZK0106.message]
en = "unknown escape sequence \"%{e}\""
[codes.ZK0106.help_brace]
en = "write \"{{\" or \"}}\" for a literal brace"
[codes.ZK0106.explain]
en = """Inside a string or character literal, a backslash starts one of the escapes \\n, \\r, \\t, \\0, \\\\, \\', \\\" or \\u with four or eight hex digits, and braces hold a named escape such as {နောက်တစ်ကြောင်း} or {ယူနီကုဒ် HHHH}. This escape matches none of them. Braces are reserved for named escapes and, later, variable substitution, so a literal brace is written doubled: {{ or }}."""

[codes.ZK0107.title]
en = "wrong character literal length"
[codes.ZK0107.message]
en = "a character literal must hold one character, found %{n}"
[codes.ZK0107.explain]
en = """A character literal holds one Unicode scalar value between its quotes: one letter, one digit, one escape, or one emoji. This literal holds a different count. A Burmese vanna with its signs counts as several scalar values; use a string literal for text that is longer than one scalar value."""

[codes.ZK0108.title]
en = "unterminated raw identifier"
[codes.ZK0108.message]
en = "raw identifier is missing its closing backtick before the end of the line"
[codes.ZK0108.explain]
en = """A raw identifier is written between backticks on one line and can hold spaces, reserved words and operator characters. The lexer reached the end of the line without finding the closing backtick. Add it, or remove the opening one."""

[codes.ZK0109.title]
en = "blank raw identifier"
[codes.ZK0109.message]
en = "raw identifier between backticks is blank"
[codes.ZK0109.explain]
en = """Two backticks with nothing between them do not name a variable. A raw identifier needs at least one character between the backticks."""

# --------------------------------------------------------------- parser ZK02xx

[parser.help_split]
en = "write \"%{s} %{p}\" with a space: a name joined to a particle is read as one word"

[codes.ZK0201.title]
en = "unexpected token"
[codes.ZK0201.message]
en = "expected %{e}, found %{f}"
[codes.ZK0201.explain]
en = """The parser reached a token that does not fit the statement at this point; the message names what the grammar allows here. A common cause is a name written attached to a particle, such as \"အသက်ကို\": a word that is not made of reserved words alone is one identifier, so write a space between the name and the particle."""

[codes.ZK0202.title]
en = "missing operand"
[codes.ZK0202.message]
en = "expected an operand, found %{f}"
[codes.ZK0202.explain]
en = """An operand is a literal, a name, a call expression, or an expression in parentheses. A particle such as \"ကို\" or \"နှင့်\" is followed with an operand or with the verb that closes the clause, and an operator such as \"+\" is followed with an operand. Here neither comes next."""

[codes.ZK0203.title]
en = "statement verb missing"
[codes.ZK0203.message]
en = "this statement does not end in a statement verb, found %{f}"
[codes.ZK0203.help]
en = "a statement ends in \"ပြသပါ\", \"ထားပါ\" or \"ရလဒ်အဖြစ် ပြန်ပေးပါ\", or is a loop with \"နေသရွေ့\" or \"မှ ... အထိ\""
[codes.ZK0203.explain]
en = """A statement that does not start with a reserved word is a clause that ends in a statement verb: \"ပြသပါ\" (print), \"ထားပါ\" (assign) or \"ရလဒ်အဖြစ် ပြန်ပေးပါ\" (return a value). It can also be a condition followed with \"နေသရွေ့\" (a while loop) or a bound followed with \"မှ\" (a counted loop). This statement ends in a value and none of these."""

[codes.ZK0204.title]
en = "statement verb inside an expression"
[codes.ZK0204.message]
en = "statement verb \"%{v}\" cannot stand inside an expression"
[codes.ZK0204.explain]
en = """Statement verbs such as \"ပြသပါ\" and \"ထားပါ\" close a whole statement and produce no value. Here one appears inside parentheses, a call argument or a condition, where a value is needed. Move the statement out, or use a verb-noun such as \"ပေါင်းလဒ်\" that produces a value."""

[codes.ZK0205.title]
en = "too few operands"
[codes.ZK0205.message]
en = "\"%{v}\" needs %{n} operands, found %{m}"
[codes.ZK0205.explain]
en = """Each verb takes a fixed number of operands, each followed with its particle: \"ပေါင်းလဒ်\" takes two (\"a နှင့် b ၏\"), \"ဘစ်အလိုက် ပြောင်းပြန်ပြောင်းလဒ်\" takes one (\"a ၏\"), and \"ထားပါ\" takes two (\"x ကို v ဟု\"). The clause before this verb holds fewer operands than the verb needs."""

[codes.ZK0206.title]
en = "wrong particle for the verb"
[codes.ZK0206.message]
en = "\"%{v}\" needs \"%{e}\" after operand %{i}, found %{f}"
[codes.ZK0206.explain]
en = """A verb checks the particle that follows each of its operands. \"ပေါင်းလဒ်\" wants \"a နှင့် b ၏\", \"စားသော စားလဒ်\" wants \"a ကို b ဖြင့်\", the comparisons want \"a သည် b\" then \"နှင့်\", \"ထက်\" or \"အောက်\", and \"ထားပါ\" wants \"x ကို v ဟု\". The operand named in the message carries a different particle, or none."""

[codes.ZK0207.title]
en = "two particles on one operand"
[codes.ZK0207.message]
en = "this operand has the particle \"%{p}\" before this one"
[codes.ZK0207.explain]
en = """Each operand in a clause is followed with one particle that names its role. Two particles in a row leave the second one without an operand. Remove one of them, or write the missing operand between them."""

[codes.ZK0208.title]
en = "clause without a verb"
[codes.ZK0208.message]
en = "operands wait for a verb: %{w}"
[codes.ZK0208.explain]
en = """In a clause, each operand is followed with the particle of its role, and a verb at the end takes the operands it needs. Here operands are left over at the end of the clause; the message lists them with their particles. Add the verb that takes them, or remove the stranded particle."""

[codes.ZK0209.title]
en = "operands before a statement verb"
[codes.ZK0209.message]
en = "operands left over before \"%{v}\": %{w}"
[codes.ZK0209.explain]
en = """A statement verb takes its own operands and ends the statement, so no operand can be left waiting before it. The listed operands belong to no verb; add the verb that needs them, or remove them."""

[codes.ZK0210.title]
en = "chained comparison"
[codes.ZK0210.message]
en = "a comparison cannot be the operand of another comparison"
[codes.ZK0210.help]
en = "join the two comparisons with \"ဖြစ်၍\", or put the inner one in parentheses"
[codes.ZK0210.explain]
en = """Comparisons do not chain: \"a < b < c\" and \"a သည် b နှင့် ညီ သည် c နှင့် ညီသည်\" are errors. Write \"a < b ဖြစ်၍ b < c\" to test both. A comparison in parentheses is a plain boolean operand and can be compared again."""

[codes.ZK0211.title]
en = "else without if"
[codes.ZK0211.message]
en = "\"%{w}\" must follow the block of a conditional"
[codes.ZK0211.explain]
en = """\"ထိုသို့မဟုတ်ဘဲ\" (else if) and \"သို့မဟုတ်ပါက\" (else) continue a conditional statement. These come right after the block or the single statement of an \"အကယ်၍\" arm, and cannot start a statement on their own."""

[codes.ZK0212.title]
en = "update outside a generic loop"
[codes.ZK0212.message]
en = "\"ပြီးလျှင်\" can appear as the last statement of a generic loop and nowhere else"
[codes.ZK0212.explain]
en = """\"ပြီးလျှင်\" (when done) marks the update of a generic loop, the statement that runs after each iteration. It is allowed as the last statement in the block of a loop that starts with \"ကိန်းရှင် ... ဖြစ်ကာ\" or \"ကိန်းရှင် ... ဖြစ်ပြီး\", and nowhere else."""

[codes.ZK0213.title]
en = "update is not last"
[codes.ZK0213.message]
en = "the \"ပြီးလျှင်\" update must be the last statement of the loop"
[codes.ZK0213.explain]
en = """The update of a generic loop runs after the rest of the block, so it is written last, right before the block closer. Move the statements that follow it above it."""

[codes.ZK0214.title]
en = "nested function"
[codes.ZK0214.message]
en = "functions can be declared at the top level and nowhere else"
[codes.ZK0214.explain]
en = """A function declaration cannot appear inside a block, a loop, a conditional or another function. Move it to the top level of the file; functions can be called before their declaration."""

[codes.ZK0215.title]
en = "conditional as a single-statement block"
[codes.ZK0215.message]
en = "a single-statement block cannot be another conditional"
[codes.ZK0215.explain]
en = """When a conditional arm has no block phrase, its block is the single statement that follows. That statement cannot itself be a conditional, so that each else arm belongs to one clear conditional. Wrap the inner conditional in \"အောက်ပါတို့ကို လုပ်ဆောင်ပါ။\" and \"လုပ်ဆောင်စရာများ ပြီးပါပြီ။\"."""

[codes.ZK0216.title]
en = "invalid bit count"
[codes.ZK0216.message]
en = "%{n} is not a valid bit count here; use %{a}"
[codes.ZK0216.explain]
en = """Integer kinds come in 8, 16, 32, 64 and 128 bits, floating-point kinds in 16, 32, 64 and 128 bits. The bit count is written in decimal before \"ဘစ်\", in Burmese or Western digits."""

[codes.ZK0217.title]
en = "sign word on a kind that is not an integer"
[codes.ZK0217.message]
en = "a sign word can stand before \"ကိန်းပြည့်\" and no other kind"
[codes.ZK0217.explain]
en = """Floating-point numbers are signed, and characters and booleans have no sign, so the sign words \"လက္ခဏာရှိ\" and \"လက္ခဏာမဲ့\" are allowed in integer kinds and nowhere else."""

[codes.ZK0218.title]
en = "invalid number base"
[codes.ZK0218.message]
en = "%{b} is not a number base; use a decimal integer from 2 to 36"
[codes.ZK0218.explain]
en = """The base prefix \"အခြေ N ဖြင့်\" takes a decimal integer from 2 to 36. Digits above 9 are written as the letters A to Z."""

[codes.ZK0219.title]
en = "invalid digit"
[codes.ZK0219.message]
en = "\"%{d}\" is not a digit in base %{b}"
[codes.ZK0219.explain]
en = """Each digit of a literal must be below its base: 0 and 1 in base 2, 0 to 9 in base 10, and the letters A to Z (in either case) for 10 to 35 in higher bases. Letters are allowed after a base prefix above 10 and nowhere else, and a literal with a base prefix has integer digits but no fraction or exponent."""

[codes.ZK0220.title]
en = "literal out of range"
[codes.ZK0220.message]
en = "literal %{l} does not fit its kind"
[codes.ZK0220.explain]
en = """An integer literal must fit its kind: the bit count of its kind prefix, or 64 bits when no prefix is written. Unsigned kinds hold 0 to 2^bits - 1. Signed decimal literals hold up to 2^(bits-1), so that \"-128\" fits an 8-bit integer. A literal with a base prefix is a bit pattern of the full width."""

[codes.ZK0221.title]
en = "fraction in an integer literal"
[codes.ZK0221.message]
en = "an integer kind cannot hold a literal with a fraction or exponent"
[codes.ZK0221.explain]
en = """The kind prefix \"ကိန်းပြည့်\" makes the literal an integer, but this literal is written with a fraction or an exponent. Use \"ဒဿမကိန်း\" for a floating-point literal, or remove the fraction."""

[codes.ZK0222.title]
en = "invalid literal kind"
[codes.ZK0222.message]
en = "a literal kind prefix must be an integer or floating-point kind"
[codes.ZK0222.explain]
en = """A kind prefix such as \"လက္ခဏာမဲ့ ၈ ဘစ် ကိန်းပြည့်\" fixes the kind of the number that follows. Characters and booleans have literals of their own ('က', \"မှန်\"), so \"စာလုံး\" and \"မှန်မှားတန်ဖိုး\" cannot prefix a number."""

[codes.ZK0223.title]
en = "string literal outside a print statement"
[codes.ZK0223.message]
en = "a string literal is allowed as the operand of \"ပြသပါ\" and nowhere else"
[codes.ZK0223.explain]
en = """This version of the language has no string kind. A string literal can be printed with \"ပြသပါ\" but cannot be stored, compared or passed to a function."""

[codes.ZK0225.title]
en = "constant loop variable"
[codes.ZK0225.message]
en = "a generic loop variable must be declared with \"ကိန်းရှင်\""
[codes.ZK0225.explain]
en = """A generic loop updates its variable after each iteration, so the header starts with \"ကိန်းရှင်\" (variable). \"ကိန်းသေ\" (constant) declares a value that never changes and cannot start a loop."""

[codes.ZK0226.title]
en = "unmatched block closer"
[codes.ZK0226.message]
en = "this block closer has no open block to close"
[codes.ZK0226.explain]
en = """\"လုပ်ဆောင်စရာများ ပြီးပါပြီ။\" closes the block opened with \"အောက်ပါတို့ကို လုပ်ဆောင်ပါ။\" or with a function opener. Here no block is open. Remove the closer, or add the opener it belongs to."""

# -------------------------------------------------------------- resolve ZK03xx

[codes.ZK0301.title]
en = "undeclared name"
[codes.ZK0301.message]
en = "\"%{n}\" is not declared"
[codes.ZK0301.explain]
en = """A name is used before a declaration of it is in scope. Declare the variable with \"ကိန်းရှင်\" or \"ကိန်းသေ\" first, in this block or in a block around it. Names declared inside a block are not visible after the block closer."""

[codes.ZK0302.title]
en = "name declared twice"
[codes.ZK0302.message]
en = "\"%{n}\" is declared before in this scope"
[codes.ZK0302.help]
en = "pick another name, or declare it in an inner block to shadow the outer one"
[codes.ZK0302.explain]
en = """A block cannot declare the same name twice. Shadowing is allowed: an inner block can declare a name that an outer block holds, and the inner declaration hides the outer one until the inner block ends. Rename one of the two declarations, or turn the second one into an assignment."""

[codes.ZK0303.title]
en = "undeclared function"
[codes.ZK0303.message]
en = "function \"%{n}\" is not declared"
[codes.ZK0303.explain]
en = """A call names a function that no top-level \"လုပ်ဆောင်ချက် ... သည်\" declares. Functions can be called before their declaration in the file, but the declaration must exist somewhere at the top level. Check the spelling of the name."""

[codes.ZK0304.title]
en = "function declared twice"
[codes.ZK0304.message]
en = "function \"%{n}\" is declared twice"
[codes.ZK0304.explain]
en = """Two top-level declarations give a function the same name. Function names share one scope for the whole file, so each name can be declared once. Rename one of the two functions; calls use the first declaration."""

[codes.ZK0305.title]
en = "duplicate parameter"
[codes.ZK0305.message]
en = "parameter \"%{n}\" is listed twice"
[codes.ZK0305.explain]
en = """Two parameters of one function have the same name, so the second one would hide the first inside the function. Give each parameter its own name."""

[codes.ZK0306.title]
en = "assignment to a constant"
[codes.ZK0306.message]
en = "\"%{n}\" is a constant and cannot be assigned"
[codes.ZK0306.explain]
en = """A name declared with \"ကိန်းသေ\" keeps its initial value for its whole scope. To change the value later, declare it with \"ကိန်းရှင်\" instead."""

[codes.ZK0307.title]
en = "assignment to a counted-loop variable"
[codes.ZK0307.message]
en = "\"%{n}\" is a counted-loop variable and cannot be assigned"
[codes.ZK0307.explain]
en = """The variable of a counted loop (\"မှ ... အထိ ... အနေဖြင့်\") steps on its own from the first bound to the last. Assigning to it inside the loop would break that count. Use a generic loop when the variable must change in other steps, or put the value in another variable and change that one."""

[codes.ZK0308.title]
en = "constant without a value"
[codes.ZK0308.message]
en = "constant \"%{n}\" needs an initial value"
[codes.ZK0308.explain]
en = """A constant cannot be assigned later, so its declaration must give its value: write \"ဖြစ်၍ တန်ဖိုးသည်\" and the value between the kind and \"ဖြစ်ပါစေ\". A variable declared with \"ကိန်းရှင်\" can leave the value out and starts at the kind's default."""

[codes.ZK0309.title]
en = "break outside a loop"
[codes.ZK0309.message]
en = "\"ကွင်းဆက် ကို ရပ်ပါ\" stands outside a loop"
[codes.ZK0309.explain]
en = """Breaking leaves the innermost while, counted, or generic loop. Here no loop encloses the statement. Remove it, or move it inside a loop."""

[codes.ZK0310.title]
en = "continue outside a loop"
[codes.ZK0310.message]
en = "\"နောက်တစ်ကြိမ်ဆီသို့ ကျော်ပါ\" stands outside a loop"
[codes.ZK0310.explain]
en = """Continuing skips to the next iteration of the innermost while, counted, or generic loop. Here no loop encloses the statement. Remove it, or move it inside a loop."""

[codes.ZK0311.title]
en = "return outside a function"
[codes.ZK0311.message]
en = "a return statement stands outside a function"
[codes.ZK0311.explain]
en = """Returning ends the function that holds the statement. Top-level statements belong to no function, so a return there has nothing to end. Remove it, or move it into a function."""

[codes.ZK0312.title]
en = "value returned from a function without a result"
[codes.ZK0312.message]
en = "function \"%{n}\" returns nothing, but a value is returned"
[codes.ZK0312.explain]
en = """The function header opens with \"အောက်ပါတို့ကို လုပ်ဆောင်မည်\", so the function gives back no value. Write a bare \"ပြန်ပေးပါ။\" to leave the function, or start the statements with \"အောက်ပါတို့ကို လုပ်ဆောင်ကာ <kind> ရလဒ် ကို ပြန်ပေးမည်\"."""

[codes.ZK0313.title]
en = "missing return value"
[codes.ZK0313.message]
en = "function \"%{n}\" returns %{k}, but no value is returned"
[codes.ZK0313.explain]
en = """The function header promises a result, so each return statement must give one: \"<value> ကို ရလဒ်အဖြစ် ပြန်ပေးပါ။\". To return the implicit result variable, write \"ရလဒ် ကို ရလဒ်အဖြစ် ပြန်ပေးပါ။\"."""

[codes.ZK0314.title]
en = "wrong number of arguments"
[codes.ZK0314.message]
en = "function \"%{n}\" takes %{want} arguments, %{got} given"
[codes.ZK0314.explain]
en = """A call must pass one argument for each parameter of the function, in order. Add or remove arguments so the counts match the declaration."""

[codes.ZK0315.title]
en = "function without a result used as a value"
[codes.ZK0315.message]
en = "function \"%{n}\" returns nothing and cannot be used as a value"
[codes.ZK0315.explain]
en = """The call expression \"... လုပ်ဆောင်သော ရလဒ်\" needs the function to return a value, but its header has no result clause. Call it as a statement with \"လုပ်ဆောင်ပါ\", or start its statements with \"အောက်ပါတို့ကို လုပ်ဆောင်ကာ <kind> ရလဒ် ကို ပြန်ပေးမည်\"."""

# ---------------------------------------------------------------- kinds ZK04xx

[codes.ZK0401.title]
en = "mismatched kinds"
[codes.ZK0401.message]
en = "expected %{want}, found %{got}"
[codes.ZK0401.help]
en = "convert the value with \"ကို <kind> အဖြစ် ပြောင်းလဲသော ရလဒ်\""
[codes.ZK0401.explain]
en = """A value must fit the kind its place expects without losing data. Conversions happen on their own when no data can be lost: a narrower integer to a wider one of the same sign, an unsigned integer to a wider signed one, an integer to a float with enough fraction bits, and a narrower float to a wider one. Characters and booleans never convert on their own. Use the conversion verb for the others."""

[codes.ZK0402.title]
en = "condition is not a boolean"
[codes.ZK0402.message]
en = "a condition must be a boolean, found %{got}"
[codes.ZK0402.help]
en = "compare the pointer with \"ဗလာ\""
[codes.ZK0402.explain]
en = """The condition of \"အကယ်၍\", of a while loop, and of a generic loop must be a boolean value. Numbers do not count as true or false. Compare the value instead, for example \"က သည် ၀ နှင့် မညီ\"."""

[codes.ZK0403.title]
en = "operand of the wrong kind"
[codes.ZK0403.message]
en = "%{op} needs %{want}, found %{got}"
[codes.ZK0403.explain]
en = """Each operator works on certain kinds: arithmetic and \"-\" on numbers, bitwise operators and shifts on integers, logical operators, \"မဟုတ်\" and \"!\" on booleans, and ordering comparisons on numbers and characters. \"-\" of an unsigned integer is not allowed. Convert the operand first, or use another operator."""

[codes.ZK0404.title]
en = "incompatible operands"
[codes.ZK0404.message]
en = "cannot combine %{l} and %{r} without a conversion"
[codes.ZK0404.explain]
en = """The two operands of an operator are brought to one common kind, the wider of the two. Here neither kind converts to the other without losing data, for example a signed and an unsigned integer of the same width, or a 64-bit integer and a 64-bit float. Convert one operand with \"ကို <kind> အဖြစ် ပြောင်းလဲသော ရလဒ်\"."""

[codes.ZK0405.title]
en = "loop bound is not an integer"
[codes.ZK0405.message]
en = "a loop bound or step must be an integer, found %{got}"
[codes.ZK0405.explain]
en = """The bounds and the step of a counted loop must be integers. The loop variable takes the common kind of the two bounds. Convert the bound with \"ကို <kind> အဖြစ် ပြောင်းလဲသော ရလဒ်\", or use a generic loop for a float counter."""

[codes.ZK0406.title]
en = "literal does not fit"
[codes.ZK0406.message]
en = "the literal %{v} does not fit %{k}"
[codes.ZK0406.explain]
en = """An integer literal without a kind prefix takes the kind its place expects. Here the value is outside the range of that kind. Use a value inside the range, or a wider kind."""

[codes.ZK0407.title]
en = "shift too far"
[codes.ZK0407.message]
en = "shift distance %{n} is not below the %{w}-bit width"
[codes.ZK0407.explain]
en = """A shift moves the bits of a value. A constant distance must be smaller than the bit width of the shifted value; shifting an 8-bit integer 8 or more bits is an error. A distance known at run time is not checked."""

[codes.ZK0408.title]
en = "invalid conversion"
[codes.ZK0408.message]
en = "cannot convert %{from} to %{to}"
[codes.ZK0408.explain]
en = """The conversion verb converts between numbers of all kinds, between characters and integers, and from booleans to integers. Floats and characters do not convert into each other, and nothing converts into a boolean: compare the value instead, for example \"က သည် ၀ နှင့် မညီ\"."""

[codes.ZK0409.title]
en = "loop step is not positive"
[codes.ZK0409.message]
en = "the step of a counted loop must be positive"
[codes.ZK0409.explain]
en = """The step gives the distance the loop variable moves in each round. The direction comes from \"ရေတွက်၍\", \"တိုး၍\", or \"လျှော့၍\", so the step itself must be greater than zero."""

[codes.ZK0410.title]
en = "invalid assignment target"
[codes.ZK0410.message]
en = "this cannot be assigned to; a target must be a variable or a dereference"
[codes.ZK0410.explain]
en = """An assignment \"x ကို v ဟု ထားပါ။\" stores v in a place. The target before \"ကို\" must be a variable, a parameter, \"ရလဒ်\" or a dereference such as \"p ၏ တန်ဖိုး\"; a literal or a computed value has no place to store into. Assign to a variable, or dereference a pointer to store through it."""

[codes.ZK0411.title]
en = "no address"
[codes.ZK0411.message]
en = "the address of %{what} cannot be taken; variables and dereferences alone have an address"
[codes.ZK0411.explain]
en = """\"x ၏ လိပ်စာ\" and \"&x\" give the address of a place: a variable, a parameter, \"ရလဒ်\" or a dereference. A literal, the result of a call or a computed value is not stored at an address of its own. Store the value in a variable first and take the address of the variable."""

[codes.ZK0412.title]
en = "address of a fixed name"
[codes.ZK0412.message]
en = "\"%{name}\" cannot be changed, so its address cannot be taken"
[codes.ZK0412.explain]
en = """Writing through the address of a name would change the name. Constants and counted-loop variables cannot be changed, so their address cannot be taken. Store the value in a separate variable and take the address of that variable instead."""

[codes.ZK0413.title]
en = "not a pointer"
[codes.ZK0413.message]
en = "%{kind} is not a pointer and cannot be dereferenced"
[codes.ZK0413.explain]
en = """A dereference, \"p ၏ တန်ဖိုး\" or \"*p\", reads the value a pointer points at. The operand must have a pointer kind, written \"<kind> လိပ်စာ\"; numbers, characters and booleans are not pointers. Check that the operand is the pointer and not the value it points at."""

[codes.ZK0414.title]
en = "opaque pointer"
[codes.ZK0414.message]
en = "an opaque \"လိပ်စာ\" cannot be dereferenced or offset"
[codes.ZK0414.help]
en = "convert it to a pointer kind first with \"ကို <kind> လိပ်စာ အဖြစ် ပြောင်းလဲသော ရလဒ်\""
[codes.ZK0414.explain]
en = """The opaque pointer kind \"လိပ်စာ\" holds an address but no kind for the value there, so the compiler cannot tell what to read or how far to move. Convert it to a pointer kind such as \"ကိန်းပြည့် လိပ်စာ\" with the conversion verb, then dereference or offset the result."""

[codes.ZK0415.title]
en = "operator not for pointers"
[codes.ZK0415.message]
en = "the operator \"%{op}\" cannot be used on pointers"
[codes.ZK0415.explain]
en = """A pointer takes few operators: \"+\" and \"-\" with an integer to move it, \"-\" between two pointers of the same kind for the distance, and comparisons. Other operators, such as \"*\", \"/\", \"%\", the bitwise operators, shifts and negation, have no meaning on an address. Convert the pointer to \"လက္ခဏာမဲ့ ကိန်းပြည့်\" to compute with the address as a number."""

[codes.ZK0416.title]
en = "pointer kinds differ"
[codes.ZK0416.message]
en = "pointers to different kinds, %{a} and %{b}, cannot be compared or subtracted"
[codes.ZK0416.explain]
en = """Two pointers can be compared or subtracted when the kinds the two point at are the same. \"==\" and \"!=\" also accept \"ဗလာ\" or the opaque \"လိပ်စာ\" on one side. Convert one pointer to the kind of the other first."""

[codes.ZK0417.title]
en = "heap statement needs a pointer"
[codes.ZK0417.message]
en = "the heap statement needs a pointer, found %{kind}"
[codes.ZK0417.explain]
en = """The heap statements allocate space, resize it and free it through a variable that holds its address. That variable must have a pointer kind, written \"<kind> လိပ်စာ\", or the opaque \"လိပ်စာ\". Declare the variable with a pointer kind."""

[codes.ZK0418.title]
en = "address of a local returned"
[codes.ZK0418.message]
en = "returns the address of the local \"%{name}\", which is released when the function returns"
[codes.ZK0418.explain]
en = """The locals and parameters of a function are released when it returns, so an address that points at one of them is no longer valid in the caller. Reading or writing through it is caught at run time. Return the value itself, or allocate heap space with the heap statements and return its address."""

# ---------------------------------------------------------- naturalness ZK05xx

[codes.ZK0501.title]
en = "negative verb before \"သို့မဟုတ်\" takes \"ပါ\""
[codes.ZK0501.message]
en = "\"%{v}သည်\" before \"သို့မဟုတ်\" reads better as \"%{v}ပါ\""
[codes.ZK0501.help]
en = "write \"%{v}ပါ သို့မဟုတ် ...\""
[codes.ZK0501.explain]
en = """A negative verb (\"မညီ\", \"မကြီး\", \"မငယ်\", \"မမှန်\", \"မဟုတ်\") that is followed with \"သို့မဟုတ်\" carries the particle \"ပါ\" in natural Burmese, not \"သည်\". The program still runs; this is a matter of idiom. The strict-particles flag turns it into an error."""

[codes.ZK0502.title]
en = "particle before an attached \"လျှင်\" or \"နေသရွေ့\""
[codes.ZK0502.message]
en = "\"%{v}%{p}\" before \"%{n}\" reads better without the particle"
[codes.ZK0502.help]
en = "write \"%{v}%{n}\", or keep the particle and write \"ဖြစ်%{n}\""
[codes.ZK0502.explain]
en = """The attached forms \"လျှင်\" and \"နေသရွေ့\" join straight onto the verb: \"မငယ်လျှင်\", \"ကြီးနေသရွေ့\". A sentence-final particle between them is unidiomatic. To keep the particle, use the \"ဖြစ်\" forms instead: \"မငယ်သည် ဖြစ်လျှင်\", \"ကြီးသည် ဖြစ်နေသရွေ့\"."""

[codes.ZK0503.title]
en = "\"မဟုတ်\" with \"သည်\""
[codes.ZK0503.message]
en = "\"မဟုတ်%{p}\" reads better as \"မဟုတ်ပါ\" or \"မဟုတ်\""
[codes.ZK0503.help]
en = "write \"မဟုတ်ပါ\" or \"မဟုတ်\""
[codes.ZK0503.explain]
en = """The postfix negation \"မဟုတ်\" takes \"ပါ\" or no particle at all. \"မဟုတ်သည်\" and \"မဟုတ်ပါသည်\" are grammatical but unidiomatic."""

[codes.ZK0504.title]
en = "\"ပါ\" before \"ဖြစ်၍\""
[codes.ZK0504.message]
en = "\"%{v}%{p}\" before \"ဖြစ်၍\" reads better as \"%{v}သည်\""
[codes.ZK0504.help]
en = "write \"%{v}သည် ဖြစ်၍ ...\""
[codes.ZK0504.explain]
en = """Before the conjunction \"ဖြစ်၍\" (logical and) a verb carries \"သည်\": \"အသက် သည် ၁၈ အောက် မငယ်သည် ဖြစ်၍ ...\". The \"ပါ\" forms belong before \"သို့မဟုတ်\" and at the end of a quoted sentence."""

[codes.ZK0505.title]
en = "sentence printed with \"ကို\""
[codes.ZK0505.message]
en = "a sentence or a string is quoted with \"ဟု\", not marked with \"ကို\""
[codes.ZK0505.help]
en = "write \"... ဟု ပြသပါ။\""
[codes.ZK0505.explain]
en = """\"ကို\" marks a thing: a name, a number, an arithmetic result. A whole sentence, such as a comparison that ends in \"သည်\" or \"ပါ\", and a string literal are quoted with \"ဟု\" instead: \"(အသက် သည် ၃၀ နှင့် မညီပါ) ဟု ပြသပါ။\", \"\\\"မင်္ဂလာပါ\\\" ဟု ပြသပါ။\". A bare clause with no particle keeps \"ကို\"."""

[codes.ZK0506.title]
en = "value printed with \"ဟု\""
[codes.ZK0506.message]
en = "a plain value is marked with \"ကို\", not quoted with \"ဟု\""
[codes.ZK0506.help]
en = "write \"... ကို ပြသပါ။\""
[codes.ZK0506.explain]
en = """\"ဟု\" quotes a sentence or a string. A name, a number, an arithmetic result or a bare clause with no sentence-final particle is a thing, and a thing is marked with \"ကို\": \"အသက် ကို ပြသပါ။\"."""

[codes.ZK0507.title]
en = "redundant parentheses"
[codes.ZK0507.message]
en = "these parentheses are not needed"
[codes.ZK0507.help]
en = "remove the parentheses"
[codes.ZK0507.explain]
en = """The parenthesized expression is the whole operand of its place: the printed value, the assigned value, the returned value, an initial value, a loop bound, a call argument, or a condition. Such an operand is read as far as it goes, so the parentheses change nothing. Parentheses are needed around a logical expression (\"ဖြစ်၍\", \"သို့မဟုတ်\", \"မဟုတ်\") in an operand place, and inside an operator chain or a clause with more operands; the check leaves those alone."""

[codes.ZK0508.title]
en = "\"ပါ\" on a clause used as a value"
[codes.ZK0508.message]
en = "\"%{v}%{p}\" as a value reads better as \"%{v}သည်\""
[codes.ZK0508.help]
en = "write \"... %{v}သည်\""
[codes.ZK0508.explain]
en = """A clause that gives a value, as an initial value, a returned value, a call argument or a loop bound, names a fact rather than stating a sentence, so its closing verb carries \"သည်\": \"အမှတ် သည် ၄၀ အောက် မငယ်သည် ဖြစ်ပါစေ။\". The \"ပါ\" forms belong to quoted sentences (\"... ဟု ပြသပါ\", \"... ဟု ထားပါ\") and before \"သို့မဟုတ်\"."""

# -------------------------------------------------------------- folding ZK06xx

[codes.ZK0601.title]
en = "constant overflow"
[codes.ZK0601.message]
en = "%{op} on these constants does not fit %{kind}"
[codes.ZK0601.explain]
en = """An operation whose operands are all constants is worked out when the program is compiled. Here the result is outside the range of its kind, so it cannot be stored. Use a wider kind, or change the values. Conversions with \"ကို <kind> အဖြစ် ပြောင်းလဲသော ရလဒ်\" are exempt: theirs wrap or saturate as written."""

[codes.ZK0602.title]
en = "constant zero divisor"
[codes.ZK0602.message]
en = "%{op} with the constant zero as divisor"
[codes.ZK0602.explain]
en = """The right operand of an integer division or remainder is the constant zero. Integer division and remainder with a zero divisor have no result. Check the divisor, or put the division behind a condition. Float division with a zero divisor is allowed and gives an infinite or NaN value."""
