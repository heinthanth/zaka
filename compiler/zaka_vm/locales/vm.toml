_version = 2

[vm.about]
en = "Run a Zaka program on the stack machine: a source file, or a codegen artifact."

[vm.max_depth]
en = "The most nested calls before the program stops."

[vm.max_steps]
en = "The most ops to run before the program stops; no limit when absent."

[vm.max_heap]
en = "The most live heap octets before an allocation fails."

[vm.leaks]
en = "List the heap blocks left unfreed when the program ends."

[vm.leak]
en = "leak: block at %{addr}, %{size} octets"

[vm.trap.at]
en = "%{what} (in %{func}, op %{pc})"

[vm.trap.zero_divisor]
en = "integer division or remainder with zero as divisor"

[vm.trap.shift_too_far]
en = "shift distance %{distance} is not below the bit width %{bits}"

[vm.trap.stack_overflow]
en = "more than %{depth} nested calls"

[vm.trap.step_limit]
en = "stopped after %{steps} ops"

[vm.trap.step_not_positive]
en = "counted loop step is not positive"

[vm.trap.malformed]
en = "malformed ops: %{reason}"

[vm.trap.write]
en = "cannot write the output: %{msg}"

[vm.trap.null_deref]
en = "access through a null address at %{addr}"

[vm.trap.out_of_bounds]
en = "access of %{size} octets at %{addr} lands outside each live block"

[vm.trap.use_after_free]
en = "access at %{addr} inside a freed block"

[vm.trap.double_free]
en = "the block at %{addr} was freed before"

[vm.trap.bad_free]
en = "%{addr} is not the start of a live heap block"

[vm.trap.misaligned]
en = "address %{addr} is not a multiple of %{align}"

[vm.trap.bad_value]
en = "the octets at %{addr} do not form a %{kind}"

[vm.trap.out_of_mem]
en = "no heap room for %{size} octets"

[vm.trap.mixed_blocks]
en = "pointers into different blocks cannot be subtracted"

[vm.trap.block]
en = "block at %{start}, %{size} octets, %{origin}"

[vm.trap.cell_of]
en = "cell of %{func}"
