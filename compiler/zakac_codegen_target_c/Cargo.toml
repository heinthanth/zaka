[package]
name = "zakac_codegen_target_c"
version = "0.1.0"
edition.workspace = true
autotests = false

[[bin]]
name = "zakac_codegen_target_c"
path = "src/main.rs"

[dependencies]
zaka_host = { workspace = true }
bon = { workspace = true }
etcetera = { workspace = true }
rust-i18n = { workspace = true }
strum = { workspace = true }
zakac_ast = { workspace = true }
zakac_borrow_checker = { workspace = true }
zakac_cli_common = { workspace = true }
zakac_diagnostics = { workspace = true }
zakac_host_errors = { workspace = true }
zakac_i18n = { workspace = true }
zakac_ir_builder = { workspace = true }
zakac_lexer = { workspace = true }
zakac_parser = { workspace = true }
zakac_reporter = { workspace = true }
zakac_rust_sugars = { workspace = true }
zakac_semcheck = { workspace = true }
zakac_session = { workspace = true }
zakac_span = { workspace = true }
xxhash-rust = { workspace = true }


[target.'cfg(windows)'.dependencies]
find-msvc-tools = { workspace = true }

[dev-dependencies]
object = { workspace = true, features = ["archive"] }
tempfile = { workspace = true }
zaka_runtime = { workspace = true }
zaka_vm = { workspace = true, features = ["ffi"] }
zakac_codegen_target_vm = { workspace = true }

[build-dependencies]
cargo-build = { workspace = true }
cbindgen = { workspace = true }
xxhash-rust = { workspace = true }
zakac_rust_sugars = { workspace = true }

[[test]]
name = "tests"
path = "tests/main.rs"
