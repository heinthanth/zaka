_version = 2

[target_c.about]
en = "Build a native program: write C for each module, then compile it with a C compiler from the PATH."

[target_c.input]
en = "Input file, or `-` for stdin (default: stdin)"

[target_c.output]
en = "The executable to write, or with --emit lib the folder and the name of the lib, which names its files lib<name>.a, the shared lib and <name>.h (default: the name of the input, without its extension)."

[target_c.cache]
en = "The folder for the generated C (default: zakac/<folder>/<input>-<hash> in XDG_CACHE_HOME or ~/.cache, or in %LOCALAPPDATA% on Windows; .zakac_c_cache beside the input when that cannot be made)."

[target_c.emit]
en = "What to make: an executable (bin), the C files alone (c), or a C lib of the functions that code outside can call (lib): a static lib, a shared lib and a header (default: bin)."

[target_c.checks]
en = "The run-time checks of the executable: a level (none, default, mem), then checks to add (+name) or drop (-name): divide, shift, bounds, text, step, depth, null, overlap, sanitizers."

[target_c.max_depth]
en = "The most nested calls before the executable stops, under the language checks."

[target_c.max_heap]
en = "The most octets of heap blocks the executable holds at once; 0 for no cap."

[target_c.release]
en = "Build for release: leave out the source line of each statement, so a stop names the function, not the line, and the debug info of the debuggers."

[target_c.where]
en = "(in %{func}, at %{place})"

[target_c.in]
en = "(in %{func})"

[target_c.backtrace]
en = "stack backtrace (most recent call first):"

[target_c.call_at]
en = "  %{func} at %{place}"

[target_c.call]
en = "  %{func}"

[target_c.call_again]
en = "  ... the call above, %{n} times more"

[target_c.calls_more]
en = "  ... %{n} calls more"

[target_c.full_hint]
en = "note: set %{var}=full to list each call, or %{var}=0 to leave the calls out"

[target_c.lib_name]
en = "The name of a C lib in the names C calls (zk_reset_<name>, zk_last_trap_from_<name>) and in the names it links under: ASCII letters, digits and _; the name of its files when not given."

[target_c.runtime_lib]
en = "A runtime lib built for another target (cargo build -p zaka_runtime --target <triple>), to build for that OS and CPU with a C compiler for it; native-libs.txt beside it lists the OS libs it needs, one flag a line."

[target_c.cc]
en = "The C compiler, with the words before its flags (default: CC, then cc, gcc, clang or zig cc from the PATH)."

[target_c.linker]
en = "The program that links the objects, with the words before its flags (default: the C compiler)."

[target_c.cc_flag]
en = "One more flag for the C compiler, after CFLAGS; repeat it for more."

[target_c.ld_flag]
en = "One more flag for the linker, after LDFLAGS; repeat it for more."

[target_c.no_default_flags]
en = "Leave out the default C flags (-O2 -w -ffp-contract=off); -std=c11 stands, since the generated C is written for it."

[target_c.no_sanitizers]
en = "the C compiler has no sanitizers, so the build goes on without them"

[target_c.stopped]
en = "the program stopped: %{e}"

[target_c.trap.zero_divisor]
en = "integer division or remainder with zero as divisor"

[target_c.trap.shift_too_far]
en = "shift distance %{distance} is not below the bit width %{bits}"

[target_c.trap.step_not_positive]
en = "counted loop step is not positive"

[target_c.trap.overflow]
en = "the result of %{op} does not fit %{kind}"

[target_c.trap.index_out_of_range]
en = "cell %{index} is outside the list, whose cells run from %{lo} to %{hi}"

[target_c.trap.char_out_of_range]
en = "character %{index} is outside the text, whose characters run from %{lo} to %{hi}"

[target_c.trap.end_before_start]
en = "the range from %{start} to %{end} ends before it starts"

[target_c.trap.null_call]
en = "the function value holds no function to call"

[target_c.trap.closed_handle]
en = "a C function that took the handle over closed it, so it cannot be used again"

[target_c.trap.null_from_c]
en = "C gave NULL where its declaration promised a value; declare the result or the parameter as an optional, \"T ရှိကောင်းရှိနိုင်သော ဒေတာဆဲလ်\", when C can give NULL"

[target_c.trap.null_object]
en = "the object variable holds no object, so it has no field to read or write"

[target_c.trap.closure_escape]
en = "C called a closure after the call that gave it ended, and C has no leave to call it; give one with \"ခေါ်ဆိုခွင့် ပြုမည်\""

[target_c.trap.no_cell_to_remove]
en = "the list holds no cells, so it has no last cell to remove"

[target_c.trap.no_char_to_remove]
en = "the text holds no characters, so it has no last character to remove"

[target_c.trap.no_place_to_insert]
en = "no value can go in front of %{index}: the places run from %{lo} to %{hi}, and %{hi} is the end"

[target_c.trap.slice_out_of_range]
en = "%{len} cells from cell %{start} pass the end of %{limit} cells"

[target_c.trap.text_cut]
en = "a range of text at %{addr} starts or ends inside a character"

[target_c.trap.bad_utf8]
en = "the u8s at %{addr} are not UTF-8 text"

[target_c.trap.not_good]
en = "the result holds an error, not a good result: %{e}"

[target_c.trap.not_good_bare]
en = "the result holds a failure, not a good result"

[target_c.trap.assert]
en = "an assert did not hold: %{text}"

[target_c.trap.assert_bare]
en = "an assert did not hold"

[target_c.trap.not_fault]
en = "the result is a good result, not an error"

[target_c.trap.no_data]
en = "the optional holds no data"

[target_c.trap.no_row]
en = "no row of the ဇယား has this index"

[target_c.trap.wrong_variant]
en = "this read expects a different enum member"

[target_c.trap.stack_full]
en = "the stack of a light task, %{size} octets, ran full"

[target_c.trap.null_deref]
en = "access through a null address at %{addr}"

[target_c.trap.out_of_mem]
en = "no heap room for %{size} octets"

[target_c.trap.overlap]
en = "the cells at %{addr} overlap their source; \"ပြောင်းထည့်မည်\" allows that"

[target_c.trap.too_deep]
en = "more than %{depth} nested calls"

[target_c.trap.permission_denied]
en = "%{what} needs %{flag}"

[target_c.trap_mode]
en = "What a trap in a thread does: unwind ends that thread alone, and a wait for it traps in turn; abort stops the whole program."

[target_c.trap.thread_trapped]
en = "the thread %{thread} this waits for stopped at a trap"

[target_c.trap.thread_waited]
en = "the thread %{thread} this waits for gave its result to an earlier wait"

[target_c.trap.deadlock]
en = "each thread waits; none can go on"

[target_c.trap.pipe_closed]
en = "the channel %{pipe} is closed: no value can go to it, and it cannot close again"

[target_c.trap.thread_stopped]
en = "thread %{thread} stopped"

[target_c.trap.lock_broken]
en = "the lock of this object is broken: the thread that held it stopped at a trap"

[target_c.trap.threads_not_positive]
en = "the count of threads of a parallel loop or map is not positive"

[target_c.permission.read]
en = "reading \"%{s}\""

[target_c.permission.write]
en = "writing \"%{s}\""

[target_c.permission.env]
en = "reading the variable %{s} of the environment"

[target_c.permission.env_all]
en = "the environment of the start block"

[target_c.permission.ffi]
en = "calling the C function %{s}"

[target_c.permission.run]
en = "running the program %{s}"

[target_c.permission.ask]
en = "%{what}: allow it? [Y = from now on, O = once, N = no, A = each of this kind] "
