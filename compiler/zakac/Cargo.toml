[package]
name = "zakac"
version = "0.1.0"
edition.workspace = true
autotests = false

[dependencies]
bon = { workspace = true }
etcetera = { workspace = true }
rust-i18n = { workspace = true }
rustyline = { workspace = true }
strum = { workspace = true }
zakac_ast = { workspace = true }
zakac_borrow_checker = { workspace = true }
zakac_burmese_segmenter = { workspace = true }
zakac_cli_common = { workspace = true }
zakac_host_errors = { workspace = true }
zakac_i18n = { workspace = true }
zakac_codegen_target_vm = { workspace = true }
zakac_codegen_target_c = { workspace = true }
zakac_codegen_target_native = { workspace = true, features = ["jit"] }
zakac_lexer = { workspace = true }
zakac_formatter = { workspace = true }
zakac_lsp = { workspace = true, features = ["server"] }
zakac_parser = { workspace = true }
zakac_rust_sugars = { workspace = true }
zakac_ir_builder = { workspace = true }
zakac_semcheck = { workspace = true }
zaka_vm = { workspace = true, features = ["ffi"] }
zaka_host = { workspace = true }
zakac_reporter = { workspace = true }
zakac_span = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[build-dependencies]
cargo-build = { workspace = true }

[[test]]
name = "tests"
path = "tests/main.rs"
