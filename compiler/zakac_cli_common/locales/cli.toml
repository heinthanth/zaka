_version = 2

[cli.version_header]
en = """Zaka Compiler (%{component} v%{version}+%{build})
(c) %{start} - %{current} Hein Thant Maung Maung. Distributed under %{license} license."""

[cli.help]
en = "Prints help message."

[cli.config]
en = "Reads defaults from this config file, on top of the files the command finds."

[cli.version]
en = "Prints the version information."

[cli.usage_header]
en = "Usage:"

[cli.subcommands_header]
en = "Subcommands:"

[cli.options_header]
en = "Options:"

[cli.positionals_header]
en = "Positionals:"

[cli.about_header]
en = "About:"

[cli.input]
en = "Input file, or `-` for stdin (default: stdin)"

[cli.output]
en = "Output file, or `-` for stdout (default: stdout)"

[cli.output_format]
en = "Artifact output format (default: inferred from path)"

[cli.grant]
en = "Grants the right to %{right}: each one, or those listed after =, with commas between them."

[cli.grant_ffi]
en = "Grants the right to call C functions."

[cli.grant_all]
en = "Grants each right: read, write, env and ffi."

[cli.no_prompt]
en = "Asks nothing for a right the run lacks: the effect is denied at once."

[cli.allow]
en = "Leaves out each finding of a lint group or code, such as leaks, naturalness or ZK0708; a code wins over a group."

[cli.warn]
en = "Reports each finding of a lint group or code as a warning; a code wins over a group."

[cli.error]
en = "Reports each finding of a lint group or code as an error; a code wins over a group."
