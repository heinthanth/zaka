[[tools.rust]]
version = "stable"

[[tools.rust]]
version = "nightly"
components = ["rustfmt"]

[tools]
age = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:cargo-llvm-cov" = "latest"
"cargo:cargo-leptos" = "latest"

[env]
_.file = ".env"

[tasks.format]
run = "cargo +nightly fmt"
description = "Format code using rustfmt"

[tasks.test]
run = "cargo nextest run --workspace"
description = "Run tests"

[tasks."test:benches"]
run = "cargo nextest run --workspace --benches"
description = "Run benchmark code as tests"

[tasks.bench]
run = "cargo bench"
description = "Run benchmarks"

[tasks.coverage]
run = "cargo +nightly llvm-cov --workspace"
description = "Generate coverage report"

# The web fonts the website and the explorer share, served under /fonts.
[tasks."font:fetch"]
run = "trunk build --release"
dir = "website/zaka_web_ui_common/fonts"
description = "Fetch the shared web fonts from npm into target/fonts"

[tasks."explorer:serve"]
depends = ["font:fetch"]
run = "trunk serve --cargo-profile web-dev"
dir = "website/zaka_explorer"
description = "Serve the compiler explorer with live reload"

[tasks."explorer:build"]
depends = ["font:fetch"]
run = "trunk build --release --cargo-profile wasm-release"
dir = "website/zaka_explorer"
description = "Build the compiler explorer"

[tasks."check:wasm"]
run = "cargo check -p zaka_explorer --target wasm32-unknown-unknown"
description = "Check the compiler explorer for the wasm target"

[tasks."font:secret"]
run = "age-keygen"
description = "Print a new age secret for ZAKA_PDA_FONT_SECRET"

[tasks."website:vendor"]
run = "trunk build --release"
dir = "website/zaka_website/vendor"
description = "Fetch the motion libraries of the website from npm into target/vendor"

# cargo-leptos names the files after their hash on the first build alone; in
# watch mode each later build would keep serving the old names, so the islands
# would run stale code. Watch mode serves them under plain names.
[tasks."website:serve"]
depends = ["website:vendor", "font:fetch", "explorer:build_for_site"]
run = "LEPTOS_HASH_FILES=false cargo leptos watch --project zaka_website --split"
description = "Serve the website with live reload, with the explorer under /explorer"

# A folder of its own, so explorer:serve and explorer:build, which build for /,
# never overwrite the build the website serves.
[tasks."explorer:build_for_site"]
run = "trunk build --release --cargo-profile wasm-release --public-url /explorer/ --dist dist-site"
dir = "website/zaka_explorer"
description = "Build the compiler explorer to sit under /explorer on the website"
hide = true
