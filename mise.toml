[[tools.rust]]
version = "stable"
targets = ["wasm32-unknown-unknown"]

[[tools.rust]]
version = "nightly"
components = ["rustfmt"]

[tools]
age = "latest"
bun = "latest"
cargo-binstall = "latest"
clang-format = "23"
hyperfine = "latest"
typst = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:cargo-llvm-cov" = "latest"
"cargo:cargo-leptos" = "0.3.11"
"cargo:trunk" = "0.22.0"
"cargo:wasm-pack" = "latest"

[settings]
env_shell_expand = true

[env]
_.file = ".env"
LEPTOS_SITE_ADDR = '${LEPTOS_SITE_ADDR:-127.0.0.1:8000}'
LEPTOS_RELOAD_PORT = '${LEPTOS_RELOAD_PORT:-8001}'
ZAKA_SITE_ORIGIN = '${ZAKA_SITE_ORIGIN:-http://localhost:8000}'
CARGO_TERM_COLOR = '${CARGO_TERM_COLOR:-always}'

[tasks.format]
depends = ["format:rust", "format:c"]
description = "Format the Rust code with rustfmt and the C runtime with clang-format"

[tasks."format:rust"]
run = "cargo +nightly fmt"
description = "Format the Rust code with rustfmt"

[tasks."format:c"]
run = "clang-format -i compiler/*/runtime/*.c compiler/*/runtime/*.h"
shell = "bun exec"
description = "Format the C code with clang-format"

# Test

[tasks.test]
run = "cargo nextest run --workspace"
description = "Run the tests"

[tasks."test:compiler"]
run = "cargo nextest run -p 'zakac*' -p zaka_vm -p zaka_host"
description = "Run the tests of the compiler and the VM, not the web crates"

[tasks."test:benches"]
run = "cargo nextest run --workspace --benches"
description = "Run the benchmark code as tests"

[tasks."test:coverage"]
run = "cargo +nightly llvm-cov --workspace"
description = "Run the tests and report their coverage"

[tasks.bench]
run = "cargo bench"
description = "Run the benchmarks"
