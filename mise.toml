[[tools.rust]]
version = "stable"
targets = ["wasm32-unknown-unknown", "wasm32-wasip1", "wasm32-wasip2"]

[[tools.rust]]
version = "nightly"
components = ["rustfmt"]

[tools]
age = "latest"
bun = "latest"
cargo-binstall = "latest"
clang-format = "23"
"aqua:tree-sitter/tree-sitter" = "0.27.2"
hyperfine = "latest"
typst = "latest"
wasmtime = "latest"
"github:WebAssembly/wasi-sdk" = { version = "latest", bin_path = "nothing-on-the-path", strip_components = 1 }
"cargo:cargo-nextest" = "latest"
"cargo:cargo-llvm-cov" = "latest"
"cargo:cargo-leptos" = "0.3.11"
"cargo:trunk" = "0.22.0"
"cargo:wasm-pack" = "latest"

[settings]
env_shell_expand = true

[env]
_.file = ".env"
LEPTOS_SITE_ADDR = '${LEPTOS_SITE_ADDR:-127.0.0.1:8000}'
LEPTOS_RELOAD_PORT = '${LEPTOS_RELOAD_PORT:-8001}'
ZAKA_SITE_ORIGIN = '${ZAKA_SITE_ORIGIN:-http://localhost:8000}'
CARGO_TERM_COLOR = '${CARGO_TERM_COLOR:-always}'

[tasks.format]
depends = ["format:rust", "format:c", "format:zaka"]
description = "Format the Rust code with rustfmt, the C runtime with clang-format and the Zaka sources with zakac fmt"

[tasks."format:rust"]
run = "cargo +nightly fmt"
description = "Format the Rust code with rustfmt"

[tasks."format:c"]
run = "clang-format -i compiler/*/runtime/*.h"
shell = "bun exec"
description = "Format the C code with clang-format"

[tasks."format:zaka"]
# The samples written to show errors do not parse, so they are left out.
run = "cargo run -q -p zakac -- fmt $(git ls-files --cached --others --exclude-standard 'samples/*.zaka' 'stdlib/*.zaka' ':!:*_errors.zaka')"
shell = "bun exec"
description = "Format the Zaka samples and stdlib modules with zakac fmt"

# Test

[tasks.test]
run = "cargo nextest run --workspace"
description = "Run the tests"
env = { WASI_SDK_PATH = "{{ exec(command='mise where github:WebAssembly/wasi-sdk') }}" }

[tasks."test:compiler"]
run = "cargo nextest run -p 'zakac*' -p zaka_vm -p zaka_host --features zakac_codegen_target_native/disasm"
description = "Run the tests of the compiler and the VM, not the web crates"
env = { WASI_SDK_PATH = "{{ exec(command='mise where github:WebAssembly/wasi-sdk') }}" }

[tasks."test:books"]
run = "cargo nextest run -p zaka_website books::"
description = "Run the tests of the Learn and Docs pages: each code fence, link and error row"

[tasks."test:web"]
run = "cargo nextest run -p 'zaka_web*' -p zaka_explorer"
description = "Run the tests of the web crates: the site, the books and the explorer"

[tasks."test:benches"]
run = "cargo nextest run --workspace --benches"
description = "Run the benchmark code as tests"

[tasks."test:coverage"]
run = "cargo +nightly llvm-cov --workspace"
description = "Run the tests and report their coverage"

[tasks.bench]
run = "cargo bench"
description = "Run the benchmarks"
