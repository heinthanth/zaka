[workspace]
resolver = "3"
members = ["compiler/*", "website/*"]
default-members = ["compiler/zakac"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
age = "0.12"
axum = "0.8"
base64 = "0.23.1"
bon = "3.10.1"
cargo-build = { version = "1.0.0", features = ["macros"] }
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["cargo"] }
codee = "0.3.5"
console_error_panic_hook = "0.1.7"
const_for = "0.1.6"
grass = "0.13.4"
headless_chrome = { version = "1.0.22", features = ["fetch"] }
js-sys = "0.3.105"
leptos = "0.8.22"
leptos_axum = "0.8"
leptos_meta = "0.8"
leptos_router = "0.8"
leptos-scoped-style = { version = "0.1.1", features = ["scss_file"] }
leptos-use-color-mode = "0.20"
leptos-use-css-var = "0.20"
leptos-use-draggable = "0.20"
leptos-use-element = "0.20"
leptos-use-element-bounding = "0.20"
leptos-use-event-listener = "0.20"
leptos-use-interval-fn = "0.20"
leptos-use-on-click-outside = "0.20"
leptos-use-preferences = "0.20"
leptos-use-signal-debounce-throttle = "0.20"
leptos-use-storage = "0.20"
leptos-use-window = "0.20"
leptos-use-window-size = "0.20"
num_enum = "0.7.6"
postcard = { version = "1.1.3", features = ["alloc"] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
pulldown-cmark-escape = "0.11.0"
rust-i18n = "4.2.2"
rustc_apfloat = "0.2.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
serde-saphyr = "1.2.0"
serde-wasm-bindgen = "0.6.5"
shadow-rs = { version = "2.0.0", default-features = false }
strum = { version = "0.28.0", features = ["derive"] }
sys-locale = "0.3.2"
tempfile = "3.27.0"
termcolor = "1.4.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toml = "1.1.6"
tower-http = { version = "0.6", features = ["fs"] }
turf = "0.10.1"
unicode-ident = "1.0.27"
unicode-normalization = "0.1.25"
unicode-properties = "0.1.4"
unicode-width = "0.2.2"
url = "2.5.8"
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4"
web-sys = "0.3.105"
web-time = "1.1.0"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
zakac_ast = { path = "compiler/zakac_ast" }
zakac_burmese_segmenter = { path = "compiler/zakac_burmese_segmenter" }
zakac_cli_common = { path = "compiler/zakac_cli_common" }
zakac_codegen = { path = "compiler/zakac_codegen" }
zakac_consts = { path = "compiler/zakac_consts" }
zakac_diagnostics = { path = "compiler/zakac_diagnostics" }
zakac_host_errors = { path = "compiler/zakac_host_errors" }
zakac_i18n = { path = "compiler/zakac_i18n" }
zakac_ir_builder = { path = "compiler/zakac_ir_builder" }
zakac_lexer = { path = "compiler/zakac_lexer" }
zakac_parser = { path = "compiler/zakac_parser" }
zakac_reporter = { path = "compiler/zakac_reporter" }
zakac_rust_sugars = { path = "compiler/zakac_rust_sugars" }
zakac_naturalness = { path = "compiler/zakac_naturalness" }
zakac_semcheck = { path = "compiler/zakac_semcheck" }
zakac_session = { path = "compiler/zakac_session" }
zakac_span = { path = "compiler/zakac_span" }
zaka_vm = { path = "compiler/zaka_vm" }
zaka_web_builder = { path = "website/zaka_web_builder" }
zaka_web_ui_common = { path = "website/zaka_web_ui_common" }

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# The web pages, served in watch mode: the wasm and the server of the website.
# Without debug info the wasm is a fraction of the size and both link fast, so
# a change reaches the browser in seconds.
[profile.web-dev]
inherits = "dev"
debug = false
strip = "debuginfo"
