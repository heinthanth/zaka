[workspace]
resolver = "3"
members = ["compiler/*"]
default-members = ["compiler/zakac"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
bon = "3.10.1"
cargo-build = { version = "1.0.0", features = ["macros"] }
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["cargo"] }
const_for = "0.1.6"
num_enum = "0.7.6"
postcard = { version = "1.1.3", features = ["alloc"] }
rust-i18n = "4.2.2"
serde = { version = "1.0.228", features = ["derive"] }
serde-saphyr = "1.2.0"
shadow-rs = "2.0.0"
strum = { version = "0.28.0", features = ["derive"] }
sys-locale = "0.3.2"
tempfile = "3.27.0"
termcolor = "1.4.1"
unicode-ident = "1.0.27"
unicode-normalization = "0.1.25"
unicode-properties = "0.1.4"
unicode-width = "0.2.2"
zakac_ast = { path = "compiler/zakac_ast" }
zakac_burmese_segmenter = { path = "compiler/zakac_burmese_segmenter" }
zakac_cli_common = { path = "compiler/zakac_cli_common" }
zakac_consts = { path = "compiler/zakac_consts" }
zakac_diagnostics = { path = "compiler/zakac_diagnostics" }
zakac_host_errors = { path = "compiler/zakac_host_errors" }
zakac_i18n = { path = "compiler/zakac_i18n" }
zakac_lexer = { path = "compiler/zakac_lexer" }
zakac_parser = { path = "compiler/zakac_parser" }
zakac_reporter = { path = "compiler/zakac_reporter" }
zakac_rust_sugars = { path = "compiler/zakac_rust_sugars" }
zakac_session = { path = "compiler/zakac_session" }
zakac_span = { path = "compiler/zakac_span" }