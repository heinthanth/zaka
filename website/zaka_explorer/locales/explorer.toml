# ---------------------------------------------------------------- tour

[explorer.tour.skip]
en = "Skip tour"
[explorer.tour.back]
en = "Back"
[explorer.tour.next]
en = "Next"
[explorer.tour.done]
en = "Done"
[explorer.tour.count]
en = "Step %{at} of %{total}"
[explorer.tour.welcome]
en = "Welcome to Zaka Explorer"
[explorer.tour.welcome_text]
en = "Zaka Explorer shows how the Zaka compiler turns Burmese source into a running program. This short tour walks through each part of the page with a sample that builds a list of exam scores on the heap, sorts it and reports on it. Skip it at will; the code from before comes back."
[explorer.tour.samples]
en = "Samples"
[explorer.tour.samples_text]
en = "Pick a program here to load it into the editor. The tour has loaded programs/gradebook for now."
[explorer.tour.editor]
en = "Editor"
[explorer.tour.editor_text]
en = "Write Zaka code here. After each edit the program compiles and runs again, and the pane on the right follows along."
[explorer.tour.pipeline]
en = "The pipeline"
[explorer.tour.pipeline_text]
en = "Eight phases turn the source into a running program. Each stage names the part of the compiler that runs it, and the time it took. Click a phase, or press the left and right arrows, to open its view. Its dot tells whether it passed, warned, failed or was skipped. Hover a token in the editor, or move the caret onto it, to light it up in the views."
[explorer.tour.segment]
en = "1 · Segment"
[explorer.tour.segment_text]
en = "Burmese text puts no spaces between words, so the first phase cuts the source into segments: Burmese words, numbers, marks and the rest, each with its kind and its span in the source. A right-click on the head row of a table shows or hides its columns, and each table keeps the choice."
[explorer.tour.lex]
en = "2 · Lex"
[explorer.tour.lex_text]
en = "The lexer turns the segments into tokens: words of the language, names, numbers, operators and the particles that join them. Comments and strings get tables of their own."
[explorer.tour.parse]
en = "3 · Parse"
[explorer.tour.parse_text]
en = "The parser builds the abstract tree of the program. The switch at the top right shows it as a tree, an S-expression or a graph. Click a node to select its source in the editor."
[explorer.tour.check]
en = "4 · Check"
[explorer.tour.check_text]
en = "The checker works out the kind of each expression and makes sure the parts fit together, such as numbers in arithmetic and a result of the right kind from each function."
[explorer.tour.lower]
en = "5 · Lower"
[explorer.tour.lower_text]
en = "Lowering turns the tree into a simpler IR. Switch between the IR as lowered and after constant folding to see what the folding settles ahead of time."
[explorer.tour.borrow_check]
en = "6 · Borrow check"
[explorer.tour.borrow_check_text]
en = "The borrow checker follows each owner pointer and each loan through the IR. It stops a free of a borrowed address, a use after a free, a block never freed and a read past the end before the program runs."
[explorer.tour.codegen]
en = "7 · Codegen"
[explorer.tour.codegen_text]
en = "Code generation emits ops for the stack-based VM: the global slots, the pooled texts, then each function with its locals and ops. Hover an op to see its source."
[explorer.tour.run]
en = "8 · Run"
[explorer.tour.run_text]
en = "In debug mode the run is a debugger: the ops show here, the bar over the panes drives them, the dock beside them holds the VM state and the heap, and the panel below holds the output."
[explorer.tour.debug]
en = "Debug mode"
[explorer.tour.debug_text]
en = "Turn on debug mode to see each phase of the compiler and to step through the program as it runs. The tour turns it on now."
[explorer.tour.controls]
en = "Debugger controls"
[explorer.tour.controls_text]
en = "This bar drives the debugger. The next steps go through it one control at a time, from the left."
[explorer.tour.go]
en = "Continue"
[explorer.tour.go_text]
en = "Runs the program to the next break point, or to its end when there is none. Once the run has ended, it starts again from the first op. F5 does the same."
[explorer.tour.stop]
en = "Stop"
[explorer.tour.stop_text]
en = "Ends a run before its end and goes back to the first op. What the program wrote remains until the next run starts."
[explorer.tour.reset]
en = "Start again"
[explorer.tour.reset_text]
en = "Goes back to the first op with a fresh VM, to run the program again from the top. The break points remain."
[explorer.tour.step_in]
en = "Step"
[explorer.tour.step_in_text]
en = "Runs one op, then pauses. When the op calls a function, the debugger follows it into that function. F11 does the same."
[explorer.tour.step_over]
en = "Step over"
[explorer.tour.step_over_text]
en = "Runs one op, like step, but a call runs whole and the debugger pauses after it returns, in the same function. F10 does the same."
[explorer.tour.step_out]
en = "Step out"
[explorer.tour.step_out_text]
en = "Runs on to the end of the current call and pauses back in the function that called it. Shift+F11 does the same."
[explorer.tour.timer]
en = "Step on a timer"
[explorer.tour.timer_text]
en = "Steps through the program on its own, one op at a time, so the run can be watched. It is on now; press it again to pause."
[explorer.tour.speed]
en = "Timer speed"
[explorer.tour.speed_text]
en = "The number of ops the timer runs each second, from 1 to 100."
[explorer.tour.status]
en = "Status"
[explorer.tour.status_text]
en = "Where the run stands: at the start, running, paused, stopped, finished or trapped. The chips beside it give the ops run so far, the compile time over the run time, and the most heap and stack the run held at once."
[explorer.tour.ops]
en = "Ops"
[explorer.tour.ops_text]
en = "The timer is now stepping through the program. The marked row is the op that runs next, and the editor lights up its source. Click the gutter beside an op, or beside a line of the code, to set a break point."
[explorer.tour.machine]
en = "VM state"
[explorer.tour.machine_text]
en = "The dock holds the VM state, each part in a pane of its own. The registers: PC points at the next op, SP at the free slot over the stack, BP at the frame of the innermost call. Under them, each call in progress has a frame with its locals, and the Block column gives the address of the block each one lives in; click a frame to show that call. Globals come next."
[explorer.tour.heap]
en = "RAM"
[explorer.tour.heap_text]
en = "Each block the program uses shows here: the globals, a block for each local of each call in progress, and the heap room it asked for. The map sets them out in address order; a freed block stands hatched in quarantine, and once the run finishes a block never freed shows as leaked. Click a block to see its octets, or click a pointer in the stack to find its block. The map marks each gap between blocks, where an access traps, with a hatched red seam; the Gaps switch at the end of the line of counts lists the gaps with the blocks too."
[explorer.tour.panel]
en = "Output and problems"
[explorer.tour.panel_text]
en = "In debug mode the output and the problems share the panel under the stage. A press of Continue turns it to the output; new errors turn it to the problems."
[explorer.tour.output]
en = "Run"
[explorer.tour.output_text]
en = "The run button starts the program and stop halts it; what it prints shows up here. To run it each time the code compiles, turn on Auto run in the settings. If the run stops on an error, the trap shows under the output; problems in the code open a panel below."
[explorer.tour.options]
en = "Compiler options"
[explorer.tour.options_text]
en = "This button opens the compiler options: the platform bits, the foldings of constant operations, names and branches in the IR, and the heap limit of a run. A change takes effect at once, so the Lower and Codegen views show what each folding does. The settings hold the same options."
[explorer.tour.settings]
en = "Settings and more"
[explorer.tour.settings_text]
en = "Turn debug mode on or off, show or hide the editor, open About, or change the theme, the fonts, the language, auto run and the compiler options. To take this tour again, open About and pick Onboarding."
[explorer.tour.finish]
en = "That’s all"
[explorer.tour.finish_text]
en = "When the tour closes, the code from before comes back. Then pick a sample, or write something new; turn on debug mode to watch it pass through each phase."
