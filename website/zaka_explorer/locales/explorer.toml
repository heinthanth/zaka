en = "The most heap a run can hold at once; past it, a new block comes back as null (ဗလာ) and a resize traps. Auto uses the RAM the browser reports, up to the 4 GiB a WebAssembly page can address."
[explorer.settings.frames]
en = "Variables"
[explorer.settings.frames_note]
en = "Checked gives each variable a block of its own, so reading or writing past one stops the program. Packed puts the locals of a call next to each other, as C does, so a read past one finds the next."
[explorer.settings.frames_checked]
en = "Checked"
[explorer.settings.frames_packed]
en = "Packed, as C"
[explorer.settings.mem_check]
en = "Ownership check"
[explorer.settings.mem_check_note]
en = "What a proven pointer mistake does. Error stops the build on the line at fault; warn still builds, so the VM shows the trap; off reports nothing. A move leaves ဗလာ behind in each mode."
[explorer.settings.mem_check_error]
en = "Error"
[explorer.settings.mem_check_warn]
en = "Warn"
[explorer.settings.mem_check_off]
en = "Off"
[explorer.settings.mem_strict]
en = "Strict ownership check"
[explorer.settings.mem_strict_note]
en = "Also warn about a pointer that can be ဗလာ, such as a fresh allocation never compared with ဗလာ."
[explorer.settings.no_raw]
en = "Forbid raw addresses"
[explorer.settings.no_raw_note]
en = "Reject each kind written with လိပ်စာအကြမ်း, so a lesson cannot step around the check."
[explorer.settings.heap_auto]
en = "Auto (%{size})"
[explorer.settings.platform_bits]
en = "Platform bits"
[explorer.settings.platform_bits_note]
en = "Bit count of isize, usize and addresses. At 8 bits the address space holds 256 octets, room for about seven variables."
[explorer.settings.platform_bits_choice]
en = "%{n}-bit"
[explorer.settings.fold_exprs]
en = "Fold constant operations"
[explorer.settings.fold_exprs_note]
en = "Replaces an operation on constants with its value. Overflow and zero divisors are reported when it is off too."
[explorer.settings.fold_consts]
en = "Fold constant names"
[explorer.settings.fold_consts_note]
en = "Replaces a read of a ကိန်းသေ set to a constant with its value."
[explorer.settings.fold_branches]
en = "Fold constant branches"
[explorer.settings.fold_branches_note]
en = "Keeps the taken branch of an if on a constant, and drops a loop whose condition is false."

