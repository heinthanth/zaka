[package]
name = "zaka_website"
version = "0.1.0"
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "zaka_website"
path = "src/main.rs"
required-features = ["server"]

[dependencies]
axum = { workspace = true, optional = true }
bon = { workspace = true }
console_error_panic_hook = { workspace = true }
js-sys = { workspace = true }
leptos = { workspace = true, features = ["islands"] }
leptos-scoped-style = { workspace = true }
leptos-use-event-listener = { workspace = true }
leptos-use-window = { workspace = true }
leptos_axum = { workspace = true, optional = true }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }
pulldown-cmark = { workspace = true }
pulldown-cmark-escape = { workspace = true }
rust-i18n = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
turf = { workspace = true }
wasm-bindgen = { workspace = true }
zaka_vm = { workspace = true }
zaka_web_ui_common = { workspace = true }
zakac_borrow_checker = { workspace = true }
zakac_codegen = { workspace = true }
zakac_consts = { workspace = true }
zakac_diagnostics = { workspace = true }
zakac_i18n = { workspace = true }
zakac_ir_builder = { workspace = true }
zakac_lexer = { workspace = true }
zakac_reporter = { workspace = true }
zakac_rust_sugars = { workspace = true }
zakac_semcheck = { workspace = true }
zakac_span = { workspace = true }

[dependencies.web-sys]
workspace = true
features = [
    "Document",
    "DomRect",
    "DomTokenList",
    "Element",
    "Event",
    "EventTarget",
    "FontFaceSet",
    "KeyboardEvent",
    "MediaQueryList",
    "MouseEvent",
    "NodeList",
    "Window",
]

[dev-dependencies]
toml = { workspace = true }

[build-dependencies]
cargo-build = { workspace = true }
zaka_web_builder = { workspace = true }

[features]
client = ["leptos/hydrate"]
server = [
    "dep:axum",
    "dep:leptos_axum",
    "dep:tokio",
    "dep:tower-http",
    "leptos-use-event-listener/ssr",
    "leptos-use-window/ssr",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "zaka_web_ui_common/ssr",
]

# cargo-leptos: the server binary renders the page, the library builds the
# islands into wasm.
[package.metadata.leptos]
output-name = "zaka_website"
site-root = "target/website"
site-pkg-dir = "pkg"
site-addr = "127.0.0.1:3000"
reload-port = 3001
bin-features = ["server"]
bin-default-features = false
lib-features = ["client"]
lib-default-features = false
bin-profile-dev = "web-dev"
lib-profile-dev = "web-dev"
lib-profile-release = "wasm-release"
# The wasm, its glue and the sheet get names made from a hash of their
# content, as the pictures and fonts do.
hash-files = true
# The sheets and the locale tables reach the Rust code through macros, and
# the build script names the pictures and fonts in assets/ after a hash of
# their content, so cargo-leptos does not see them on its own; a change to
# one rebuilds both the server and the islands. The paths are from the
# workspace root.
watch-additional-files = [
    "website/zaka_website/src",
    "website/zaka_website/locales",
    "website/zaka_website/assets",
    "website/zaka_web_ui_common/src",
    "website/zaka_web_ui_common/locales",
    "docs/learn",
]

# turf: the sheets of the components, built with their classes renamed after
# a hash, so no class of one section reaches another. The names come from
# the content of the sheet alone, never at random: the server and the
# islands are built apart and must agree on them. The page sheet and the
# token colors of the lexer keep their names, as other code sets them.
[package.metadata.turf]
minify = true
# lightningcss adds the vendor prefixes these browsers still need.
browser_targets = ["defaults"]

[package.metadata.turf.class_names]
template = "z<name_hash_short><style_sheet_hash_short>"
excludes = ["^tok-"]

# Debug builds keep the source name in front, so the classes read in the
# browser tools.
[package.metadata.turf-dev]
minify = true
browser_targets = ["defaults"]

[package.metadata.turf-dev.class_names]
template = "<original_name>-<style_sheet_hash_short>"
excludes = ["^tok-"]
