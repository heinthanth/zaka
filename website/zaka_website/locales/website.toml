# ---------------------------------------------------------------- traits

[website.traits.head]
en = "Zaka in three words"
[website.traits.natural]
en = "Natural"
[website.traits.natural_text]
en = "Programs read as Burmese sentences: the verb comes last and particles mark each word. A check warns when the wording reads unnatural."
[website.traits.natural_link]
en = "Natural wording"
[website.traits.safe]
en = "Safe"
[website.traits.safe_text]
en = "The borrow checker catches ownership mistakes before the program runs, and the VM checks each read and write while it runs."
[website.traits.safe_link]
en = "Ownership and borrowing"
[website.traits.portable]
en = "Portable"
[website.traits.portable_text]
en = "Programs compile to instructions for the Zaka VM, which runs in the terminal and in the browser. C, LLVM and JavaScript targets are planned."
[website.traits.portable_link]
en = "The Zaka VM"

# ---------------------------------------------------------------- name

[website.name.head]
en = "What does Zaka mean?"
[website.name.text]
en = "Zaka sounds similar to စံကား, which in Burmese means the plumeria flower, also known as the frangipani. Take the mark ံ off its first letter and the word reads စကား, which in Burmese means speech."
[website.name.plumeria]
en = "plumeria"
[website.name.mark]
en = "the mark"
[website.name.speech]
en = "speech"
[website.name.photo]
en = "Frangipani flowers, cream with a gold heart."

# ---------------------------------------------------------------- glance

[website.glance.head]
en = "Zaka at a glance"
[website.glance.variable]
en = "ကိန်းရှင် makes a variable: a name, a kind and a first value."
[website.glance.count]
en = "Count from ၁ to ၁၀ and add each number to the total."
[website.glance.verb]
en = "The verb comes last. ဟု quotes a sentence, so the compiler warns: a plain value takes ကို."
[website.glance.particles]
en = "Particles mark each role: သည် the subject, ထက် what it is compared with."
[website.glance.stop]
en = "Otherwise. Each statement ends at ။, not at the end of the line."
[website.glance.warning]
en = "Warning"
[website.glance.edit]
en = "Edit in the explorer"
[website.glance.about]
en = "Zaka turns plain Burmese into real programs. Write a sentence, and it runs."
[website.glance.about_run]
en = "Behind it, a careful compiler checks each line, catches mistakes before the program runs, and explains each one in plain words."

