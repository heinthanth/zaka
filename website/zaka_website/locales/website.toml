# ---------------------------------------------------------------- name

[website.name.head]
en = "What does Zaka mean?"
[website.name.text]
en = "Zaka sounds similar to စံကား, which in Burmese means the plumeria flower, also known as the frangipani. Take the mark ံ off its first letter and the word reads စကား, which in Burmese means speech."
[website.name.plumeria]
en = "plumeria"
[website.name.mark]
en = "the mark"
[website.name.speech]
en = "speech"
[website.name.photo]
en = "Frangipani flowers, cream with a gold heart."

# ---------------------------------------------------------------- bands

[website.bands.rust]
en = "In Rust"
[website.bands.head]
en = "Almost like a natural Burmese sentence"
[website.bands.verb]
en = "The verb comes last, as in Burmese."
[website.bands.verb_more]
en = "အသက် (age), then ကို to mark it as the object, then the verb ပြသပါ (show) to close the clause."
[website.bands.particle]
en = "Particles mark what each word does."
[website.bands.particle_more]
en = "သည် marks the subject and ထက် the thing it is compared with, as a Burmese sentence would."
[website.bands.digit]
en = "Numbers are written in Burmese digits."
[website.bands.digit_more]
en = "Burmese digits from ၀ to ၉, with plain integer arithmetic underneath; this line prints 42."
[website.bands.stop]
en = "A statement ends at ။, not at the line break."
[website.bands.stop_more]
en = "Two statements on one line: ။ ends each, and a line break between them would change nothing."
[website.bands.space]
en = "A space is the one word break."
[website.bands.space_more]
en = "Burmese runs its words together and the compiler can't guess where the words end without a proper wordlist or NLP, so a space is used to mark the end of each word when needed."

