[website.hero.lede]
en = "Zaka is a programming language based on a subset of Burmese. Burmese sentences compile to instructions for the Zaka VM, or to machine code through Cranelift or C."

# ---------------------------------------------------------------- traits

[website.traits.head]
en = "Zaka in three words"
[website.traits.natural]
en = "Natural"
[website.traits.natural_text]
en = "Programs read as Burmese sentences: the verb comes last, particles mark each role and each kind takes its measure word. A check warns when the wording reads unnatural."
[website.traits.natural_link]
en = "Natural wording"
[website.traits.safe]
en = "Safe"
[website.traits.safe_text]
en = "No null and no exceptions: a missing value is an optional, a failure is a value, and control never jumps to a hidden handler."
[website.traits.safe_link]
en = "Errors and results"
[website.traits.portable]
en = "Portable"
[website.traits.portable_text]
en = "Programs run in the Zaka VM, in the terminal and in the browser, or as machine code: at once through the JIT, or built through Cranelift or C into a native executable that calls C libraries."
[website.traits.portable_link]
en = "Native programs"

# ---------------------------------------------------------------- features

[website.features.head]
en = "What Zaka has"
[website.features.structs]
en = "Structs and shared objects"
[website.features.structs_text]
en = "Structs group named fields. A struct is a value, or a shared object that each name reaches."
[website.features.tables]
en = "Lists and tables"
[website.features.tables_text]
en = "Lists grow and shrink; a table maps each index to its row, as a hash map does."
[website.features.results]
en = "Results and optionals"
[website.features.results_text]
en = "A function gives back a value or a failure, and a value that can be missing is marked in its kind."
[website.features.generics]
en = "Generics and traits"
[website.features.generics_text]
en = "One function serves each kind; a trait names the functions a kind must have."
[website.features.closures]
en = "Closures"
[website.features.closures_text]
en = "Functions are values: pass them, keep them, and let them capture the variables around them."
[website.features.stdlib]
en = "Modules and the stdlib"
[website.features.stdlib_text]
en = "Split a program into files and import names; the stdlib, written in Zaka, adds text, path, list and file helpers."
[website.features.c]
en = "Calling C"
[website.features.c_text]
en = "Declare a C function with the lib it comes from, and call it from the VM or from a native build."
[website.features.editors]
en = "Editors"
[website.features.editors_text]
en = "zakac lsp gives errors, hovers, completion, renames and an outline in VS Code, Zed and other editors."

# ---------------------------------------------------------------- name

[website.name.head]
en = "What does Zaka mean?"
[website.name.text]
en = "Zaka sounds similar to စံကား, which in Burmese means the plumeria flower, also known as the frangipani. Take the mark ံ off its first letter and the word reads စကား, which in Burmese means speech."
[website.name.plumeria]
en = "plumeria"
[website.name.mark]
en = "the mark"
[website.name.speech]
en = "speech"
[website.name.photo]
en = "Frangipani flowers, cream with a gold heart."

# ---------------------------------------------------------------- glance

[website.glance.head]
en = "Zaka at a glance"
[website.glance.warning]
en = "Warning"
[website.glance.about]
en = "Zaka turns plain Burmese into real programs. Write a sentence, and it runs."
[website.glance.about_run]
en = "Behind it, a careful compiler checks each line, catches mistakes before the program runs, and explains each one in plain words."

# ---------------------------------------------------------------- close

[website.close.head]
en = "Explore the Zaka language."
[website.close.text]
en = "The explorer runs Zaka in the browser: it shows each stage from the words to the VM, steps through a run, and shows the C of the C target and the CLIF of the native target."

